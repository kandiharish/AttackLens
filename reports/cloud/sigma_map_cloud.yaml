
# =====================================================================================================================
# Cloud audit logs: SigmaHQ rules/cloud/{aws,azure,gcp} (DRAFT, reports/cloud/rule_catalog.md §6).
# Append this whole block to the END of config/sigma_map.yaml, then apply reports/cloud/sigma_patch.md.
#
# Why new top-level keys (cloud_logsources / technique_override / cloud_disable / level_override) instead of more
# `logsources:` / `disable:` entries: config.load_config uses yaml.safe_load, where a repeated top-level key silently
# REPLACES the earlier one, so an appended `logsources:` or `disable:` would drop every existing entry. Until the
# patch is applied the current compiler ignores these four keys (no behaviour change; the Sigma cache key changes
# once).
#
# Measured with the patch (reports/cloud/sigma_patch.md §3): 226 cloud files -> 134 compile; running 71 = 33 at own
# level + 38 level_override (37 context low + 1 raised to medium); 63 compiled but disabled (11 of the 16 noisy, 52
# catalog §6.6); 92 skipped (55 unmapped_logsource, 25 no_attack_technique_tag, 12 unmapped_field).
#
# Rules of this block (CLAUDE.md, DEVELOPMENT.md §11):
# - Every gate is `source_type = '<one cloud type>'` (types from config/sources.yaml json_sources): no cloud field
#   or keyword is ever evaluated on another source type, and test_sigma3's gate regex can read the source type.
# - Each entry has its OWN `fields` (patch: they replace the global `fields` for that logsource), so cloud names such
#   as Status / category / userAgent never leak into windows / proxy rules, and windows names (Image, User ...)
#   never compile into a cloud rule.
# - JSON reads use DuckDB's `raw_line->>'$.path'` inside
#   CASE WHEN source_type = '<type>' AND action <> 'malformed' THEN ... END: never on another source type, never on a
#   malformed line (json_extract on invalid JSON raises). raw_line of these JSON sources is label-stripped at ingest
#   (sources.yaml label_keys / label_nested_keys). No path names a label key (threat, rule, labels, labels_extra,
#   event.kind, event.severity); GCP resource.labels is not read either.
# - Keyword search (raw_line) only for azure_activity / gcp_audit, guarded by source_types; exclude_regex: false
#   switches the JSON/CEF exclusion off for these entries only (patch), because every cloud line is JSON.
# - riskdetection / pim / google_workspace / m365: NOT added (no ingested source; their rules stay
#   unmapped_logsource).
# =====================================================================================================================
cloud_logsources:
  # ---- AWS CloudTrail (management events; one record per line) ----------------------------------------------------
  - name: aws_cloudtrail
    product: aws
    service: cloudtrail
    gate: "source_type = 'cloudtrail_json'"
    fields:
      eventName: signature
      eventSource: app
      status: outcome                       # aws_delete_saml_provider: status 'success'
      errorCode: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.errorCode' END"
      errorMessage: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.errorMessage' END"
      eventType: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.eventType' END"
      # raw sourceIPAddress ('AWS Internal', '*.amazonaws.com' stay visible; canonical src_ip is NULL for them)
      sourceIPAddress: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.sourceIPAddress' END"
      userAgent: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.userAgent' END"
      userIdentity.type: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.userIdentity.type' END"
      userIdentity.arn: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.userIdentity.arn' END"
      userIdentity.sessionContext.sessionIssuer.type: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.userIdentity.sessionContext.sessionIssuer.type' END"
      additionalEventData.MFAUsed: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.additionalEventData.MFAUsed' END"
      # objects / arrays come back as JSON text: only |contains rules use these
      requestParameters: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters' END"
      responseElements: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.responseElements' END"
      requestParameters.attribute: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.attribute' END"
      requestParameters.enable: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.enable' END"
      requestParameters.layers: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.layers' END"
      # containerDefinitions is an array: the whole array as JSON text (the only rule uses |contains)
      requestParameters.containerDefinitions.command: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.containerDefinitions' END"
      requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls' END"
      requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy' END"
      requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls' END"
      requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets' END"
      responseElements.ConsoleLogin: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.responseElements.ConsoleLogin' END"
      responseElements.publiclyAccessible: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.responseElements.publiclyAccessible' END"
      responseElements.pendingModifiedValues.masterUserPassword: "CASE WHEN source_type = 'cloudtrail_json' AND action <> 'malformed' THEN raw_line->>'$.responseElements.pendingModifiedValues.masterUserPassword' END"
      # NOT mapped: requestParameters.userName (fieldref target of aws_update_login_profile, disabled below)

  # ---- Azure Activity Log (ARM operations: signature = OperationNameValue 'MICROSOFT.<RP>/<TYPE>/<VERB>') ----------
  # azure_activity_json also carries Entra AuditLogs; the ARM operation name prefix splits the two without JSON.
  # (REST / Event Grid shape, operationName {value: ...}: needs the ingest alias $.operationName.value first,
  # rule_catalog.md §2.1 item 1; until then those rows fall to azure_audit and match nothing there.)
  - name: azure_activity
    product: azure
    service: activitylogs
    gate: "source_type = 'azure_activity_json' AND starts_with(lower(signature), 'microsoft.')"
    keywords: {expr: raw_line, source_types: [azure_activity_json], exclude_regex: false}
    fields:
      operationName: signature
      resourceId: host                      # full _ResourceId, lower case (rules use |contains)
      category: "CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.CategoryValue', raw_line->>'$.category.value', raw_line->>'$.Category', raw_line->>'$.category') END"
      # NOT mapped: properties.message (only used by the Intune rule azure_device_or_configuration_modified_or_deleted)

  # ---- Entra ID AuditLogs (Log Analytics columns or diagnostic export properties.*) --------------------------------
  - name: azure_audit
    product: azure
    service: auditlogs
    gate: "source_type = 'azure_activity_json' AND NOT starts_with(lower(coalesce(signature, '')), 'microsoft.')"
    fields:
      OperationName: signature
      operationName: signature
      # activity display name (Log Analytics: equals OperationName)
      properties.message: &au_name "coalesce(CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.ActivityDisplayName', raw_line->>'$.activityDisplayName', raw_line->>'$.properties.activityDisplayName') END, signature)"
      ActivityDisplayName: *au_name
      ActivityType: *au_name
      activityType: *au_name
      Category: &au_cat "CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.Category', raw_line->>'$.category', raw_line->>'$.properties.category') END"
      category: *au_cat
      LoggedByService: "CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.LoggedByService', raw_line->>'$.loggedByService', raw_line->>'$.properties.loggedByService') END"
      Status: outcome                       # success / failure (Result / resultType at ingest)
      properties.result: outcome
      # targetResources (with modifiedProperties) as JSON text: every rule on these uses |contains
      TargetResources: &au_tr "CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.TargetResources', raw_line->>'$.targetResources', raw_line->>'$.properties.targetResources') END"
      properties.targetResources: *au_tr
      TargetResources.modifiedProperties: *au_tr
      TargetResources.modifiedProperties.newValue: *au_tr
      TargetResources.ModifiedProperties.NewValue: *au_tr
      additionalDetails.additionalInfo: "CASE WHEN source_type = 'azure_activity_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.AdditionalDetails', raw_line->>'$.additionalDetails', raw_line->>'$.properties.additionalDetails') END"
      # NOT mapped (rules skipped): ConsentContext.IsAdminConsent, failure_status_reason, targetResources.type (list
      # equality), TargetResources.ModifiedProperties.DisplayName (equality on a list), Initiatedby / Target ('UPN'
      # placeholders)

  # ---- Entra ID SigninLogs (Log Analytics columns or diagnostic export properties.*) -------------------------------
  - name: azure_signin
    product: azure
    service: signinlogs
    gate: "source_type = 'azure_signin_json'"
    fields:
      Status: outcome                       # ResultType 0 -> success; MFA interrupts -> NULL; other -> failure
      ResultType:
        expr: "TRY_CAST(CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.ResultType', raw_line->>'$.resultType', raw_line->>'$.Status.errorCode', raw_line->>'$.properties.status.errorCode') END AS INTEGER)"
        type: INTEGER
      ResultDescription: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.ResultDescription', raw_line->>'$.resultDescription', raw_line->>'$.Status.failureReason', raw_line->>'$.properties.status.failureReason') END"
      AuthenticationRequirement: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.AuthenticationRequirement', raw_line->>'$.properties.authenticationRequirement') END"
      conditionalAccessStatus: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.ConditionalAccessStatus', raw_line->>'$.properties.conditionalAccessStatus') END"
      ResourceDisplayName: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.ResourceDisplayName', raw_line->>'$.properties.resourceDisplayName') END"
      RiskState: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.RiskState', raw_line->>'$.properties.riskState') END"
      userAgent: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.UserAgent', raw_line->>'$.userAgent', raw_line->>'$.properties.userAgent') END"
      DeviceDetail.isCompliant: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.DeviceDetail.isCompliant', raw_line->>'$.properties.deviceDetail.isCompliant') END"
      DeviceDetail.trusttype: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.DeviceDetail.trustType', raw_line->>'$.properties.deviceDetail.trustType') END"
      DeviceDetail.deviceId: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.DeviceDetail.deviceId', raw_line->>'$.properties.deviceDetail.deviceId') END"
      NetworkLocationDetails: "CASE WHEN source_type = 'azure_signin_json' AND action <> 'malformed' THEN coalesce(raw_line->>'$.NetworkLocationDetails', raw_line->>'$.properties.networkLocationDetails') END"
      # NOT mapped (rules skipped): properties.message (device-code / ROPC: native rules), ActivityDetails,
      # ClientApp, Username ('UPN' placeholder)

  # ---- GCP Cloud Audit Logs ----------------------------------------------------------------------------------------
  - name: gcp_audit
    product: gcp
    service: gcp.audit
    gate: "source_type = 'gcp_audit_json'"
    keywords: {expr: raw_line, source_types: [gcp_audit_json], exclude_regex: false}
    fields:
      gcp.audit.method_name: signature
      data.protoPayload.methodName: signature
      data.protoPayload.serviceName: app
      # the rule's path is wrong (logName / resource are top level): read the right place; the log id after
      # '/logs/' so 'cloudaudit.googleapis.com%2Factivity' compares as the rule writes it
      data.protoPayload.logName: "CASE WHEN source_type = 'gcp_audit_json' AND action <> 'malformed' THEN NULLIF(regexp_extract(raw_line->>'$.logName', '/logs/(.+)$', 1), '') END"
      data.protoPayload.resource.type: "CASE WHEN source_type = 'gcp_audit_json' AND action <> 'malformed' THEN raw_line->>'$.resource.type' END"
      # NOT mapped (rule skipped): data.protoPayload.authorizationInfo.* (list of {permission, granted})

# ATT&CK technique for rules that carry tactic tags only (otherwise skipped as no_attack_technique_tag). Compile-time
# (part of the Sigma cache key); used only when the rule has no technique tag of its own. v20 ids (attack_v20.json).
