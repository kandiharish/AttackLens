  - {id: 39c9f26d-6e3b-4dbb-9c7a-4154b0281112, technique: T1485}       # aws_cloudtrail_bucket_deleted: Data Destruction
  - {id: a5ffb6ea-c784-4e01-b30a-deb6e58ca2ab, technique: T1535}       # aws_cloudtrail_region_enabled: Unused/Unsupported Cloud Regions
