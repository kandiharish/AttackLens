# docker compose up -d   ->   http://localhost:8000  (API under /api, SPA at /; other host port: ATTACKLENS_PORT=8001)
# First start generates data/raw/demo (200 MB synthetic) and runs the pipeline into data/out/demo (~1 min).
services:
  attacklens:
    build: .
    image: attacklens:latest
    ports:
      - "${ATTACKLENS_PORT:-8000}:8000"   # host port: ATTACKLENS_PORT=8001 docker compose up -d
    volumes:
      - ./data:/app/data
    environment:
      ATTACKLENS_OUT: /app/data/out/demo
      DEMO_SIZE: 200M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
