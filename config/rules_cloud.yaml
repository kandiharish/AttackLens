          AND (coalesce(g_req, '') ILIKE '%allUsers%' OR coalesce(g_req, '') ILIKE '%allAuthenticatedUsers%'
               OR len(list_filter(regexp_extract_all(coalesce(g_req, ''), '"(?:user|serviceAccount|group|domain):[^"@]*@?([^"]+)"', 1),
