    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 50
    branches:
      # Entra ID Protection sign-in risk (vendor verdict in a raw log field, like SigninLogs RiskLevelDuringSignIn)
      - match: "is_idp AND rk IN {cfg.idp_signin_types}"
        outcome: any
        severity_sql: &idp_sev >-
          CASE WHEN lower(coalesce(rk_state, '')) IN {cfg.idp_closed_states} OR lower(coalesce(rk_level, '')) IN ('low', 'none')
               THEN 35 WHEN lower(rk_level) = 'high' THEN 65 END
      # an analyst confirmed the account compromised (risk event or risky user state)
      - match: >-
          is_idp AND (lower(coalesce(rk_state, '')) = 'confirmedcompromised'
                      OR lower(coalesce(rk_detail, '')) = 'adminconfirmedusercompromised')
        outcome: any
        severity: 80

