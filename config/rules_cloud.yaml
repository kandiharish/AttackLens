  - id: m365_mass_download
    clouds: [m365]
    technique: T1213
    sub_technique: T1213.002
    tactic: Collection
    severity: 70
    branches:
      # interactive (browser / web) downloads from one IP: nobody pulls 50 distinct files an hour by hand. Keyed on the
      # IP too, so the burst starts at the first download of THAT source, not at the user's own earlier downloads.
      - template: distinct_burst
        filter: "is_m365 AND api IN ('FileDownloaded', 'FileDownloadedFromBrowser') AND actor_key IS NOT NULL"
        outcome: any
        params: {key: [actor_key, "coalesce(src_ip, '')"], distinct: "coalesce(file_path, CAST(source_seq AS VARCHAR))",
                 window_ms: "{cfg.m365_download_window_ms}", min_distinct: "{cfg.m365_download_min}"}
      # sync client (OneDrive / SharePoint library sync): far above the user's own sync volume
      - template: distinct_burst
        filter: "is_m365 AND api IN ('FileSyncDownloadedFull', 'FileSyncDownloadedPartial') AND actor_key IS NOT NULL"
        outcome: any
        params: {key: [actor_key], distinct: "coalesce(file_path, CAST(source_seq AS VARCHAR))", window_ms: "{cfg.m365_download_window_ms}",
                 min_distinct: "{cfg.m365_download_min}", baseline_mult: "{cfg.m365_download_baseline_mult}", baseline_days: 14}

