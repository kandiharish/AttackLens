# Native cloud rules (reports/cloud/rule_catalog.md §4 native, §5 behavioural). Run by attacklens/detect_cloud.py over
# the cloud_ev table (columns and derived macros: config/cloud.yaml). Output: work/raw_alerts_cloud.parquet.
#
# Rule:   id, clouds [aws|azure|gcp], technique / sub_technique / tactic (ATT&CK v20, tactic must belong to the
#         technique), severity, optional secondary label, allow {lists, severity} (downgrade, never drop),
#         promote {first_seen: <sev>} (second signal: (acct, actor_key, api) unseen in the baseline),
#         context: true (baselining signal: emitted at <= cloud.yaml context_severity so it never seeds or adds a
#         tactic alone; sequences still read its full severity), automation: true | {severity} (CI/CD / IaC identity
#         without a risk signal -> cloud.yaml automation.severity, never dropped), branches.
# Branch: match: <SQL>  or  template: distinct_burst | rate_spike | sequence | first_seen | geo_velocity |
#         multi_network_session | new_source_burst with filter + params. severity (int), severity_sql (row / aggregate / pair SQL,
#         NULL -> severity), target (target_user SQL), label: secondary, label_sql, outcome: success (default:
#         ok_row) | failure | any. {cfg.x} = cloud.yaml params value, {cfg.x:list} = list literal.
# Severity tiers: <= 35 context, 45-60 signal, 65-80 strong, 85-95 critical. Rule order matters: sequence branches
# with a_rules / b_rules read alerts of rules (and branches) that ran before them.

rules:
  # =============================================================================================== Initial Access
  - id: aws_console_login_no_mfa
    clouds: [aws]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 55
    allow: {lists: [no_mfa_allow_users], severity: 35}
    branches:
      - match: >-
          is_ct AND api = 'ConsoleLogin' AND action = 'login_success'
          AND json_extract_string(ct_add, '$.MFAUsed') = 'No' AND ct_type IN ('IAMUser', 'Root')

  - id: aws_root_usage
    clouds: [aws]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 70
    branches:
      - match: "is_ct AND api = 'ConsoleLogin' AND action = 'login_success' AND ct_type = 'Root'"
        severity_sql: "CASE WHEN src_ip IN {cfg.root_allow_ips} THEN 35 END"
      - match: >-
          is_ct AND ct_type = 'Root' AND coalesce(ct_etype, '') <> 'AwsServiceEvent' AND ct_invoked IS NULL
          AND api <> 'ConsoleLogin'
        severity: 60
        severity_sql: >-
          CASE WHEN src_ip IN {cfg.root_allow_ips} THEN 35
               WHEN api IN ('CreateAccessKey', 'CreateLoginProfile', 'UpdateLoginProfile', 'DeactivateMFADevice',
                            'DeleteVirtualMFADevice') THEN 80 END

  - id: aws_console_pw_ok_mfa_fail
    clouds: [aws]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 65
    branches:
      - match: >-
          is_ct AND api = 'ConsoleLogin' AND action = 'login_failed'
          AND json_extract_string(ct_add, '$.MFAUsed') = 'Yes'
        outcome: any
        severity: 45
      - template: distinct_burst
        filter: >-
          is_ct AND api = 'ConsoleLogin' AND action = 'login_failed'
          AND json_extract_string(ct_add, '$.MFAUsed') = 'Yes'
        outcome: any
        params: {key: [actor_key], distinct: source_seq, window_ms: "{cfg.mfa_fail_window_ms}",
                 min_distinct: "{cfg.mfa_fail_min}"}
        severity: 75

  - id: cl_signin_bruteforce
    clouds: [aws, azure]
    technique: T1110
    sub_technique: T1110.001
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      - template: distinct_burst
        filter: >-
          ((is_ct AND api = 'ConsoleLogin' AND action = 'login_failed')
           OR (is_azs AND action = 'login_failed' AND si_code IN {cfg.azure_pw_fail_codes}
               AND NOT coalesce(lower(si_client) IN {cfg.legacy_auth_clients}, false)))
        outcome: any
        params: {key: [actor_key], distinct: source_seq, window_ms: "{cfg.bf_window_ms}",
                 min_distinct: "{cfg.bf_min_failures}"}
      - template: sequence
        label: secondary
        params:
          a_rules: [cl_signin_bruteforce]
          a_filter: "technique_id = 'T1110'"
          b_filter: >-
            (is_ct AND api = 'ConsoleLogin' AND action = 'login_success')
            OR (is_azs AND si_code IN {cfg.azure_pw_ok_codes})
          join: [[actor, actor]]
          window_ms: "{cfg.bf_window_ms}"

  - id: cl_password_spray
    clouds: [aws, azure]
    technique: T1110
    sub_technique: T1110.003
    tactic: Credential Access
    severity: 75
    branches:
      - template: distinct_burst
        filter: >-
          ((is_ct AND api = 'ConsoleLogin' AND action = 'login_failed')
           OR (is_azs AND action = 'login_failed' AND si_code IN ('50126', '50053', '50055')))
          AND NOT corp_ip
        outcome: any
        params: {key: [src_ip], distinct: actor_key, window_ms: "{cfg.spray_window_ms}",
                 min_distinct: "{cfg.spray_min_users}"}
      - template: sequence
        severity: 85
        params:
          a_rules: [cl_password_spray]
          b_filter: >-
            (is_ct AND api = 'ConsoleLogin' AND action = 'login_success')
            OR (is_azs AND si_code IN {cfg.azure_pw_ok_codes})
          join: [[src_ip, src_ip]]
          window_ms: "{cfg.bf_success_window_ms}"

  - id: az_valid_password_new_country
    clouds: [azure]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 70
    branches:
      - template: first_seen
        filter: >-
          is_azs AND cc IS NOT NULL
          AND (si_code IN ('50074', '50076', '500121', '50158') OR coalesce(si_authdet, '') ILIKE '%Correct Password%')
        outcome: any
        params: {key: [actor_key, cc], baseline_days: "{cfg.geo_baseline_days}",
                 min_history_days: "{cfg.b2_min_history_days}"}

  - id: az_risky_auth_protocol
    clouds: [azure]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 60
    branches:
      - template: first_seen
        filter: >-
          is_azs AND lower(si_proto) = 'devicecode' AND si_code = '0'
          AND NOT coalesce(si_appid IN {cfg.device_code_allow_apps}, false)
        outcome: any
        params: {key: [actor_key, "lower(si_proto)"], baseline_days: "{cfg.device_code_baseline_days}"}
        severity: 75
      - match: >-
          is_azs AND si_code = '0'
          AND (lower(si_proto) = 'ropc' OR coalesce(si_ua, '') ILIKE '%BAV2ROPC%'
               OR lower(si_client) IN {cfg.legacy_auth_clients})
          AND NOT coalesce(actor IN {cfg.legacy_auth_allow_users}, false)
        outcome: any

  - id: az_risky_signin_success
    clouds: [azure]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 70
    branches:
      - match: >-
          is_azs AND si_code = '0'
          AND (lower(si_risk) IN ('high', 'medium') OR lower(si_rstate) IN ('atrisk', 'confirmedcompromised'))
        outcome: any
        severity_sql: >-
          CASE WHEN lower(si_risk) = 'high' OR lower(si_rstate) = 'confirmedcompromised' THEN 80
               WHEN lower(si_req) = 'multifactorauthentication' THEN 45 END

  - id: cl_instance_creds_offhost
    clouds: [aws, gcp]
    technique: T1552
    sub_technique: T1552.005
    tactic: Credential Access
    severity: 85
    branches:
      - match: >-
          {cfg.geo_ranges_aws} AND is_ct AND ct_instance_role AND src_ip IS NOT NULL AND ct_vpce IS NULL
          AND NOT al_is_internal_ip(src_ip) AND provider IS NULL AND NOT corp_ip
        outcome: any
      - template: multi_network_session
        filter: "NOT {cfg.geo_ranges_aws} AND is_ct AND ct_instance_role AND ct_vpce IS NULL AND NOT al_is_internal_ip(src_ip)"
        outcome: any
        params: {session: ct_akid, network: net, window_ms: "{cfg.instance_offhost_window_ms}", min_networks: 2}
      - match: >-
          {cfg.geo_ranges_gcp} AND is_gcp AND lower(coalesce(g_principal, '')) LIKE '%-compute@developer.gserviceaccount.com'
          AND src_ip IS NOT NULL AND NOT al_is_internal_ip(src_ip) AND provider IS NULL AND NOT corp_ip
          AND coalesce(ua, '') NOT LIKE '%gce%'
        outcome: any

  # ==================================================================================================== Execution
  - id: cl_attack_tool_user_agent
    clouds: [aws, azure, gcp]
    technique: T1059
    sub_technique: T1059.009
    tactic: Execution
    severity: 75
    branches:
      - template: distinct_burst
        filter: "regexp_matches(coalesce(ua, ''), {cfg.attack_ua_regex}) AND NOT coalesce(lower(actor) IN {cfg.redteam_principals}, false)"
        outcome: any
        params: {key: [actor_key], distinct: api, window_ms: "{cfg.hour_ms}", min_distinct: 1}
      - template: distinct_burst
        filter: "regexp_matches(coalesce(ua, ''), {cfg.scanner_ua_regex})"
        outcome: any
        params: {key: [actor_key], distinct: api, window_ms: "{cfg.hour_ms}", min_distinct: 1}
        severity: 30

  - id: aws_ssm_command
    clouds: [aws]
    technique: T1651
    tactic: Execution
    severity: 55
    promote: {first_seen: 75}
    branches:
      - match: >-
          is_ct AND app = 'ssm.amazonaws.com' AND api IN ('SendCommand', 'StartAutomationExecution', 'CreateAssociation')
          AND NOT coalesce(ct_svc, false)
          AND NOT coalesce(json_extract_string(ct_rp, '$.documentName') IN {cfg.ssm_allow_documents}, false)
        severity_sql: >-
          CASE WHEN json_array_length(json_extract(ct_rp, '$.instanceIds')) >= {cfg.ssm_min_targets} THEN 75 END
      - template: distinct_burst
        filter: >-
          is_ct AND app = 'ssm.amazonaws.com' AND api = 'SendCommand' AND NOT coalesce(ct_svc, false)
          AND NOT coalesce(json_extract_string(ct_rp, '$.documentName') IN {cfg.ssm_allow_documents}, false)
        params: {key: [actor_key], distinct: "json_extract_string(ct_rp, '$.instanceIds')",
                 window_ms: "{cfg.burst_window_ms}", min_distinct: "{cfg.ssm_min_targets}"}
        severity: 75

  - id: aws_ec2_userdata_modified
    clouds: [aws]
    technique: T1059
    sub_technique: T1059.009
    tactic: Execution
    severity: 75
    branches:
      - match: >-
          is_ct AND api = 'ModifyInstanceAttribute'
          AND (json_extract_string(ct_rp, '$.attribute') = 'userData' OR json_extract(ct_rp, '$.userData') IS NOT NULL)
        target: "json_extract_string(ct_rp, '$.instanceId')"
      - template: sequence
        severity: 85
        params:
          a_filter: "is_ct AND api = 'StopInstances' AND ok_row"
          b_filter: >-
            is_ct AND ok_row AND api = 'ModifyInstanceAttribute'
            AND (json_extract_string(ct_rp, '$.attribute') = 'userData' OR json_extract(ct_rp, '$.userData') IS NOT NULL)
          join: [["json_extract_string(ct_rp, '$.instancesSet.items[0].instanceId')", "json_extract_string(ct_rp, '$.instanceId')"]]
          window_ms: "{cfg.stop_start_window_ms}"

  - id: aws_serverless_code_change
    clouds: [aws]
    technique: T1648
    tactic: Execution
    severity: 50
    promote: {first_seen: 70}
    branches:
      - match: "is_ct AND app = 'lambda.amazonaws.com' AND api LIKE 'UpdateFunctionCode%'"
        severity_sql: "CASE WHEN NOT regexp_matches(coalesce(ua, ''), {cfg.iac_ua_regex}) THEN 70 END"
        target: "lower(json_extract_string(ct_rp, '$.functionName'))"
      - match: >-
          is_ct AND app = 'sagemaker.amazonaws.com'
          AND api IN ('CreateNotebookInstanceLifecycleConfig', 'UpdateNotebookInstanceLifecycleConfig', 'UpdateNotebookInstance')
          AND coalesce(ct_rp, '') ILIKE '%LifecycleConfig%'
        severity_sql: "CASE WHEN NOT regexp_matches(coalesce(ua, ''), {cfg.iac_ua_regex}) THEN 70 END"
      # rules track: a new function is a signal (IaC deploys are context); the same identity creating or replacing a
      # function and then wiring it to an event source / public URL / cross-principal invoke permission is the
      # ATT&CK T1648 procedure ("create a Lambda function ... triggered by" an event) -> strong
      - match: "is_ct AND ok_row AND app = 'lambda.amazonaws.com' AND api LIKE 'CreateFunction%'"
        severity: 45
        no_promote: true
        severity_sql: "CASE WHEN regexp_matches(coalesce(ua, ''), {cfg.iac_ua_regex}) THEN 35 END"
        target: "lower(regexp_extract(coalesce(json_extract_string(ct_rp, '$.functionName'), ''), '([^:]+)$', 1))"
      - template: sequence
        severity: 75
        params:
          a_filter: >-
            is_ct AND ok_row AND app = 'lambda.amazonaws.com'
            AND (api LIKE 'CreateFunction%' OR api LIKE 'UpdateFunctionCode%')
            AND NOT regexp_matches(coalesce(ua, ''), {cfg.iac_ua_regex})
          b_filter: >-
            is_ct AND ok_row AND app = 'lambda.amazonaws.com'
            AND (api LIKE 'CreateEventSourceMapping%' OR api LIKE 'CreateFunctionUrlConfig%' OR api LIKE 'AddPermission%')
          join:
            - - "nullif(lower(regexp_extract(coalesce(json_extract_string(ct_rp, '$.functionName'), ''), '(?:function:)?([^:]+)(?::[^:]*)?$', 1)), '')"
              - "nullif(lower(regexp_extract(coalesce(json_extract_string(ct_rp, '$.functionName'), ''), '(?:function:)?([^:]+)(?::[^:]*)?$', 1)), '')"
            - [actor_key, actor_key]
          window_ms: "{cfg.hour_ms}"

  - id: az_remote_exec
    clouds: [azure]
    technique: T1651
    tactic: Execution
    severity: 55
    promote: {first_seen: 80}
    branches:
      - match: >-
          is_aza AND (api_u IN ('MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION', 'MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMANDS/WRITE',
                                'MICROSOFT.COMPUTE/VIRTUALMACHINESCALESETS/VIRTUALMACHINES/RUNCOMMAND/ACTION',
                                'MICROSOFT.HYBRIDCOMPUTE/MACHINES/RUNCOMMANDS/WRITE',
                                'MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/WRITE',
                                'MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/RUNBOOKS/DRAFT/WRITE',
                                'MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WEBHOOKS/WRITE')
                      OR (api_u = 'MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE'
                          AND (coalesce(az_req, '') ILIKE '%CustomScript%' OR coalesce(az_req, '') ILIKE '%commandToExecute%')))
          AND NOT regexp_matches(lower(coalesce(az_req, '')), {cfg.az_allow_extension_regex})
        severity_sql: >-
          CASE WHEN machine THEN 35
               WHEN api_u LIKE '%RUNCOMMAND%' AND coalesce(az_caller, '') LIKE '%@%' THEN 70 END

  - id: gcp_startup_script
    clouds: [gcp]
    technique: T1059
    sub_technique: T1059.009
    tactic: Execution
    severity: 70
    branches:
      - match: >-
          is_gcp AND api IN ('v1.compute.instances.setMetadata', 'beta.compute.instances.setMetadata',
                             'v1.compute.projects.setCommonInstanceMetadata')
          AND regexp_matches(coalesce(g_md, '') || coalesce(g_req, ''), '(startup-script|shutdown-script)')
      - match: "is_gcp AND api ILIKE '%notebooks.v%.NotebookService.UpdateInstance' AND coalesce(g_req, '') ILIKE '%startup-script%'"

  # ================================================================================================== Persistence
  - id: aws_credential_for_other_user
    clouds: [aws]
    technique: T1098
    sub_technique: T1098.001
    tactic: Persistence
    severity: 75
    allow: {lists: [iam_admin_principals], severity: 45}
    branches:
      - match: >-
          is_ct AND api IN ('CreateAccessKey', 'CreateLoginProfile', 'UpdateLoginProfile')
          AND json_extract_string(ct_rp, '$.userName') IS NOT NULL
          AND lower(json_extract_string(ct_rp, '$.userName'))
              <> lower(coalesce(ct_uname, nullif(regexp_extract(ct_arn, '([^/]+)$', 1), ''), actor, ''))
        target: "json_extract_string(ct_rp, '$.userName')"
      - match: >-
          is_ct AND api = 'CreateAccessKey'
          AND (json_extract_string(ct_rp, '$.userName') IS NULL
               OR lower(json_extract_string(ct_rp, '$.userName'))
                  = lower(coalesce(ct_uname, nullif(regexp_extract(ct_arn, '([^/]+)$', 1), ''), actor, '')))
        target: "coalesce(json_extract_string(ct_re, '$.accessKey.userName'), actor)"
        severity: 35

  - id: aws_role_trust_backdoor
    clouds: [aws]
    technique: T1098
    sub_technique: T1098.003
    tactic: Persistence
    severity: 80
    branches:
      - match: "is_ct AND api IN ('UpdateAssumeRolePolicy', 'CreateRole')"
        target: "json_extract_string(ct_rp, '$.roleName')"
        severity_sql: >-
          CASE WHEN regexp_matches(regexp_replace(lower(coalesce(json_extract_string(ct_rp, '$.policyDocument'),
                                       json_extract_string(ct_rp, '$.assumeRolePolicyDocument'), '')), '\s|\\', '', 'g'),
                                   '"aws":"\*"|"principal":"\*"|"aws":\["\*"\]')
                 OR len(list_filter(regexp_extract_all(coalesce(json_extract_string(ct_rp, '$.policyDocument'),
                                       json_extract_string(ct_rp, '$.assumeRolePolicyDocument'), ''), 'arn:aws:iam::([0-9]{12}):', 1),
                                    lambda a: a <> coalesce(acct, '') AND NOT list_contains({cfg.trusted_aws_accounts:list}, a))) > 0
               THEN 80 ELSE 50 END

  - id: aws_federation_trust_change
    clouds: [aws]
    technique: T1484
    sub_technique: T1484.002
    tactic: Privilege Escalation
    severity: 80
    branches:
      - match: >-
          is_ct AND (api IN ('CreateSAMLProvider', 'UpdateSAMLProvider', 'DeleteSAMLProvider', 'CreateOpenIDConnectProvider',
                             'UpdateOpenIDConnectProviderThumbprint', 'AddClientIDToOpenIDConnectProvider',
                             'CreateTrustAnchor', 'UpdateTrustAnchor', 'EnableExternalIdPConfigurationForDirectory',
                             'DisableExternalIdPConfigurationForDirectory', 'AssociateDirectory', 'DisassociateDirectory',
                             'CreateInstanceAccessControlAttributeConfiguration')
                     OR (api = 'CreateProfile' AND app = 'rolesanywhere.amazonaws.com'))

  - id: aws_lambda_backdoor
    clouds: [aws]
    technique: T1546
    tactic: Persistence
    severity: 80
    secondary: {technique: T1525, tactic: Persistence, severity: 80}
    branches:
      - match: >-
          is_ct AND api LIKE 'AddPermission%'
          AND NOT coalesce(json_extract_string(ct_rp, '$.functionName') IN {cfg.public_lambda_allow}, false)
          AND (json_extract_string(ct_rp, '$.principal') = '*'
               OR (nullif(regexp_extract(coalesce(json_extract_string(ct_rp, '$.principal'), ''), '([0-9]{12})', 1), '') IS NOT NULL
                   AND regexp_extract(json_extract_string(ct_rp, '$.principal'), '([0-9]{12})', 1) <> coalesce(acct, '')
                   AND NOT list_contains({cfg.trusted_aws_accounts:list},
                                         regexp_extract(json_extract_string(ct_rp, '$.principal'), '([0-9]{12})', 1))))
        target: "json_extract_string(ct_rp, '$.functionName')"
      - match: >-
          is_ct AND api LIKE 'CreateFunctionUrlConfig%' AND json_extract_string(ct_rp, '$.authType') = 'NONE'
          AND NOT coalesce(json_extract_string(ct_rp, '$.functionName') IN {cfg.public_lambda_allow}, false)
        severity: 70
      - match: "is_ct AND api LIKE 'UpdateFunctionConfiguration%' AND coalesce(ct_rp, '') ILIKE '%layers%'"
        label: secondary
        severity_sql: >-
          CASE WHEN len(list_filter(regexp_extract_all(ct_rp, 'arn:aws:lambda:[^:]+:([0-9]{12}):layer', 1),
                                    lambda a: a <> coalesce(acct, '') AND NOT list_contains({cfg.trusted_aws_accounts:list}, a))) > 0
               THEN 80 ELSE 40 END

  - id: aws_keypair_new
    clouds: [aws]
    technique: T1098
    sub_technique: T1098.004
    tactic: Persistence
    severity: 45
    promote: {first_seen: 70}
    branches:
      - match: "is_ct AND app = 'ec2.amazonaws.com' AND api IN ('CreateKeyPair', 'ImportKeyPair')"
        severity_sql: >-
          CASE WHEN regexp_matches(lower(coalesce(json_extract_string(ct_rp, '$.keyName'), '')), {cfg.suspicious_name_regex})
               THEN 70 END

  - id: az_app_or_identity_credential
    clouds: [azure]
    technique: T1098
    sub_technique: T1098.001
    tactic: Persistence
    severity: 75
    allow: {lists: [app_owner_allow], severity: 45}
    branches:
      - match: >-
          is_azd AND (au_name ILIKE '%Certificates and secrets management%' OR au_name = 'Add service principal credentials'
                      OR (au_name IN ('Update application', 'Update service principal')
                          AND regexp_matches(lower(coalesce(tr_json, '')), 'keydescription|keycredentials|passwordcredentials')))
        target: "json_extract_string(tr_json, '$[0].displayName')"
      - match: "is_azd AND au_name IN ('Add application', 'Add service principal')"
        target: "json_extract_string(tr_json, '$[0].displayName')"
        severity: 35
      - match: >-
          (is_azd AND au_name ILIKE 'Update application%' AND coalesce(tr_json, '') ILIKE '%FederatedIdentityCredential%')
          OR (is_aza AND api_u = 'MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE')
        severity: 85
        severity_sql: >-
          CASE WHEN nullif(regexp_extract(coalesce(tr_json, az_req, ''), '(?i)issuer[^h]{0,24}(https?://[^"\\,\s]+)', 1), '') IS NOT NULL
                AND NOT list_contains({cfg.trusted_oidc_issuers:list},
                                      regexp_extract(coalesce(tr_json, az_req, ''), '(?i)issuer[^h]{0,24}(https?://[^"\\,\s]+)', 1))
               THEN 90 END

  - id: az_auth_method_added
    clouds: [azure]
    technique: T1556
    sub_technique: T1556.006
    tactic: Persistence
    severity: 50
    allow: {lists: [onboarding_principals], severity: 35}
    branches:
      - match: >-
          is_azd AND (au_name IN ('User registered security info', 'Admin registered security info',
                                  'User registered all required security info')
                      OR (au_name = 'Update user' AND coalesce(tr_json, '') ILIKE '%StrongAuthenticationMethod%'))
        severity_sql: >-
          CASE WHEN coalesce(au_add, '') ILIKE '%temporary access pass%' OR coalesce(au_reason, '') ILIKE '%temporary access pass%' THEN 75
               WHEN au_name LIKE 'Admin%' OR (au_name = 'Update user' AND target_user IS DISTINCT FROM actor) THEN 70
               ELSE 35 END

  - id: az_hidden_au
    clouds: [azure]
    technique: T1098
    sub_technique: T1098.003
    tactic: Persistence
    severity: 70
    branches:
      - match: >-
          is_azd AND (au_name IN ('Add member to restricted management administrative unit', 'Add scoped member to role')
                      OR (au_name = 'Add administrative unit'
                          AND regexp_matches(lower(coalesce(tr_json, '')), 'hiddenmembership|ismembermanagementrestricted[^a-z]{0,12}true')))

  - id: gcp_sa_key_created
    clouds: [gcp]
    technique: T1098
    sub_technique: T1098.001
    tactic: Persistence
    severity: 60
    promote: {first_seen: 80}
    branches:
      - match: "is_gcp AND api IN ('google.iam.admin.v1.CreateServiceAccountKey', 'google.iam.admin.v1.UploadServiceAccountKey')"
        target: "nullif(regexp_extract(coalesce(json_extract_string(g_req, '$.name'), g_res, ''), 'serviceAccounts/([^/@]+)', 1), '')"
        severity_sql: >-
          CASE WHEN api LIKE '%Upload%' THEN 80
               WHEN lower(coalesce(g_principal, '')) NOT LIKE '%gserviceaccount.com' THEN 70 END

  - id: gcp_ssh_key_metadata
    clouds: [gcp]
    technique: T1098
    sub_technique: T1098.004
    tactic: Persistence
    severity: 65
    branches:
      - match: >-
          is_gcp AND api IN ('v1.compute.instances.setMetadata', 'beta.compute.instances.setMetadata',
                             'v1.compute.projects.setCommonInstanceMetadata')
          AND coalesce(g_md, '') ILIKE '%ssh-keys%'
        severity_sql: >-
          CASE WHEN coalesce(ua, '') LIKE '%command/gcloud.compute.ssh%' THEN 35
               WHEN api LIKE '%setCommonInstanceMetadata' THEN 75 END

  # ========================================================================================= Privilege Escalation
  - id: aws_admin_policy_attached
    clouds: [aws]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 75
    branches:
      - match: >-
          is_ct AND ((api IN ('AttachUserPolicy', 'AttachRolePolicy', 'AttachGroupPolicy')
                      AND regexp_matches(lower(coalesce(json_extract_string(ct_rp, '$.policyArn'), '')), {cfg.admin_policy_regex}))
                     OR (api IN ('PutUserPolicy', 'PutRolePolicy', 'PutGroupPolicy', 'CreatePolicyVersion', 'CreatePolicy')
                         AND regexp_matches(regexp_replace(lower(coalesce(ct_rp, '')), '\s|\\', '', 'g'),
                                            '"action":"\*"|"action":\["\*"\]|"action":"iam:\*"')
                         AND regexp_matches(regexp_replace(lower(coalesce(ct_rp, '')), '\s|\\', '', 'g'),
                                            '"resource":"\*"|"resource":\["\*"\]')))
        target: >-
          coalesce(json_extract_string(ct_rp, '$.userName'), json_extract_string(ct_rp, '$.roleName'),
                   json_extract_string(ct_rp, '$.groupName'))
        severity_sql: >-
          CASE WHEN lower(coalesce(json_extract_string(ct_rp, '$.userName'), json_extract_string(ct_rp, '$.roleName')))
                    IN (actor, actor_key) THEN 85 END

  - id: aws_iam_privesc_primitives
    clouds: [aws]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 60
    promote: {first_seen: 80}
    branches:
      - match: >-
          is_ct AND (api IN ('SetDefaultPolicyVersion', 'DeleteUserPermissionsBoundary', 'DeleteRolePermissionsBoundary',
                             'PutUserPermissionsBoundary', 'PutRolePermissionsBoundary', 'AssociateIamInstanceProfile',
                             'ReplaceIamInstanceProfileAssociation', 'UpdateAccessKey')
                     OR (api = 'CreatePolicyVersion' AND lower(json_extract_string(ct_rp, '$.setAsDefault')) = 'true')
                     OR (api = 'AddUserToGroup' AND regexp_matches(lower(coalesce(group_name, '')), {cfg.admin_group_regex})))
        target: "coalesce(json_extract_string(ct_rp, '$.userName'), json_extract_string(ct_rp, '$.roleName'))"
        severity_sql: >-
          CASE WHEN lower(coalesce(json_extract_string(ct_rp, '$.userName'), json_extract_string(ct_rp, '$.roleName')))
                    IN (actor, actor_key) THEN 80 END

  - id: aws_federation_token
    clouds: [aws]
    technique: T1550
    sub_technique: T1550.001
    tactic: Lateral Movement
    severity: 55
    allow: {lists: [federation_brokers], severity: 35}
    branches:
      - match: "is_ct AND app = 'sts.amazonaws.com' AND api = 'GetFederationToken'"
        severity_sql: "CASE WHEN coalesce(ct_rp, '') ILIKE '%AdministratorAccess%' THEN 80 END"
      - template: sequence
        severity: 80
        params:
          a_filter: "is_ct AND app = 'sts.amazonaws.com' AND api = 'GetFederationToken' AND ok_row"
          b_filter: "is_ct AND api = 'ConsoleLogin' AND action = 'login_success' AND ct_type = 'FederatedUser'"
          join: [[acct, acct]]
          window_ms: "{cfg.federation_console_window_ms}"

  - id: az_entra_privileged_role
    clouds: [azure]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 80
    branches:
      - match: >-
          is_azd AND au_name IN ('Add member to role', 'Add eligible member to role', 'Add scoped member to role',
                                 'Add member to role completed (PIM activation)', 'Add member to role outside of PIM (permanent)',
                                 'Add eligible member (permanent)', 'Add eligible member (eligible)')
          AND (regexp_matches(lower(coalesce(tr_json, '')), {cfg.entra_priv_role_regex})
               OR len(list_intersect(regexp_extract_all(lower(coalesce(tr_json, '')), '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'),
                                     {cfg.entra_priv_role_ids:list})) > 0)
        target: "coalesce(target_user, json_extract_string(tr_json, '$[0].displayName'))"
        severity_sql: >-
          CASE WHEN au_name ILIKE '%PIM activation%' THEN 35
               WHEN au_by_spid IS NOT NULL AND contains(lower(coalesce(tr_json, '')), lower(au_by_spid)) THEN 90
               WHEN regexp_matches(coalesce(tr_json, ''), '"type"\s*:\s*"ServicePrincipal"') THEN 85 END

  - id: az_rbac_privileged_assignment
    clouds: [azure]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 35
    branches:
      # Role id / principal: in properties.requestbody (REST / Event Hub export) or as top-level keys of
      # Properties_d (Log Analytics AzureActivity) -> search the request, the response and the properties text.
      - match: "is_aza AND api_u = 'MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE'"
        target: "nullif(regexp_extract(concat_ws(' ', az_req, az_props), '(?i)\"principalId\"\\s*:\\s*\"([0-9a-f-]{36})\"', 1), '')"
        severity_sql: >-
          CASE WHEN len(list_intersect(regexp_extract_all(lower(concat_ws(' ', az_req, az_resp, az_props)),
                                                          'roledefinitions/([0-9a-f-]{36})', 1),
                                       {cfg.az_priv_role_def_ids:list})) > 0
               THEN CASE WHEN lower(coalesce(host, '')) NOT LIKE '%/resourcegroups/%' THEN 85 ELSE 75 END END

  - id: az_elevate_access
    clouds: [azure]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 90
    branches:
      - match: >-
          (is_aza AND api_u = 'MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION')
          OR (is_azd AND (au_cat = 'AzureRBACRoleManagementElevateAccess'
                          OR au_name ILIKE 'User has elevated their access to User Access Administrator%'))

  - id: az_oauth_consent_privileged
    clouds: [azure]
    technique: T1528
    tactic: Credential Access
    severity: 75
    branches:
      - match: >-
          is_azd AND au_name = 'Consent to application'
          AND regexp_matches(lower(coalesce(tr_json, '')), {cfg.risky_scopes_regex})
          AND NOT regexp_matches(lower(coalesce(tr_json, '')), 'isadminconsent[^a-z]{0,12}true')
        target: "json_extract_string(tr_json, '$[0].displayName')"
        severity_sql: >-
          CASE WHEN len(list_filter({cfg.trusted_app_ids:list}, lambda a: contains(lower(coalesce(tr_json, '')), lower(a)))) > 0
               THEN 35 END
      - match: >-
          is_azd AND au_name IN ('Add delegated permission grant', 'Add app role assignment to service principal')
          AND (coalesce(tr_json, '') ILIKE '%AllPrincipals%'
               OR len(list_intersect(regexp_extract_all(lower(coalesce(tr_json, '')), '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'),
                                     {cfg.graph_priv_app_role_ids:list})) > 0)
        target: "json_extract_string(tr_json, '$[0].displayName')"
        severity: 85
      # rules track: the user-level delegated grant carries the scopes ("Consent to application" often does not);
      # 'Add OAuth2PermissionGrant' is the older name of the same audit activity
      - match: >-
          is_azd AND au_name IN ('Add delegated permission grant', 'Add OAuth2PermissionGrant')
          AND regexp_matches(lower(coalesce(tr_json, '')), {cfg.risky_scopes_regex})
          AND NOT coalesce(tr_json, '') ILIKE '%AllPrincipals%'
        target: "json_extract_string(tr_json, '$[0].displayName')"
        severity_sql: >-
          CASE WHEN len(list_filter({cfg.trusted_app_ids:list}, lambda a: contains(lower(coalesce(tr_json, '')), lower(a)))) > 0
               THEN 35 END

  - id: az_guest_external
    clouds: [azure]
    technique: T1136
    sub_technique: T1136.003
    tactic: Persistence
    severity: 50
    promote: {first_seen: 70}
    allow: {lists: [guest_inviters], severity: 35}
    branches:
      - match: >-
          is_azd AND (au_name IN ('Invite external user', 'Add user sponsor')
                      OR (au_name = 'Add user' AND coalesce(tr_json, '') ILIKE '%#EXT#%'))
        target: "coalesce(target_user, json_extract_string(tr_json, '$[0].userPrincipalName'))"
        severity_sql: >-
          CASE WHEN len(list_filter({cfg.trusted_guest_domains:list},
                                    lambda d: contains(lower(coalesce(tr_json, '')), replace(lower(d), '.', '_') || '#ext#')
                                         OR contains(lower(coalesce(tr_json, '')), '@' || lower(d)))) > 0 THEN 35 END
      - match: >-
          is_azd AND au_name = 'Update user' AND coalesce(tr_json, '') ILIKE '%UserType%'
          AND coalesce(tr_json, '') ILIKE '%Guest%' AND coalesce(tr_json, '') ILIKE '%Member%'
        severity: 75
        no_promote: true
      - template: sequence
        severity: 85
        params:
          a_rules: [az_guest_external]
          b_rules: [az_entra_privileged_role]
          join: [[target_user, target_user]]
          window_ms: "{cfg.guest_priv_window_ms}"

  - id: gcp_sensitive_grant
    clouds: [gcp]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 75
    branches:
      - match: >-
          is_gcp AND (api ILIKE '%SetIamPolicy' OR api = 'storage.setIamPermissions') AND g_delta IS NOT NULL
          AND len(list_filter(CAST(json_extract(g_delta, '$[*]') AS VARCHAR[]),
                lambda d: json_extract_string(d, '$.action') = 'ADD'
                     AND NOT regexp_matches(lower(coalesce(json_extract_string(d, '$.member'), '')),
                                            '@(gcp-sa-[a-z0-9-]+\.iam\.gserviceaccount\.com|cloudservices\.gserviceaccount\.com)$')
                     AND (list_contains({cfg.gcp_admin_roles:list}, lower(json_extract_string(d, '$.role')))
                          OR list_contains({cfg.gcp_impersonation_roles:list}, lower(json_extract_string(d, '$.role')))
                          OR json_extract_string(d, '$.member') IN ('allUsers', 'allAuthenticatedUsers')))) > 0
        target: >-
          nullif(regexp_extract(coalesce(json_extract_string(json_extract(g_delta, '$[0]'), '$.member'), ''), ':([^@]+)', 1), '')
        severity_sql: >-
          CASE WHEN len(list_filter(CAST(json_extract(g_delta, '$[*]') AS VARCHAR[]),
                       lambda d: json_extract_string(d, '$.action') = 'ADD'
                            AND (json_extract_string(d, '$.member') IN ('allUsers', 'allAuthenticatedUsers')
                                 OR (regexp_matches(coalesce(json_extract_string(d, '$.member'), ''), '^(user|group|domain):')
                                     AND NOT list_contains({cfg.trusted_domains:list},
                                                           lower(regexp_extract(json_extract_string(d, '$.member'), '@(.+)$', 1)))
                                     AND lower(regexp_extract(json_extract_string(d, '$.member'), '@(.+)$', 1))
                                         <> lower(regexp_extract(coalesce(g_principal, ''), '@(.+)$', 1)))))) > 0
               THEN 85 END

  - id: gcp_sa_impersonation_use
    clouds: [gcp]
    technique: T1548
    sub_technique: T1548.005
    tactic: Privilege Escalation
    severity: 60
    promote: {first_seen: 80}
    branches:
      - match: >-
          is_gcp AND ((app = 'iamcredentials.googleapis.com'
                       AND regexp_matches(api, '(GenerateAccessToken|GenerateIdToken|SignBlob|SignJwt)$'))
                      OR g_deleg IS NOT NULL)
        target: "nullif(regexp_extract(coalesce(g_res, ''), 'serviceAccounts/([^/@]+)', 1), '')"
        severity_sql: "CASE WHEN json_array_length(g_deleg) >= 2 THEN 80 END"
      - template: distinct_burst
        filter: "is_gcp AND app = 'iamcredentials.googleapis.com' AND regexp_matches(api, '(GenerateAccessToken|GenerateIdToken|SignBlob|SignJwt)$')"
        params: {key: [actor_key], distinct: g_res, window_ms: "{cfg.burst_window_ms}", min_distinct: "{cfg.impersonation_min_targets}"}
        severity: 80
      - template: distinct_burst
        filter: "is_gcp AND app = 'iamcredentials.googleapis.com' AND g_code = '7'"
        outcome: any
        params: {key: [actor_key], distinct: g_res, window_ms: "{cfg.burst_window_ms}", min_distinct: "{cfg.impersonation_min_targets}"}
        severity: 70

  # ====================================================================================================== Stealth
  - id: cl_unused_region
    clouds: [aws, azure, gcp]
    technique: T1535
    tactic: Stealth
    severity: 60
    branches:
      - template: first_seen
        filter: "is_write AND region IS NOT NULL AND NOT coalesce(app IN {cfg.global_services}, false)"
        params: {key: [acct, region], hist_key: acct, baseline_days: "{cfg.b3_baseline_days}",
                 min_history_days: "{cfg.b3_min_history_days}", max_per_actor_day: "{cfg.first_seen_max_per_actor_day}",
                 summary_severity: "{cfg.first_seen_summary_severity}"}
      - template: distinct_burst
        filter: >-
          is_write AND region IS NOT NULL AND len({cfg.allowed_regions:list}) > 0
          AND NOT list_contains({cfg.allowed_regions:list}, region) AND NOT coalesce(app IN {cfg.global_services}, false)
        params: {key: [acct, region], distinct: api, window_ms: "{cfg.hour_ms}", min_distinct: 1}
      - match: "is_ct AND api = 'EnableRegion'"

  - id: cl_account_create_delete_short
    clouds: [aws, azure, gcp]
    technique: T1136
    sub_technique: T1136.003
    tactic: Persistence
    severity: 70
    secondary: {technique: T1070, tactic: Defense Impairment, severity: 70}
    branches:
      - template: sequence
        label: secondary
        params:
          a_filter: >-
            ok_row AND ((is_ct AND api IN ('CreateUser', 'CreateAccessKey')) OR (is_azd AND au_name = 'Add user')
                        OR (is_gcp AND api LIKE '%CreateServiceAccount'))
          b_filter: >-
            ok_row AND ((is_ct AND api IN ('DeleteUser', 'DeleteAccessKey')) OR (is_azd AND au_name = 'Delete user')
                        OR (is_gcp AND api LIKE '%DeleteServiceAccount'))
          join:
            - - >-
                CASE WHEN is_ct AND api = 'CreateUser' THEN 'u:' || lower(json_extract_string(ct_rp, '$.userName'))
                     WHEN is_ct THEN 'k:' || json_extract_string(ct_re, '$.accessKey.accessKeyId')
                     WHEN is_azd THEN 'u:' || target_user
                     ELSE 'u:' || lower(nullif(regexp_extract(coalesce(json_extract_string(g_resp, '$.email'), ''), '^([^@]+)', 1), '')) END
              - >-
                CASE WHEN is_ct AND api = 'DeleteUser' THEN 'u:' || lower(json_extract_string(ct_rp, '$.userName'))
                     WHEN is_ct THEN 'k:' || json_extract_string(ct_rp, '$.accessKeyId')
                     WHEN is_azd THEN 'u:' || target_user
                     ELSE 'u:' || lower(nullif(regexp_extract(coalesce(g_res, ''), 'serviceAccounts/([^/@]+)', 1), '')) END
          window_ms: "{cfg.create_delete_window_ms}"

  # =========================================================================================== Defense Impairment
  - id: aws_logging_tamper
    clouds: [aws]
    technique: T1685
    sub_technique: T1685.002
    tactic: Defense Impairment
    severity: 70
    branches:
      - match: >-
          is_ct AND app = 'cloudtrail.amazonaws.com'
          AND api IN ('StopLogging', 'DeleteTrail', 'DeleteEventDataStore', 'StopEventDataStoreIngestion', 'UpdateTrail',
                      'PutEventSelectors', 'PutInsightSelectors')
        severity_sql: >-
          CASE WHEN api IN ('StopLogging', 'DeleteTrail', 'DeleteEventDataStore', 'StopEventDataStoreIngestion') THEN 90
               WHEN regexp_matches(regexp_replace(lower(coalesce(ct_rp, '')), '\s|\\', '', 'g'),
                                   '"includemanagementevents":false|"readwritetype":"readonly"|"excludemanagementeventsources":\["kms|"field":"readonly","equals":\["true"\]')
               THEN 85 ELSE 65 END
      - match: >-
          is_ct AND api IN ('PutBucketLifecycle', 'PutBucketLifecycleConfiguration')
          AND TRY_CAST(nullif(regexp_extract(coalesce(ct_rp, ''), '"[Dd]ays"\s*:\s*"?([0-9]+)', 1), '') AS INTEGER) <= {cfg.short_retention_days}
        severity: 75
      - match: "is_ct AND api = 'PutBucketLogging' AND coalesce(ct_rp, '') NOT ILIKE '%LoggingEnabled%'"
        severity: 60
      - match: >-
          is_ct AND api IN ('DeleteBucketPolicy', 'PutBucketPolicy', 'DeleteBucket')
          AND lower(json_extract_string(ct_rp, '$.bucketName')) IN (
              SELECT lower(coalesce(json_extract_string(z.ct_rp, '$.s3BucketName'), json_extract_string(z.ct_re, '$.s3BucketName')))
              FROM cloud_ev z WHERE z.is_ct AND z.api IN ('CreateTrail', 'UpdateTrail'))
        severity: 80
      - match: "is_ct AND api IN ('DeleteLogGroup', 'DeleteLogStream', 'PutRetentionPolicy', 'DeleteSubscriptionFilter')"
        severity: 45
        severity_sql: "CASE WHEN regexp_matches(lower(coalesce(ct_rp, '')), 'cloudtrail|flowlog|guardduty') THEN 75 END"

  - id: aws_security_service_off
    clouds: [aws]
    technique: T1685
    tactic: Defense Impairment
    severity: 70
    secondary: {technique: T1685, sub_technique: T1685.002, tactic: Defense Impairment, severity: 85}
    branches:
      - match: >-
          is_ct AND ((app = 'guardduty.amazonaws.com'
                      AND (api IN ('DeleteDetector', 'DisassociateFromMasterAccount', 'DisassociateFromAdministratorAccount',
                                   'DeleteMembers', 'StopMonitoringMembers', 'DeletePublishingDestination', 'DeleteThreatIntelSet',
                                   'CreateIPSet', 'UpdateIPSet')
                           OR (api = 'UpdateDetector' AND lower(json_extract_string(ct_rp, '$.enable')) = 'false')
                           OR (api = 'CreateFilter' AND json_extract_string(ct_rp, '$.action') = 'ARCHIVE')))
                     OR (app = 'securityhub.amazonaws.com' AND api IN ('DisableSecurityHub', 'DisableImportFindingsForProduct', 'DeleteInsight'))
                     OR (app = 'config.amazonaws.com' AND api IN ('StopConfigurationRecorder', 'DeleteDeliveryChannel',
                                                                  'DeleteConfigurationRecorder', 'DeleteConfigRule'))
                     OR (app = 'access-analyzer.amazonaws.com' AND api = 'DeleteAnalyzer')
                     OR (app = 'macie2.amazonaws.com' AND api IN ('DisableMacie', 'UpdateMacieSession'))
                     OR (app = 'inspector2.amazonaws.com' AND api = 'Disable')
                     OR (app = 'detective.amazonaws.com' AND api = 'DeleteGraph')
                     OR (app IN ('waf.amazonaws.com', 'wafv2.amazonaws.com', 'waf-regional.amazonaws.com')
                         AND api IN ('DeleteWebACL', 'DisassociateWebACL'))
                     OR (app = 'bedrock.amazonaws.com' AND api = 'DeleteGuardrail')
                     OR (app = 'monitoring.amazonaws.com' AND api IN ('DeleteAlarms', 'DisableAlarmActions')))
        severity_sql: >-
          CASE WHEN api IN ('CreateIPSet', 'UpdateIPSet', 'DeleteAlarms', 'DisableAlarmActions', 'DeleteWebACL', 'DisassociateWebACL') THEN 65
               WHEN app IN ('guardduty.amazonaws.com', 'config.amazonaws.com') THEN 85 END
      - match: >-
          is_ct AND ((app = 'ec2.amazonaws.com' AND api = 'DeleteFlowLogs')
                     OR (app = 'route53resolver.amazonaws.com' AND api IN ('DeleteResolverQueryLogConfig', 'DisassociateResolverQueryLogConfig'))
                     OR (app = 'bedrock.amazonaws.com' AND api = 'DeleteModelInvocationLoggingConfiguration'))
        label: secondary
      - match: >-
          is_ct AND app = 'securityhub.amazonaws.com' AND api = 'BatchUpdateFindings' AND coalesce(ct_rp, '') ILIKE '%SUPPRESSED%'
          AND json_array_length(json_extract(ct_rp, '$.findingIdentifiers')) >= 20

  - id: cl_leave_hierarchy
    clouds: [aws, gcp]
    technique: T1666
    tactic: Defense Impairment
    severity: 90
    branches:
      - match: >-
          (is_ct AND app = 'organizations.amazonaws.com'
           AND api IN ('LeaveOrganization', 'RemoveAccountFromOrganization', 'DeleteOrganization', 'CloseAccount'))
          OR (is_gcp AND (api ILIKE '%Projects.MoveProject' OR api = 'cloudresourcemanager.googleapis.com/projects.move'
                          OR (api ILIKE '%Projects.UpdateProject' AND coalesce(g_req, '') ILIKE '%parent%')))
        outcome: any
        severity_sql: "CASE WHEN outcome = 'failure' THEN 75 END"

  - id: cl_firewall_open_world
    clouds: [aws, azure, gcp]
    technique: T1686
    sub_technique: T1686.001
    tactic: Defense Impairment
    severity: 70
    branches:
      - match: >-
          is_ct AND api IN ('AuthorizeSecurityGroupIngress', 'ModifySecurityGroupRules', 'CreateNetworkAclEntry', 'ReplaceNetworkAclEntry')
          AND regexp_matches(coalesce(ct_rp, ''), '"cidrIp(v6)?"\s*:\s*"(0\.0\.0\.0/0|::/0)"|"cidrBlock"\s*:\s*"0\.0\.0\.0/0"|"ipv6CidrBlock"\s*:\s*"::/0"')
          AND (api NOT LIKE '%NetworkAclEntry' OR (coalesce(ct_rp, '') ILIKE '%"ruleAction":"allow"%' AND coalesce(ct_rp, '') NOT ILIKE '%"egress":true%'))
          AND NOT coalesce(json_extract_string(ct_rp, '$.groupId') IN {cfg.public_sg_allow}, false)
          AND (regexp_matches(coalesce(ct_rp, ''), '"(ipProtocol|protocol)"\s*:\s*"-1"')
               OR len(list_filter({cfg.sensitive_ports:list}, lambda sp:
                      sp BETWEEN coalesce(list_min(list_transform(regexp_extract_all(ct_rp, '"fromPort"\s*:\s*(-?[0-9]+)', 1), lambda x: TRY_CAST(x AS INTEGER))), 0)
                         AND coalesce(list_max(list_transform(regexp_extract_all(ct_rp, '"toPort"\s*:\s*(-?[0-9]+)', 1), lambda x: TRY_CAST(x AS INTEGER))), 65535))) > 0
               OR list_contains(list_transform(regexp_extract_all(ct_rp, '"fromPort"\s*:\s*(-?[0-9]+)', 1), lambda x: TRY_CAST(x AS INTEGER)), -1))
      - match: >-
          is_aza AND api_u IN ('MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/WRITE')
          AND regexp_matches(lower(coalesce(az_req, '')), '"access"\s*:\s*"allow"')
          AND regexp_matches(lower(coalesce(az_req, '')), '"direction"\s*:\s*"inbound"')
          AND regexp_matches(lower(coalesce(az_req, '')), '"sourceaddressprefix(es)?"\s*:\s*\[?\s*"(\*|0\.0\.0\.0/0|internet|any)"')
          AND NOT coalesce(lower(host) IN {cfg.public_sg_allow}, false)
          AND len(list_filter(regexp_extract_all(lower(az_req), '"destinationportranges?"\s*:\s*\[?\s*"([0-9*-]+)"', 1),
                lambda r: r = '*' OR len(list_filter({cfg.sensitive_ports:list}, lambda sp:
                       sp BETWEEN TRY_CAST(split_part(r, '-', 1) AS INTEGER)
                          AND coalesce(TRY_CAST(nullif(split_part(r, '-', 2), '') AS INTEGER), TRY_CAST(split_part(r, '-', 1) AS INTEGER)))) > 0)) > 0
      - match: >-
          is_gcp AND regexp_matches(lower(api), 'v[0-9a-z]*\.compute\.firewalls\.(insert|patch|update)$')
          AND coalesce(g_req, '') LIKE '%0.0.0.0/0%'
          AND upper(coalesce(json_extract_string(g_req, '$.direction'), 'INGRESS')) = 'INGRESS'
          AND (len(regexp_extract_all(coalesce(g_req, ''), '"ports"\s*:\s*\[')) = 0
               OR len(list_filter(regexp_extract_all(g_req, '"ports"\s*:\s*\[([^\]]*)\]', 1), lambda lst:
                      len(list_filter(regexp_extract_all(lst, '"([0-9-]+)"', 1), lambda r:
                          len(list_filter({cfg.sensitive_ports:list}, lambda sp:
