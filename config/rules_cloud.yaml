  # ======================================================================= track Identity SaaS (native, P0-7/11/12, P1-16)
  # Okta System Log (is_okta), Google Workspace Reports + its Cloud Logging copy (is_gws, gw_ev = event name), M365 UAL
  # JSON / Purview CSV (is_m365, m3_* = Parameters / AuditData), Auth0 (is_auth0, api = type code), Duo (is_duo,
  # api = reason). Thresholds: cloud.yaml params "track Identity SaaS". Users are the person (@domain stripped), so an
  # IdP compromise links to the same user's Entra / AWS SSO / GCP activity.
  - id: okta_password_spray
    clouds: [okta]
    technique: T1110
    sub_technique: T1110.003
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      - template: distinct_burst
        filter: >-
          is_okta AND api IN ('user.session.start', 'user.authentication.authenticate', 'user.authentication.verify')
          AND src_ip IS NOT NULL AND NOT al_is_internal_ip(src_ip)
        outcome: failure
        params: {key: [src_ip], distinct: actor_key, window_ms: "{cfg.idp_spray_window_ms}", min_distinct: "{cfg.idp_spray_min_users}"}
      - template: sequence      # the spraying IP then signs in: one sprayed password was right
        label: secondary
        params:
          a_rules: [okta_password_spray]
          b_filter: "is_okta AND action = 'login_success'"
          join: [[src_ip, src_ip]]
          window_ms: "{cfg.idp_spray_success_window_ms}"

  - id: okta_mfa_push_fatigue
    clouds: [okta]
    technique: T1621
    tactic: Credential Access
    severity: 70
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      - template: distinct_burst
        filter: >-
          is_okta AND (api IN ('system.push.send_factor_verify_push', 'user.mfa.okta_verify.deny_push')
                       OR (api = 'user.authentication.auth_via_mfa' AND ok_result IN ('FAILURE', 'DENY')))
        outcome: any
        params: {key: [actor_key], distinct: source_seq, window_ms: "{cfg.mfa_window_ms}", min_distinct: "{cfg.mfa_min_prompts}",
                 having: "count(*) FILTER (WHERE api <> 'system.push.send_factor_verify_push') >= {cfg.idp_push_min_denied}"}
      - template: sequence      # ... and the user finally approves: the attacker holds the session
        label: secondary
        params:
          a_rules: [okta_mfa_push_fatigue]
          b_filter: "is_okta AND ((api = 'user.authentication.auth_via_mfa' AND ok_result = 'SUCCESS') OR action = 'login_success')"
          join: [[actor, actor]]
          window_ms: "{cfg.mfa_success_window_ms}"

