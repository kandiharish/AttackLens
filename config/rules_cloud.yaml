  # ====================================================================================== Behavioural (catalog §5)
  - id: cl_first_seen_api
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    context: true      # novelty alone is not an intrusion: never seeds or adds Initial Access by itself
    severity: 40
    branches:
      - template: first_seen
        filter: "(is_write OR api IN {cfg.sensitive_read_apis}) AND actor_key IS NOT NULL"
        params: {key: [acct, actor_key, api], baseline_days: "{cfg.b1_baseline_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}
        severity_sql: "CASE WHEN api IN {cfg.sensitive_apis} OR api LIKE '%SetIamPolicy' THEN 60 END"

  - id: cl_first_seen_geo
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    context: true      # novelty alone is not an intrusion: never seeds or adds Initial Access by itself
    severity: 45
    # rules track: a stolen key's first call is usually a read (whoami / list buckets, users, roles), so the
    # recon-first APIs count as activity too; still the first row per (actor, network) per day, still context
    branches:
      - template: first_seen
        filter: "(action = 'login_success' OR is_write OR api IN {cfg.recon_first_apis}) AND cc IS NOT NULL"
        params: {key: [actor_key, cc], baseline_days: "{cfg.b2_country_baseline_days}", min_history_days: "{cfg.b2_min_history_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}
        severity: 60
        severity_sql: "CASE WHEN hosting THEN 70 END"
      - template: first_seen
        filter: "(action = 'login_success' OR is_write OR api IN {cfg.recon_first_apis}) AND asn IS NOT NULL"
        params: {key: [actor_key, asn], baseline_days: "{cfg.b2_country_baseline_days}", min_history_days: "{cfg.b2_min_history_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}
        severity: 45
      - template: first_seen
        filter: "(action = 'login_success' OR is_write OR api IN {cfg.recon_first_apis}) AND asn IS NULL AND net IS NOT NULL AND NOT al_is_internal_ip(src_ip)"
        params: {key: [actor_key, net], baseline_days: "{cfg.b2_prefix_baseline_days}", min_history_days: "{cfg.b2_min_history_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}
        severity: 30

  - id: cl_rare_api_account
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    context: true      # novelty alone is not an intrusion: never seeds or adds Initial Access by itself
    severity: 45
    branches:
      - template: first_seen
        filter: "(is_write OR api IN {cfg.sensitive_read_apis}) AND acct IS NOT NULL"
        params: {key: [acct, api], hist_key: acct, baseline_days: "{cfg.b3_baseline_days}", min_history_days: "{cfg.b3_min_history_days}",
                 max_prior_count: "{cfg.b3_rare_api_max_calls}", max_prior_actors: 1,
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}

  - id: cl_discovery_burst
    clouds: [aws, azure, gcp]
    technique: T1580
    tactic: Discovery
    severity: 60
    branches:
      - template: distinct_burst
        filter: &discovery_reads >-
          ((is_ct AND regexp_matches(coalesce(api, ''), '^(List|Describe|Get|Search|Lookup|BatchGet|Scan)')
            AND api NOT IN ('GetObject', 'GetSecretValue', 'GetParameter', 'GetParameters', 'GetParametersByPath'))
           OR (is_aza AND api_u LIKE '%/READ')
           OR (is_gcp AND regexp_matches(coalesce(api, ''), '\.(list|get|aggregatedList|search|testIamPermissions|getIamPolicy)$')))
          AND NOT regexp_matches(coalesce(ua, ''), {cfg.inventory_ua_regex}) AND NOT coalesce(ct_svc, false)
        outcome: any
        params: {key: ["coalesce(session, actor_key)"], distinct: api, window_ms: "{cfg.b4_window_ms}", min_distinct: "{cfg.b4_min_distinct}",
                 having: "count(DISTINCT app) >= {cfg.b4_min_services}", baseline_mult: "{cfg.b4_baseline_mult}",
                 baseline_days: "{cfg.b4_baseline_days}"}
        severity_sql: "CASE WHEN bool_or(coalesce(ct_instance_role, false)) OR bool_or(api = 'GetCallerIdentity') THEN 75 END"
      # rules track, low tier: a smaller sweep (>= b4_low_min_distinct APIs over >= b4_min_services services) that
      # carries the stolen-credential fingerprint: several denied APIs, or several recon-first APIs (whoami, list
      # users / roles / buckets); never from the console UA. No baseline_mult: an identity that never listed
      # anything would be cold-started by its own first sweep, which is the case this tier is for.
      - template: distinct_burst
        filter: *discovery_reads
        outcome: any
        params:
          key: ["coalesce(session, actor_key)"]
          distinct: api
          window_ms: "{cfg.b4_window_ms}"
          min_distinct: "{cfg.b4_low_min_distinct}"
          having: >-
            count(DISTINCT app) >= {cfg.b4_min_services}
            AND count(*) FILTER (WHERE coalesce(ua, '') LIKE '%console.amazonaws.com%') = 0
            AND (count(DISTINCT api) FILTER (WHERE denied) >= {cfg.b4_low_min_denied}
                 OR count(DISTINCT api) FILTER (WHERE api IN {cfg.recon_first_apis}) >= {cfg.b4_low_min_recon})
        severity: 55

  - id: cl_denied_spike
    clouds: [aws, azure, gcp]
    technique: T1580
    tactic: Discovery
    severity: 60
    secondary: {technique: T1098, tactic: Privilege Escalation, severity: 70}
    branches:
      - template: rate_spike
        filter: "NOT coalesce(ct_type = 'AWSService', false)"
        outcome: any
        # rules track: keyed on the identity only. Keyed on (identity, IP), a known identity calling from a NEW IP had
        # no history for that key and was capped at cold_start severity: exactly the stolen-key case was muted.
        params: {key: [actor_key], num: denied, distinct: api, window_ms: "{cfg.b5_window_ms}",
                 min_num: "{cfg.b5_min_num}", min_distinct: "{cfg.b5_min_distinct}", min_ratio: "{cfg.b5_min_ratio}",
                 z: "{cfg.b5_z}", sigma_floor: "{cfg.b5_sigma_floor}", baseline_days: "{cfg.b5_baseline_days}"}
        label_sql: >-
          CASE WHEN count(DISTINCT api) FILTER (WHERE app IN ('iam.amazonaws.com', 'sts.amazonaws.com')
                                                   OR api_u LIKE 'MICROSOFT.AUTHORIZATION/%' OR api ILIKE '%SetIamPolicy') >= 3
               THEN 'secondary' END
        severity_sql: >-
          CASE WHEN bool_and(coalesce(ua, '') LIKE '%console.amazonaws.com%' AND regexp_matches(coalesce(api, ''), '^(Describe|List|Get)'))
               THEN 30 END

  - id: cl_impossible_travel
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 65
    branches:
      - template: geo_velocity
        filter: "action = 'login_success' OR (is_write AND ok_row)"
        outcome: any
        params: {min_km: "{cfg.b6_min_km}", max_kmh: "{cfg.b6_max_kmh}", ignore_same_asn: true}

  - id: cl_new_principal_privileged
    clouds: [aws, azure, gcp]
    technique: T1136
    sub_technique: T1136.003
    tactic: Persistence
    severity: 85
    secondary: {technique: T1098, sub_technique: T1098.003, tactic: Privilege Escalation, severity: 85}
    branches:
      - template: sequence
        params:
          a_filter: &new_principal_a >-
            ok_row AND ((is_ct AND api IN ('CreateUser', 'CreateRole', 'CreateLoginProfile'))
                        OR (is_azd AND au_name IN ('Add user', 'Add service principal', 'Add application', 'Invite external user'))
                        OR (is_gcp AND api LIKE '%CreateServiceAccount'))
          b_filter: "ok_row AND NOT coalesce(machine, false) AND (api IN {cfg.sensitive_apis} OR api LIKE '%SetIamPolicy')"
          join:
            - - &new_principal_key >-
                lower(CASE WHEN is_ct THEN coalesce(json_extract_string(ct_rp, '$.userName'), json_extract_string(ct_rp, '$.roleName'))
                           WHEN is_azd AND au_name IN ('Add service principal', 'Add application') THEN json_extract_string(tr_json, '$[0].displayName')
                           WHEN is_azd THEN target_user
                           ELSE nullif(regexp_extract(coalesce(json_extract_string(g_resp, '$.email'), ''), '^([^@]+)', 1), '') END)
              - actor_key
          window_ms: "{cfg.b7_window_ms}"
      - template: sequence
        params:
          a_filter: "ok_row AND ((is_ct AND api = 'CreateAccessKey') OR (is_gcp AND api LIKE '%CreateServiceAccountKey'))"
          b_filter: "ok_row AND (api IN {cfg.sensitive_apis} OR api LIKE '%SetIamPolicy')"
          join:
            - - >-
                coalesce(json_extract_string(ct_re, '$.accessKey.accessKeyId'),
                         nullif(regexp_extract(coalesce(g_resp, ''), '"name"\s*:\s*"[^"]*/keys/([0-9a-f]+)"', 1), ''))
              - "coalesce(ct_akid, nullif(regexp_extract(coalesce(g_keyname, ''), '/keys/([0-9a-f]+)$', 1), ''))"
          window_ms: "{cfg.b7_window_ms}"
      - template: sequence
        label: secondary
        params:
          a_filter: *new_principal_a
          b_rules: [aws_admin_policy_attached, az_entra_privileged_role, az_rbac_privileged_assignment, gcp_sensitive_grant,
                    aws_iam_privesc_primitives]
          join: [[*new_principal_key, target_user]]
          window_ms: "{cfg.b7_window_ms}"

  - id: seq_new_key_used_new_ip
    clouds: [aws, gcp]
    technique: T1098
    sub_technique: T1098.001
    tactic: Persistence
    severity: 80
    branches:
      - template: sequence
        params:
          a_filter: "ok_row AND ((is_ct AND api = 'CreateAccessKey') OR (is_gcp AND api LIKE '%CreateServiceAccountKey'))"
          b_filter: "(is_ct AND ct_akid IS NOT NULL) OR (is_gcp AND g_keyname IS NOT NULL)"
          join:
            - - >-
                coalesce(json_extract_string(ct_re, '$.accessKey.accessKeyId'),
                         nullif(regexp_extract(coalesce(g_resp, ''), '"name"\s*:\s*"[^"]*/keys/([0-9a-f]+)"', 1), ''))
              - "coalesce(ct_akid, nullif(regexp_extract(coalesce(g_keyname, ''), '/keys/([0-9a-f]+)$', 1), ''))"
          pair_where: "b.src_ip IS NOT NULL AND b.src_ip IS DISTINCT FROM a.src_ip AND b.net IS DISTINCT FROM a.net"
          window_ms: "{cfg.b8_window_ms}"
        severity_sql: "CASE WHEN b.api IN {cfg.recon_first_apis} OR b.api IN {cfg.sensitive_apis} THEN 90 END"

  - id: seq_role_chain
    clouds: [aws, gcp]
    technique: T1548
    sub_technique: T1548.005
    tactic: Privilege Escalation
    severity: 60
    branches:
      - template: first_seen
        filter: &assume_role "is_ct AND app = 'sts.amazonaws.com' AND api IN ('AssumeRole', 'AssumeRoleWithWebIdentity', 'AssumeRoleWithSAML', 'AssumeRoot')"
        params: {key: [actor_key, "lower(json_extract_string(ct_rp, '$.roleArn'))"], baseline_days: "{cfg.b9_baseline_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}
        target: "nullif(regexp_extract(coalesce(json_extract_string(ct_rp, '$.roleArn'), ''), ':role/(?:.*/)?([^/]+)$', 1), '')"
      - match: >-
          is_ct AND app = 'sts.amazonaws.com' AND api IN ('AssumeRole', 'AssumeRoleWithWebIdentity', 'AssumeRoleWithSAML')
          AND NOT coalesce(ct_svc, false)
          AND nullif(regexp_extract(coalesce(json_extract_string(ct_rp, '$.roleArn'), ''), '::([0-9]{12}):', 1), '') IS NOT NULL
          AND regexp_extract(json_extract_string(ct_rp, '$.roleArn'), '::([0-9]{12}):', 1) <> coalesce(acct, '')
          AND NOT list_contains({cfg.trusted_aws_accounts:list}, regexp_extract(json_extract_string(ct_rp, '$.roleArn'), '::([0-9]{12}):', 1))
        severity: 75
        target: "nullif(regexp_extract(coalesce(json_extract_string(ct_rp, '$.roleArn'), ''), ':role/(?:.*/)?([^/]+)$', 1), '')"
      - template: sequence
        severity: 75
        params:
          a_filter: "is_ct AND ok_row AND app = 'sts.amazonaws.com' AND api = 'AssumeRole'"
          b_filter: "is_ct AND ok_row AND app = 'sts.amazonaws.com' AND api = 'AssumeRole' AND ct_akid IS NOT NULL"
          join: [["json_extract_string(ct_re, '$.credentials.accessKeyId')", ct_akid]]
          window_ms: "{cfg.b9_window_ms}"
      - match: "is_gcp AND json_array_length(g_deleg) >= 2"
        severity: 75

  - id: seq_grant_then_data_access
    clouds: [aws, azure, gcp]
    technique: T1098
    sub_technique: T1098.003
    tactic: Privilege Escalation
    severity: 85
    secondary: {technique: T1530, tactic: Collection, severity: 85}
    branches:
      - template: sequence
        label: secondary
        params:
          a_rules: [aws_admin_policy_attached, aws_role_trust_backdoor, az_rbac_privileged_assignment, gcp_sensitive_grant,
                    az_oauth_consent_privileged, aws_iam_privesc_primitives]
          a_min_severity: 45
          b_filter: >-
            ok_row AND (api IN ('GetObject', 'ListObjects', 'ListObjectsV2', 'GetSecretValue', 'BatchGetSecretValue', 'GetPasswordData',
                                'storage.objects.get', 'storage.objects.list', 'GetBlob')
                        OR api LIKE '%AccessSecretVersion'
                        OR (api IN ('GetParameter', 'GetParameters', 'GetParametersByPath') AND lower(json_extract_string(ct_rp, '$.withDecryption')) = 'true')
                        OR api_u IN ('MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION', 'MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION')
                        OR (api = 'DescribeInstanceAttribute' AND json_extract_string(ct_rp, '$.attribute') = 'userData'))
          join: [[target_user, actor_key]]
          window_ms: "{cfg.b10_window_ms}"
        severity_sql: "CASE WHEN a.actor IS DISTINCT FROM b.actor AND a.actor IS DISTINCT FROM b.actor_key THEN 90 END"

  - id: seq_logging_off_then_write
    clouds: [aws, azure, gcp]
    technique: T1685
    sub_technique: T1685.002
    tactic: Defense Impairment
    severity: 75
    # a pipeline deploying on schedule after someone else's tamper is not the attacker acting blind: context, unless the
    # CI identity itself looks wrong (new network, denied burst, attack tool UA). The tamper alert itself is unchanged.
    automation: true
    branches:
      - template: sequence
        params:
          a_rules: [aws_logging_tamper, aws_security_service_off, az_diag_or_defender_off, gcp_logging_tamper, az_lock_deleted]
          a_min_severity: "{cfg.b11_min_severity}"
          b_filter: "is_write AND ok_row AND NOT coalesce(machine, false)"
          join: [[acct, acct]]
          window_ms: "{cfg.b11_window_ms}"
        # the tamper actor writing (90) or anyone writing from the tamper's source IP (85) is the attacker acting in
        # the blind window; any other identity's routine write in the account is only a signal (50)
        severity_sql: >-
          CASE WHEN a.actor = b.actor OR a.actor = b.actor_key OR a.actor = b.src_user THEN 90
               WHEN b.src_ip IS NOT NULL AND b.src_ip = a.src_ip THEN 85 ELSE 50 END

  - id: cl_session_multi_asn
    clouds: [aws, azure]
    technique: T1550
    sub_technique: T1550.001
    tactic: Lateral Movement
    severity: 70
    branches:
      - template: multi_network_session
        filter: "is_ct AND ct_akid LIKE 'ASIA%' AND ct_vpce IS NULL AND NOT coalesce(ct_svc, false) AND NOT al_is_internal_ip(src_ip)"
        outcome: any
        params: {session: ct_akid, network: net, window_ms: "{cfg.b12_window_ms}", min_networks: "{cfg.b12_min_networks}"}
        # without an ASN (no geo.asn_db_path, no SigninLogs ASN) the network is a /16 or /48 prefix: a laptop moving
        # between office, VPN and home changes prefix all day, so this is context (35), not token-theft evidence
        severity_sql: &b12_sev >-
          CASE WHEN bool_or(hosting) OR count(DISTINCT cc) > 1 THEN 85 WHEN bool_and(asn IS NULL) THEN 35 END
      - template: multi_network_session
        filter: "is_ct AND ct_akid LIKE 'AKIA%' AND ct_vpce IS NULL AND NOT coalesce(ct_svc, false) AND NOT al_is_internal_ip(src_ip)"
        outcome: any
        params: {session: ct_akid, network: net, window_ms: "{cfg.b12_long_key_window_ms}", min_networks: "{cfg.b12_min_networks}"}
        severity_sql: *b12_sev
      - template: multi_network_session
        filter: "is_azs AND si_sess IS NOT NULL AND NOT al_is_internal_ip(src_ip)"
        outcome: any
        params: {session: si_sess, network: net, window_ms: "{cfg.b12_window_ms}", min_networks: "{cfg.b12_min_networks}"}
        severity_sql: *b12_sev

  - id: cl_mass_destruction
    clouds: [aws, azure, gcp]
    technique: T1485
    tactic: Impact
    severity: 85
    branches:
      - template: distinct_burst
        filter: "is_ct AND api IN ('DeleteObject', 'DeleteObjects')"
        params: {key: [actor_key, "json_extract_string(ct_rp, '$.bucketName')"],
                 distinct: "coalesce(json_extract_string(ct_rp, '$.key'), CAST(source_seq AS VARCHAR))",
                 window_ms: "{cfg.b13_object_window_ms}", min_distinct: "{cfg.b13_min_objects}",
                 baseline_mult: "{cfg.b13_baseline_mult}", baseline_days: "{cfg.b13_baseline_days}"}
      - template: distinct_burst
        filter: "(is_gcp AND api = 'storage.objects.delete') OR (is_azb AND api = 'DeleteBlob')"
        params: {key: [actor_key, "coalesce(sb_account, nullif(regexp_extract(coalesce(g_res, ''), 'buckets/([^/]+)', 1), ''), src_ip)"],
                 distinct: "coalesce(g_res, sb_key, CAST(source_seq AS VARCHAR))",
                 window_ms: "{cfg.b13_object_window_ms}", min_distinct: "{cfg.b13_min_objects}",
                 baseline_mult: "{cfg.b13_baseline_mult}", baseline_days: "{cfg.b13_baseline_days}"}
      - template: distinct_burst
        filter: "(is_ct AND api = 'DeleteBucket') OR (is_gcp AND api = 'storage.buckets.delete') OR (is_aza AND api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/DELETE')"
        params: {key: [actor_key, acct], distinct: "coalesce(json_extract_string(ct_rp, '$.bucketName'), g_res, lower(host))",
                 window_ms: "{cfg.b13_resource_window_ms}", min_distinct: "{cfg.b13_min_buckets}"}
      - template: distinct_burst
        filter: >-
          (is_ct AND is_write AND regexp_matches(coalesce(api, ''), '^(Delete|Terminate|Remove|Purge|Deregister|ScheduleKeyDeletion)')
           AND api NOT IN ('DeleteObject', 'DeleteObjects'))
          OR (is_aza AND api_u LIKE '%/DELETE') OR (is_gcp AND regexp_matches(coalesce(api, ''), '\.(delete|destroy)$') AND api <> 'storage.objects.delete')
        params: {key: [actor_key, acct], distinct: "coalesce(ct_rp, lower(host), g_res)", window_ms: "{cfg.b13_resource_window_ms}",
                 min_distinct: "{cfg.b13_min_resources}", baseline_mult: "{cfg.b13_baseline_mult}", baseline_days: "{cfg.b13_baseline_days}"}
      - template: distinct_burst
        filter: "is_aza AND api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/REGENERATEKEY/ACTION'"
        params: {key: [actor_key], distinct: lower(host), window_ms: "{cfg.b13_resource_window_ms}", min_distinct: "{cfg.b13_min_buckets}"}
      - template: sequence
        severity: 95
        params:
          a_rules: [cl_backup_destruction, aws_logging_tamper, aws_security_service_off, az_diag_or_defender_off, gcp_logging_tamper]
          a_min_severity: 40
          b_rules: [cl_mass_destruction]
          join: [[acct, acct]]
          window_ms: "{cfg.b13_prior_window_ms}"

  - id: cl_exfil_volume
    clouds: [aws, azure, gcp]
    technique: T1530
    tactic: Collection
    severity: 75
    branches:
      - template: distinct_burst
        filter: "is_ct AND api = 'GetObject'"
        params: {key: [actor_key, acct], distinct: "coalesce(json_extract_string(ct_rp, '$.key'), CAST(source_seq AS VARCHAR))",
                 window_ms: "{cfg.b14_window_ms}", min_distinct: "{cfg.b14_min_objects}",
                 baseline_mult: "{cfg.b14_baseline_mult}", baseline_days: "{cfg.b14_baseline_days}"}
        severity_sql: &b14_sev "CASE WHEN NOT bool_or(corp_ip) AND bool_and(provider IS NULL) AND bool_and(NOT al_is_internal_ip(src_ip)) THEN 85 END"
      - template: distinct_burst
        filter: "is_ct AND api = 'GetObject'"
        params: {key: [actor_key, acct], distinct: source_seq, window_ms: "{cfg.b14_window_ms}", min_distinct: 1,
                 having: "sum(TRY_CAST(json_extract_string(ct_add, '$.bytesTransferredOut') AS DOUBLE)) > {cfg.b14_min_bytes}"}
        severity_sql: *b14_sev
      - template: distinct_burst
        filter: "(is_gcp AND api = 'storage.objects.get') OR (is_azb AND api = 'GetBlob')"
        # AccountKey / SAS / anonymous reads have no principal: the caller IP stands for it (NULL keys are skipped)
        params: {key: ["coalesce(actor_key, src_ip)", "coalesce(src_ip, '')"], distinct: "coalesce(g_res, sb_key, CAST(source_seq AS VARCHAR))",
                 window_ms: "{cfg.b14_window_ms}", min_distinct: "{cfg.b14_min_objects}",
                 baseline_mult: "{cfg.b14_baseline_mult}", baseline_days: "{cfg.b14_baseline_days}"}
        severity_sql: *b14_sev
      - template: distinct_burst
        filter: "is_azb AND api = 'GetBlob'"
        params: {key: ["coalesce(actor_key, src_ip)", sb_account], distinct: source_seq, window_ms: "{cfg.b14_window_ms}", min_distinct: 1,
                 having: "sum(bytes_out) > {cfg.b14_min_bytes}"}
        severity_sql: *b14_sev
      - template: distinct_burst
        filter: >-
          is_aza AND api_u IN ('MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION', 'MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTSERVICESAS/ACTION',
                               'MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION', 'MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION')
        params: {key: [actor_key], distinct: api_u, window_ms: "{cfg.b14_window_ms}", min_distinct: "{cfg.b14_sas_min}"}

  - id: cl_storage_data_access
    clouds: [aws, azure, gcp]
    technique: T1530
    tactic: Collection
    severity: 70
    branches:
      # a source (principal, else caller IP for AccountKey / SAS / anonymous reads) that never read this bucket /
      # storage account in st_novel_days pulls >= st_min_objects distinct objects in an hour (store cold start)
      - template: new_source_burst
        filter: &st_read >-
          NOT coalesce(machine, false)
          AND ((is_ct AND api = 'GetObject') OR (is_gcp AND api = 'storage.objects.get') OR (is_azb AND api = 'GetBlob'))
        params:
          store: &st_store >-
            lower(coalesce(json_extract_string(ct_rp, '$.bucketName'), nullif(regexp_extract(coalesce(g_res, ''), 'buckets/([^/]+)', 1), ''), sb_account))
          source: &st_source "coalesce(actor_key, src_ip)"
          distinct: &st_obj "coalesce(json_extract_string(ct_rp, '$.key'), g_res, sb_key)"
          window_ms: "{cfg.st_window_ms}"
          min_distinct: "{cfg.st_min_objects}"
          novel_days: "{cfg.st_novel_days}"
          store_history_days: "{cfg.st_store_history_days}"
        # shared key / SAS / anonymous reads are not attributable to anyone -> 80; a new internal reader -> 50
        severity_sql: &st_sev >-
          CASE WHEN bool_and(al_is_internal_ip(src_ip) OR coalesce(corp_ip, false)) THEN 50
               WHEN bool_or(actor_key IS NULL) THEN 80 END
      # a known source reading >= st_baseline_mult x its own hourly p95 (new sources are the branch above)
      - template: distinct_burst
        filter: *st_read
        params: {key: [*st_source, *st_store], distinct: *st_obj, window_ms: "{cfg.st_window_ms}",
                 min_distinct: "{cfg.st_min_objects}", baseline_mult: "{cfg.st_baseline_mult}",
                 baseline_days: "{cfg.st_baseline_days}", require_history: true}
        severity: 65
        severity_sql: *st_sev
      # storage account keys / SAS listed, then key or SAS blob reads on that account from the same IP or network
      - template: sequence
        severity: 85
        params:
          a_filter: >-
            is_aza AND ok_row AND api_u IN ('MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION',
                                            'MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION',
                                            'MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTSERVICESAS/ACTION')
          b_filter: >-
            is_azb AND ok_row AND api IN ('GetBlob', 'ListBlobs', 'CopyBlob', 'GetBlobProperties')
            AND lower(coalesce(sb_auth, '')) IN ('accountkey', 'sas')
          join: [["nullif(regexp_extract(lower(host), '/storageaccounts/([^/]+)', 1), '')", "lower(sb_account)"]]
          pair_where: "(b.src_ip = a.src_ip OR (a.net IS NOT NULL AND b.net = a.net)) AND NOT coalesce(b.corp_ip, false)"
          window_ms: "{cfg.st_key_use_window_ms}"

  - id: cl_dormant_identity_reactivated
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 60
    branches:
      - template: first_seen
        filter: "actor_key IS NOT NULL"
        params: {key: [actor_key], baseline_days: "{cfg.b15_dormant_days}", require_older_history: true,
                 min_history_days: 0, min_actor_events: 0}
        severity_sql: "CASE WHEN is_write OR api IN {cfg.sensitive_read_apis} THEN 75 END"

  - id: cl_new_user_agent_family
    clouds: [aws, azure, gcp]
    technique: T1059
    sub_technique: T1059.009
    tactic: Execution
    severity: 45
    branches:
      - template: first_seen
        filter: "is_write AND ua_family IN {cfg.scripting_ua_families}"
        params: {key: [actor_key, ua_family], baseline_days: "{cfg.b16_baseline_days}",
                 max_per_actor_day: "{cfg.first_seen_max_per_actor_day}", summary_severity: "{cfg.first_seen_summary_severity}"}

  - id: seq_risky_signin_then_persistence
    clouds: [aws, azure]
    technique: T1098
    tactic: Persistence
    severity: 85
    branches:
      - template: sequence
        params:
          a_rules: [az_risky_signin_success, az_valid_password_new_country, az_mfa_fatigue, az_risky_auth_protocol, cl_first_seen_geo,
                    cl_impossible_travel, aws_console_login_no_mfa]
          a_min_severity: 45
          b_rules: [az_auth_method_added, az_app_or_identity_credential, az_oauth_consent_privileged, az_entra_privileged_role,
                    aws_credential_for_other_user, aws_keypair_new]
          join: [[actor, actor]]
          window_ms: "{cfg.b17_window_ms}"

  - id: cl_volume_zscore
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 50
    branches:
      - template: rate_spike
        filter: "actor_key IS NOT NULL AND NOT coalesce(machine, false)"
        params: {key: [actor_key], num: is_write, window_ms: "{cfg.b18_window_ms}", min_num: "{cfg.b18_min_num}",
                 z: "{cfg.b18_z}", sigma_floor: "{cfg.b18_sigma_floor}", baseline_days: "{cfg.b18_baseline_days}"}

  # ======================================================================================================================
  # Rules track (native rule quality, reports/cloud/rule_catalog.md): gaps from the public-dataset eval
  # (reports/ext/cloud_eval.md) and the novel / missed synthetic stories, written as general detections.
  # Tests: backend/tests/test_detect_cloud_native_rules.py.
  - id: aws_console_unknown_user
    clouds: [aws]
    technique: T1110
    tactic: Credential Access
    severity: 65
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      # a console sign-in for a user name that does not exist in the account (CloudTrail hides the typed name as
      # HIDDEN_DUE_TO_SECURITY_REASONS): one is a typo (context), a few from one IP are user-name guessing
      - match: &unknown_user >-
          is_ct AND api = 'ConsoleLogin' AND action = 'login_failed'
          AND coalesce(ct_msg, '') ILIKE 'No username found in supplied account%'
        outcome: any
        severity: 35
      - template: distinct_burst
        filter: *unknown_user
        outcome: any
        params: {key: [src_ip], distinct: source_seq, window_ms: "{cfg.bf_window_ms}",
                 min_distinct: "{cfg.unknown_user_min_failures}"}
      - template: sequence
        label: secondary
        params:
          a_rules: [aws_console_unknown_user]
          a_min_severity: 45
          b_filter: "is_ct AND api = 'ConsoleLogin' AND action = 'login_success'"
          join: [[src_ip, src_ip]]
          window_ms: "{cfg.bf_success_window_ms}"

  - id: cl_storage_enum_burst
    clouds: [azure, gcp]        # S3: aws_s3_bucket_enum (track AWS)
    technique: T1619
    tactic: Discovery
    severity: 50
    branches:
      # object listing across many buckets / containers in a short window (ATT&CK T1619 names the List Blobs and
      # ListObjectsV2 procedures); a caller outside corp / private ranges -> 60
      - template: distinct_burst
        filter: >-
          NOT coalesce(machine, false) AND NOT regexp_matches(coalesce(ua, ''), {cfg.inventory_ua_regex})
          AND ((is_gcp AND api = 'storage.objects.list') OR (is_azb AND api IN ('ListBlobs', 'ListContainers')))
        outcome: any
        params:
          key: ["coalesce(actor_key, src_ip)"]
          distinct: >-
            lower(coalesce(nullif(regexp_extract(coalesce(g_res, ''), 'buckets/([^/]+)', 1), ''),
                           nullif(regexp_extract(coalesce(sb_key, ''), '^/([^/]+/[^/?]+)', 1), ''), sb_account))
          window_ms: "{cfg.storage_enum_window_ms}"
          min_distinct: "{cfg.storage_enum_min_buckets}"
        severity_sql: "CASE WHEN bool_and(NOT coalesce(corp_ip, false) AND NOT al_is_internal_ip(src_ip) AND src_ip IS NOT NULL) THEN 60 END"

  - id: cl_storage_write_new_bucket
    clouds: [aws, azure, gcp]
    technique: T1537
    tactic: Exfiltration
    severity: 75
    automation: true
    branches:
      # many objects written (put / copy / rewrite) by a person into a bucket that had NO activity in this account
      # (any read, list, write or its creation) for xfer_new_bucket_novel_days: data moved to a store the account does
      # not use, typically one the actor controls (T1537). A bucket created in the account first is known (its
      # create call is history); account cold start (store_history_days) caps at cold_start.severity.
      - template: new_source_burst
        filter: >-
          (is_ct AND app = 's3.amazonaws.com' AND json_extract_string(ct_rp, '$.bucketName') IS NOT NULL)
          OR (is_gcp AND app = 'storage.googleapis.com' AND g_res LIKE '%buckets/%') OR is_azb
        outcome: any
        params:
          store: acct
          source: >-
            lower(coalesce(json_extract_string(ct_rp, '$.bucketName'), nullif(regexp_extract(coalesce(g_res, ''), 'buckets/([^/]+)', 1), ''),
                           nullif(regexp_extract(coalesce(sb_key, ''), '^/([^/]+/[^/?]+)', 1), ''), sb_account))
          distinct: >-
            CASE WHEN ok_row AND NOT coalesce(machine, false)
                      AND api IN ('PutObject', 'CopyObject', 'CompleteMultipartUpload', 'storage.objects.create',
                                  'storage.objects.rewrite', 'storage.objects.copy', 'PutBlob', 'PutBlockList', 'CopyBlob',
                                  'CopyBlobFromURL', 'PutBlockFromURL')
                 THEN coalesce(json_extract_string(ct_rp, '$.key'), g_res, sb_key) END
          window_ms: "{cfg.xfer_new_bucket_window_ms}"
          min_distinct: "{cfg.xfer_new_bucket_min_objects}"
          novel_days: "{cfg.xfer_new_bucket_novel_days}"
          store_history_days: "{cfg.st_store_history_days}"
        severity_sql: "CASE WHEN bool_and(al_is_internal_ip(src_ip) OR coalesce(corp_ip, false)) THEN 50 END"

  - id: aws_sts_token_new_network
    clouds: [aws]
    technique: T1550
    sub_technique: T1550.001
    tactic: Lateral Movement
    severity: 75
    branches:
      # temporary credentials (AssumeRole / GetSessionToken / federation) issued to one network, then used from
      # another: the token was taken and replayed elsewhere. Prefix-only networks (no ASN file) are a signal (50):
      # a laptop can change /16 between VPN and home; a hosting provider / another ASN is strong.
      - template: sequence
        params:
          a_filter: >-
            is_ct AND ok_row AND app = 'sts.amazonaws.com'
            AND api IN ('AssumeRole', 'GetSessionToken', 'GetFederationToken', 'AssumeRoleWithSAML', 'AssumeRoleWithWebIdentity')
            AND NOT coalesce(ct_svc, false) AND ct_vpce IS NULL AND net IS NOT NULL AND NOT al_is_internal_ip(src_ip)
          b_filter: >-
            is_ct AND ct_akid LIKE 'ASIA%' AND NOT coalesce(ct_svc, false) AND ct_vpce IS NULL
            AND net IS NOT NULL AND NOT al_is_internal_ip(src_ip)
          join: [["json_extract_string(ct_re, '$.credentials.accessKeyId')", ct_akid]]
          pair_where: >-
            b.net IS DISTINCT FROM a.net AND NOT coalesce(b.corp_ip, false) AND NOT coalesce(a.corp_ip, false)
            AND b.provider IS NULL AND NOT coalesce(a.asn = b.asn, false)
          window_ms: "{cfg.sts_reuse_window_ms}"
        severity_sql: "CASE WHEN coalesce(b.hosting, false) THEN 85 WHEN a.asn IS NULL OR b.asn IS NULL THEN 50 END"

  - id: cl_compute_snapshot_create
    clouds: [aws, azure, gcp]
    technique: T1578
    sub_technique: T1578.001
    tactic: Defense Impairment
    severity: 55
    allow: {lists: [backup_principals], severity: 35}
    automation: true
    branches:
      # a person snapshotting / imaging several volumes, databases or instances within an hour (backup services are
      # machine identities and never count): the ATT&CK T1578.001 step before mounting or sharing the copies
      - template: distinct_burst
        filter: >-
          ok_row AND NOT coalesce(machine, false)
          AND ((is_ct AND api IN ('CreateSnapshot', 'CreateSnapshots', 'CreateDBSnapshot', 'CreateDBClusterSnapshot',
                                  'CopySnapshot', 'CopyDBSnapshot', 'CreateImage'))
               OR (is_aza AND api_u IN ('MICROSOFT.COMPUTE/SNAPSHOTS/WRITE', 'MICROSOFT.COMPUTE/IMAGES/WRITE'))
               OR (is_gcp AND regexp_matches(lower(coalesce(api, '')), 'compute\.(snapshots\.insert|disks\.createsnapshot|images\.insert|machineimages\.insert)$')))
        params:
          key: [actor_key]
          distinct: >-
            coalesce(json_extract_string(ct_rp, '$.volumeId'), json_extract_string(ct_rp, '$.dBInstanceIdentifier'),
                     json_extract_string(ct_rp, '$.dBClusterIdentifier'), json_extract_string(ct_rp, '$.sourceSnapshotId'),
                     json_extract_string(ct_rp, '$.instanceId'), json_extract_string(ct_rp, '$.instanceSpecification.instanceId'),
                     lower(host), g_res)
          window_ms: "{cfg.hour_ms}"
          min_distinct: "{cfg.snapshot_burst_min}"

  - id: seq_novel_network_then_action
    clouds: [aws, azure, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 70
    branches:
      # an established identity seen from a network it never used (cl_first_seen_geo, context on its own) and, from
      # the SAME IP within the window, a discovery / credential / collection / exfiltration alert: the valid account
      # is being used by someone else. A = the follow-on alert, B = the novel-network event, so the hit (ts = first
      # B) sits on the access itself, not on the later action.
      - template: sequence
        params:
          # (sequence sides read alerts of rules that ran BEFORE this one: aws_s3_bucket_enum runs later in the file)
          a_rules: [cl_discovery_burst, cl_denied_spike, cl_secrets_mass_read, cl_storage_enum_burst,
                    cl_storage_data_access, cl_exfil_volume, cl_storage_write_new_bucket]
          a_min_severity: 45
          b_rules: [cl_first_seen_geo]
          join: [[actor, actor], [src_ip, src_ip]]
          order: any
          pair_where: "b.ts_ms <= a.ts_ms"
          window_ms: "{cfg.novel_network_action_window_ms}"

  # ======================================================================================================================
  # Track AWS (reports/cloud/log_coverage.md P0-5 VPC Flow, P1-2 Route 53 Resolver, P1-8 Network Firewall, P0-15 S3 data
  # events, P1-4 IAM Identity Center). Port scans, beaconing and exfil volume on flow rows come from the generic network
  # templates (config/rules.yaml port_scan / beaconing / exfil_volume); these rules add what those cannot see.
  # Network rows have no user: hits are keyed by host (instance) and IPs; outcome: any (flows are not API calls).
  # ---------------------------------------------------------------------------------------------- VPC Flow Logs
  - id: aws_vpcflow_mining_port
    clouds: [aws]
    technique: T1496
    sub_technique: T1496.001
    tactic: Impact
    severity: 70
    branches:
      - template: distinct_burst
        filter: >-
          (is_vpcflow OR (is_nfw AND nfw_type = 'netflow')) AND action = 'conn_allowed' AND dst_port IN {cfg.mining_ports}
          AND al_is_internal_ip(src_ip) AND NOT al_is_internal_ip(dst_ip)
        outcome: any
        params: {key: [host, dst_ip], distinct: source_seq, window_ms: "{cfg.mining_window_ms}",
                 min_distinct: "{cfg.mining_min_flows}"}
        severity_sql: "CASE WHEN count(DISTINCT dst_port) = 1 AND sum(coalesce(bytes_out, 0)) >= 1000000 THEN 80 END"

  - id: aws_vpcflow_inbound_after_open
    clouds: [aws]
    technique: T1133
    tactic: Initial Access
    severity: 80
    branches:
      # a security group / NACL opened to the world on an admin port, then an accepted inbound flow from a public IP to
      # an admin port of an instance in that account (the open rule alone is Defense Impairment; this is the use)
      - template: sequence
        params:
          a_rules: [cl_firewall_open_world]
          b_filter: >-
            is_vpcflow AND action = 'conn_allowed' AND dst_port IN {cfg.sensitive_ports}
            AND NOT al_is_internal_ip(src_ip) AND al_is_internal_ip(dst_ip) AND NOT coalesce(corp_ip, false)
          join: [[acct, acct]]
          window_ms: "{cfg.inbound_after_open_window_ms}"

  # ----------------------------------------------------------------------------------------- Route 53 Resolver
  - id: aws_r53_dns_tunnel
    clouds: [aws]
    technique: T1071
    sub_technique: T1071.004
    tactic: Command and Control
    severity: 75
    branches:
      - template: distinct_burst
        filter: "is_r53 AND dns_apex IS NOT NULL AND dns_apex NOT IN {cfg.dns_tunnel_allow_apex}"
        outcome: any
        params: {key: [host, dns_apex], distinct: dst_domain, window_ms: "{cfg.dns_tunnel_window_ms}",
                 min_distinct: "{cfg.dns_tunnel_min_names}",
                 having: "avg(length(split_part(dst_domain, '.', 1))) >= {cfg.dns_tunnel_min_label}"}
        severity_sql: "CASE WHEN count(*) FILTER (WHERE r53_qtype IN ('TXT', 'NULL')) * 2 >= count(*) THEN 85 END"

  - id: aws_r53_dga_nxdomain
    clouds: [aws]
    technique: T1568
    sub_technique: T1568.002
    tactic: Command and Control
    severity: 65
    branches:
      - template: distinct_burst
        filter: "is_r53 AND r53_rcode = 'NXDOMAIN' AND dns_apex IS NOT NULL AND dns_apex NOT IN {cfg.dns_tunnel_allow_apex}"
        outcome: any
        params: {key: [host], distinct: dst_domain, window_ms: "{cfg.dga_window_ms}", min_distinct: "{cfg.dga_min_nx}",
                 having: "count(DISTINCT dns_apex) >= {cfg.dga_min_apex}"}

  - id: aws_r53_firewall_hit
    clouds: [aws]
    technique: T1071
    sub_technique: T1071.004
    tactic: Command and Control
    severity: 65
    branches:
      # Route 53 Resolver DNS Firewall matched a deny-list domain: ALERT = the lookup went through, BLOCK = prevented
      - template: distinct_burst
        filter: "is_r53 AND r53_fw IN ('BLOCK', 'ALERT')"
        outcome: any
        params: {key: [host, dns_apex], distinct: dst_domain, window_ms: "{cfg.hour_ms}", min_distinct: 1}
        severity_sql: "CASE WHEN bool_and(r53_fw = 'BLOCK') THEN 50 END"

  - id: aws_r53_mining_pool
    clouds: [aws]
    technique: T1496
    sub_technique: T1496.001
    tactic: Impact
    severity: 70
    branches:
      - template: distinct_burst
        filter: "is_r53 AND regexp_matches(coalesce(dst_domain, ''), {cfg.mining_domain_regex})"
        outcome: any
        params: {key: [host, dns_apex], distinct: dst_domain, window_ms: "{cfg.hour_ms}", min_distinct: 1}

  # ------------------------------------------------------------------------------------- AWS Network Firewall
  # Suricata alerts (event_type alert -> action ips_alert). The class comes from the rule message + category text; an
  # alert the engine blocked is a prevented attempt (severity 40-45, signal only).
  - id: aws_nfw_mining_alert
    clouds: [aws]
    technique: T1496
    sub_technique: T1496.001
    tactic: Impact
    severity: 75
    branches:
      - template: distinct_burst
        filter: "is_nfw AND action = 'ips_alert' AND regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_mining_regex})"
        outcome: any
        params: {key: [host, dst_ip], distinct: "coalesce(nfw_sid, signature)", window_ms: "{cfg.hour_ms}", min_distinct: 1}
        severity_sql: "CASE WHEN bool_and(outcome = 'blocked') THEN 40 END"

  - id: aws_nfw_c2_alert
    clouds: [aws]
    technique: T1071
    tactic: Command and Control
    severity: 75
    branches:
      - template: distinct_burst
        filter: >-
          is_nfw AND action = 'ips_alert' AND regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_c2_regex})
          AND NOT regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_mining_regex})
        outcome: any
        params: {key: [host, dst_ip], distinct: "coalesce(nfw_sid, signature)", window_ms: "{cfg.hour_ms}", min_distinct: 1}
        severity_sql: "CASE WHEN bool_and(outcome = 'blocked') THEN 45 WHEN bool_or(vendor_severity = '1') THEN 85 END"

  - id: aws_nfw_exploit_alert
    clouds: [aws]
    technique: T1190
    tactic: Initial Access
    severity: 80
    branches:
      - template: distinct_burst
        filter: >-
          is_nfw AND action = 'ips_alert' AND regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_exploit_regex})
          AND NOT al_is_internal_ip(src_ip) AND al_is_internal_ip(dst_ip)
        outcome: any
        params: {key: [host, src_ip], distinct: "coalesce(nfw_sid, signature)", window_ms: "{cfg.hour_ms}", min_distinct: 1}
        severity_sql: "CASE WHEN bool_and(outcome = 'blocked') THEN 40 END"

  - id: aws_nfw_scan_alert
    clouds: [aws]
    technique: T1046
    tactic: Discovery
    severity: 55
    secondary: {technique: T1595, tactic: Reconnaissance, severity: 30}   # internet scanner probing the edge
    branches:
      - template: distinct_burst
        filter: >-
          is_nfw AND action = 'ips_alert' AND regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_scan_regex})
          AND NOT regexp_matches(lower(concat_ws(' ', signature, nfw_cat)), {cfg.nfw_exploit_regex})
        outcome: any
        params: {key: [host, src_ip], distinct: "coalesce(nfw_sid, signature)", window_ms: "{cfg.hour_ms}", min_distinct: 1}
        label_sql: "CASE WHEN bool_and(NOT al_is_internal_ip(src_ip)) THEN 'secondary' END"
        severity_sql: "CASE WHEN bool_and(NOT al_is_internal_ip(src_ip)) THEN 30 WHEN bool_and(outcome = 'blocked') THEN 40 END"

  # ----------------------------------------------------------------------------------------- S3 data events
  - id: aws_s3_lifecycle_expire
    clouds: [aws]
    technique: T1485
    sub_technique: T1485.001
    tactic: Impact
    severity: 65
    allow: {lists: [backup_principals], severity: 35}
    automation: true
    branches:
      # lifecycle rule expiring current or noncurrent object versions within s3_lifecycle_max_days (Codefinger: SSE-C
      # re-encryption, then a short expiration so the victim must pay before the data is gone)
      - match: &s3_lc >-
          is_ct AND api IN ('PutBucketLifecycle', 'PutBucketLifecycleConfiguration') AND ok_row
          AND coalesce(list_min(list_transform(regexp_extract_all(coalesce(ct_rp, ''),
                '"(?:Expiration|NoncurrentVersionExpiration)"\s*:\s*\{[^{}]*"(?:Days|NoncurrentDays)"\s*:\s*"?([0-9]+)', 1),
                lambda x: TRY_CAST(x AS INTEGER))), 100000) <= {cfg.s3_lifecycle_max_days}
      - template: sequence
        severity: 90
        params:
          a_rules: [cl_storage_ransom_encrypt]
          a_min_severity: 85               # the bulk re-encryption burst, not each single SSE-C copy
          b_filter: *s3_lc
          join: [[actor_key, actor_key]]
          window_ms: "{cfg.s3_lifecycle_after_ssec_window_ms}"

  - id: aws_s3_version_purge
    clouds: [aws]
    technique: T1485
    tactic: Impact
    severity: 80
    allow: {lists: [backup_principals], severity: 35}
    branches:
      # DeleteObject WITH a versionId removes the version for good (a plain delete only adds a delete marker)
      - template: distinct_burst
        filter: "is_ct AND api = 'DeleteObject' AND json_extract_string(ct_rp, '$.versionId') IS NOT NULL"
        params: {key: [actor_key, "json_extract_string(ct_rp, '$.bucketName')"],
                 distinct: "json_extract_string(ct_rp, '$.key') || '#' || json_extract_string(ct_rp, '$.versionId')",
                 window_ms: "{cfg.s3_version_purge_window_ms}", min_distinct: "{cfg.s3_version_purge_min}"}

  - id: aws_s3_bucket_enum
    clouds: [aws]
    technique: T1619
    tactic: Discovery
    severity: 50
    branches:
      - template: distinct_burst
        filter: >-
          is_ct AND api IN ('ListObjects', 'ListObjectsV2', 'ListObjectVersions', 'GetBucketAcl', 'GetBucketPolicy',
                            'GetBucketPolicyStatus', 'GetBucketLocation', 'HeadBucket')
          AND NOT coalesce(machine, false) AND NOT regexp_matches(coalesce(ua, ''), {cfg.inventory_ua_regex})
        outcome: any
        params: {key: ["coalesce(session, actor_key)"], distinct: "json_extract_string(ct_rp, '$.bucketName')",
                 window_ms: "{cfg.s3_enum_window_ms}", min_distinct: "{cfg.s3_enum_min_buckets}"}
        severity_sql: "CASE WHEN count(*) FILTER (WHERE denied) * 3 >= count(*) OR bool_and(NOT coalesce(corp_ip, false) AND NOT al_is_internal_ip(src_ip) AND src_ip IS NOT NULL) THEN 60 END"

  - id: aws_s3_anonymous_read
    clouds: [aws]
    technique: T1530
    tactic: Collection
    severity: 65
    allow: {lists: [public_bucket_allow], severity: 35}
    branches:
      # anonymous principal (userIdentity.type AWSAccount without a principal id) pulling many objects
      - template: distinct_burst
        filter: "is_ct AND api = 'GetObject' AND ct_type = 'AWSAccount' AND actor IS NULL AND src_ip IS NOT NULL"
        params: {key: [src_ip, "json_extract_string(ct_rp, '$.bucketName')"], distinct: "json_extract_string(ct_rp, '$.key')",
                 window_ms: "{cfg.hour_ms}", min_distinct: "{cfg.s3_anon_min_objects}"}

  # ------------------------------------------------------------------------------ IAM Identity Center sign-in
  # signin.amazonaws.com CredentialChallenge / CredentialVerification / UserAuthentication (serviceEventDetails verdict,
  # additionalEventData.CredentialType / AuthWorkflowID). config/sources.yaml maps a failed CredentialVerification to
  # login_failed and UserAuthentication to login_success / login_failed.
  - id: aws_sso_password_spray
    clouds: [aws]
    technique: T1110
    sub_technique: T1110.003
    tactic: Credential Access
    severity: 70
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      - template: distinct_burst
        filter: >-
          is_ct AND api = 'CredentialVerification' AND outcome = 'failure' AND upper(coalesce(ct_cred, '')) LIKE '%PASSWORD%'
          AND NOT coalesce(corp_ip, false)
        outcome: any
        params: {key: [src_ip], distinct: actor_key, window_ms: "{cfg.sso_spray_window_ms}", min_distinct: "{cfg.sso_spray_min_users}"}
      - template: sequence
        label: secondary
        params:
          a_rules: [aws_sso_password_spray]
          b_filter: "is_ct AND api = 'UserAuthentication' AND outcome = 'success'"
          join: [[src_ip, src_ip]]
          window_ms: "{cfg.sso_spray_window_ms}"

  - id: aws_sso_bruteforce
    clouds: [aws]
    technique: T1110
    sub_technique: T1110.001
    tactic: Credential Access
    severity: 70
    secondary: {technique: T1078, sub_technique: T1078.004, tactic: Initial Access, severity: 85}
    branches:
      - template: distinct_burst
        filter: >-
          is_ct AND api = 'CredentialVerification' AND outcome = 'failure' AND upper(coalesce(ct_cred, '')) LIKE '%PASSWORD%'
        outcome: any
        params: {key: [actor_key], distinct: source_seq, window_ms: "{cfg.sso_bf_window_ms}", min_distinct: "{cfg.sso_bf_min_failures}"}
      - template: sequence
        label: secondary
        params:
          a_rules: [aws_sso_bruteforce]
          a_filter: "technique_id = 'T1110'"
          b_filter: "is_ct AND api = 'UserAuthentication' AND outcome = 'success'"
          join: [[actor, actor]]
          window_ms: "{cfg.sso_bf_window_ms}"

  - id: aws_sso_mfa_fatigue
    clouds: [aws]
    technique: T1621
    tactic: Credential Access
    severity: 70
    branches:
      # the password was accepted, then the second factor is challenged / fails again and again for one user
      - template: distinct_burst
        filter: >-
          is_ct AND api IN ('CredentialChallenge', 'CredentialVerification')
          AND upper(coalesce(ct_cred, 'PASSWORD')) NOT LIKE '%PASSWORD%'
          AND (api = 'CredentialChallenge' OR outcome = 'failure')
        outcome: any
        params: {key: [actor_key], distinct: source_seq, window_ms: "{cfg.sso_mfa_window_ms}", min_distinct: "{cfg.sso_mfa_min_challenges}"}
        severity_sql: "CASE WHEN bool_and(NOT coalesce(corp_ip, false)) AND count(*) FILTER (WHERE outcome = 'failure') >= 3 THEN 80 END"

  - id: aws_sso_mfa_device_new_net
    clouds: [aws]
    technique: T1556
    sub_technique: T1556.006
    tactic: Persistence
    severity: 35
    branches:
      # an MFA device registered (Identity Center self-service or IAM EnableMFADevice) from a network the user has not
      # used in sso_newnet_days (activity in the hour before, e.g. the attacker's own sign-in, does not count)
      - match: >-
          is_ct AND ok_row AND regexp_matches(lower(coalesce(api, '')), {cfg.sso_mfa_regex}) AND lower(api) NOT LIKE 'start%'
          AND src_ip IS NOT NULL AND net IS NOT NULL AND NOT coalesce(corp_ip, false) AND NOT al_is_internal_ip(src_ip)
        severity_sql: >-
          CASE WHEN EXISTS (SELECT 1 FROM cloud_ev z WHERE z.actor_key = e.actor_key AND z.ts_ms < e.ts_ms - {cfg.hour_ms}
                            AND z.ts_ms >= e.ts_ms - {cfg.sso_newnet_days} * 86400000)
                AND NOT EXISTS (SELECT 1 FROM cloud_ev z WHERE z.actor_key = e.actor_key AND z.net = e.net
                                AND z.ts_ms < e.ts_ms - {cfg.hour_ms} AND z.ts_ms >= e.ts_ms - {cfg.sso_newnet_days} * 86400000)
               THEN 75 END

  # ======================================================================================================================
  # Track K8s + GCP (reports/cloud/log_coverage.md P0-8, P0-14, P1-5, P1-11). The Kubernetes rules read one view
  # (config/cloud.yaml kverb / kres / ksub / kns / kname / kreq / kcode / kuser) over generic, EKS and AKS audit (is_k8s)
  # and GKE Cloud Audit Logs (is_gke), so the same SQL covers every shape. kfinal = the request's final record
  # (ResponseComplete / Panic; GKE has one record). Control-plane / node / controller identities (k8s_sys) never count.
  - id: k8s_api_new_network
    clouds: [k8s, gcp]
    technique: T1078
    sub_technique: T1078.004
    tactic: Initial Access
    severity: 50
    branches:
      # kubectl / API use by a cluster user from a network (ASN, else /16) not used in k8s_newip_baseline_days
      - template: first_seen
        filter: >-
          (is_k8s OR is_gke) AND kfinal AND NOT k8s_sys AND net IS NOT NULL AND src_ip IS NOT NULL
          AND NOT al_is_internal_ip(src_ip) AND NOT coalesce(corp_ip, false)
        outcome: any
        params: {key: [acct, actor_key, net], baseline_days: "{cfg.k8s_newip_baseline_days}", max_per_actor_day: 1,
                 summary_severity: 50}
        severity_sql: "CASE WHEN kanon OR hosting THEN 65 END"

  - id: k8s_anonymous_access
    clouds: [k8s, gcp]
    technique: T1078
    sub_technique: T1078.001
    tactic: Initial Access
    severity: 75
    branches:
      # system:anonymous / system:unauthenticated served a real resource (health / version endpoints have no objectRef)
      - match: >-
          kfinal AND kanon AND k8s_ok AND kres IS NOT NULL
          AND kres NOT IN ('selfsubjectreviews', 'selfsubjectaccessreviews', 'selfsubjectrulesreviews')
        severity_sql: "CASE WHEN kverb IN ('create', 'update', 'patch', 'delete') OR kres = 'secrets' OR ksub IS NOT NULL THEN 90 END"

  - id: k8s_pod_exec
    clouds: [k8s, gcp]
    technique: T1609
    tactic: Execution
    severity: 35       # routine exec by people who exec regularly is context; the escalations below are the signal
    allow: {lists: [k8s_admins], severity: 35}
    branches:
      # kubectl exec / attach into a running container. 65 when this actor has not exec'd in k8s_newip_baseline_days but
      # was already active 3+ days ago (no cold-start noise); 75 for kube-system, a service account, anonymous or a
      # download-and-run / reverse-shell command.
      - match: "kfinal AND k8s_ok AND kres = 'pods' AND ksub IN ('exec', 'attach') AND NOT k8s_sys"
        severity_sql: >-
          CASE WHEN kanon OR kns = 'kube-system' OR coalesce(kuser, '') LIKE 'system:serviceaccount:%'
                    OR regexp_matches(coalesce(k8s_cmd, ''), {cfg.k8s_bad_cmd_regex}) THEN 75
               WHEN EXISTS (SELECT 1 FROM cloud_ev z WHERE z.actor_key = e.actor_key AND z.ts_ms < e.ts_ms - 3 * 86400000)
                    AND NOT EXISTS (SELECT 1 FROM cloud_ev z WHERE z.actor_key = e.actor_key AND z.kres = 'pods'
                                    AND z.ksub IN ('exec', 'attach') AND z.ts_ms < e.ts_ms - {cfg.hour_ms}
                                    AND z.ts_ms >= e.ts_ms - {cfg.k8s_newip_baseline_days} * 86400000) THEN 65 END

  - id: k8s_privileged_workload
    clouds: [k8s, gcp]
    technique: T1610
    tactic: Execution
    severity: 70
    secondary: {technique: T1611, tactic: Privilege Escalation, severity: 85}
    automation: true
    branches:
      # pod / workload spec with privileged, hostPID / hostNetwork / hostIPC, hostPath or dangerous capabilities
      - match: >-
          kfinal AND k8s_ok AND kverb IN ('create', 'update', 'patch') AND ksub IS NULL AND NOT k8s_sys
          AND kres IN ('pods', 'deployments', 'daemonsets', 'statefulsets', 'replicasets', 'jobs', 'cronjobs')
          AND k8s_priv AND NOT k8s_hostroot
        severity_sql: >-
          CASE WHEN k8s_bad_image OR k8s_bad_cmd THEN 80 WHEN kns IN {cfg.k8s_priv_namespaces} THEN 40 END
      # escape-ready: host root / container runtime socket / kubelet dir mounted, or privileged + hostPID (nsenter)
      - match: >-
          kfinal AND k8s_ok AND kverb IN ('create', 'update', 'patch') AND ksub IS NULL AND NOT k8s_sys
          AND kres IN ('pods', 'deployments', 'daemonsets', 'statefulsets', 'replicasets', 'jobs', 'cronjobs')
          AND k8s_hostroot
        label: secondary
        severity_sql: "CASE WHEN kns IN {cfg.k8s_priv_namespaces} AND NOT k8s_bad_image AND NOT k8s_bad_cmd THEN 40 END"

  - id: k8s_cluster_admin_binding
    clouds: [k8s, gcp]
    technique: T1098
    sub_technique: T1098.006
    tactic: Privilege Escalation
    severity: 80
    allow: {lists: [k8s_admins], severity: 45}
    automation: true
    branches:
      # (cluster)rolebinding to cluster-admin / admin / edit; 95 when the subject is anonymous / every user
      - match: >-
          kfinal AND k8s_ok AND kverb IN ('create', 'update', 'patch') AND kres IN ('clusterrolebindings', 'rolebindings')
          AND NOT k8s_sys
          AND regexp_matches(coalesce(kreq, ''), '"roleRef"\s*:\s*\{[^}]*"name"\s*:\s*"(cluster-admin|admin|edit)"')
        severity_sql: >-
          CASE WHEN regexp_matches(coalesce(kreq, ''), '"system:(anonymous|unauthenticated|authenticated)"') THEN 95
               WHEN NOT regexp_matches(coalesce(kreq, ''), '"roleRef"\s*:\s*\{[^}]*"name"\s*:\s*"cluster-admin"') THEN 60 END

  - id: k8s_secrets_sweep
    clouds: [k8s, gcp]
    technique: T1552
    sub_technique: T1552.007
    tactic: Credential Access
    severity: 70
    allow: {lists: [k8s_secret_readers, k8s_admins], severity: 35}
    branches:
      # many distinct secrets read (or tried) by one actor; 80 across >= 3 namespaces or touching kube-system
      - template: distinct_burst
        filter: "kfinal AND kres = 'secrets' AND kverb IN ('get', 'list', 'watch') AND ksub IS NULL AND NOT k8s_sys"
        outcome: any
        params: {key: [acct, actor_key], distinct: "coalesce(kns, '*') || '/' || coalesce(kname, '*')",
                 window_ms: "{cfg.k8s_secrets_window_ms}", min_distinct: "{cfg.k8s_secrets_min_distinct}"}
        severity_sql: "CASE WHEN count(DISTINCT kns) >= 3 OR bool_or(kns = 'kube-system') THEN 80 END"
      # cluster-wide secret listing (all namespaces in one call)
      - match: "kfinal AND k8s_ok AND kres = 'secrets' AND kverb IN ('list', 'watch') AND kns IS NULL AND NOT k8s_sys"
        severity: 60

  - id: k8s_sa_token_create
    clouds: [k8s, gcp]
    technique: T1528
    tactic: Credential Access
    severity: 60
    allow: {lists: [k8s_admins], severity: 35}
    automation: true
    branches:
      # TokenRequest for a service account by a person / workload (kubelet token requests are system:node:*)
      - match: "kfinal AND k8s_ok AND kres = 'serviceaccounts' AND ksub = 'token' AND kverb = 'create' AND NOT k8s_sys"
        severity_sql: "CASE WHEN kns = 'kube-system' OR kanon THEN 75 END"
      # legacy long-lived token Secret bound to a service account
      - match: >-
          kfinal AND k8s_ok AND kres = 'secrets' AND kverb = 'create' AND NOT k8s_sys
          AND coalesce(kreq, '') LIKE '%kubernetes.io/service-account-token%'
        severity: 70

  - id: k8s_api_discovery
    clouds: [k8s, gcp]
    technique: T1613
    tactic: Discovery
    severity: 55
    branches:
      # enumeration of RBAC / credential / node resource types (not `kubectl get all`) by one actor
      - template: distinct_burst
        filter: "kfinal AND kverb IN ('list', 'get', 'watch', 'create') AND kres IN {cfg.k8s_discovery_resources} AND NOT k8s_sys"
        outcome: any
        params: {key: [acct, actor_key], distinct: kres, window_ms: "{cfg.k8s_discovery_window_ms}",
                 min_distinct: "{cfg.k8s_discovery_min_resources}"}
        severity_sql: "CASE WHEN count(*) FILTER (WHERE k8s_denied) >= 3 OR bool_or(kanon) THEN 70 END"
      # permission probing: many distinct forbidden requests by one actor
      - template: distinct_burst
        filter: "kfinal AND k8s_denied AND NOT k8s_sys"
        outcome: any
        params: {key: [acct, actor_key], distinct: "k8s_op || ' ' || k8s_obj", window_ms: "{cfg.k8s_forbidden_window_ms}",
                 min_distinct: "{cfg.k8s_forbidden_min}"}
        severity: 60

  - id: k8s_cronjob_persistence
    clouds: [k8s, gcp]
    technique: T1053
    sub_technique: T1053.007
    tactic: Persistence
    severity: 45
    automation: true
    branches:
      # CronJob created / changed by a person; 80 with a download-and-run command or an image outside the trusted
      # registries, 70 when privileged or in kube-system
      - match: "kfinal AND k8s_ok AND kres = 'cronjobs' AND kverb IN ('create', 'update', 'patch') AND ksub IS NULL AND NOT k8s_sys"
        severity_sql: "CASE WHEN k8s_bad_cmd OR k8s_bad_image THEN 80 WHEN k8s_priv OR kns = 'kube-system' THEN 70 END"

  # ------------------------------------------------------------------------------------------- GCP audit (P1-11)
  - id: gcp_vpcsc_violation
    clouds: [gcp]
    technique: T1537
    tactic: Exfiltration
    severity: 55
    branches:
      # VPC Service Controls blocked a request that would move data across the perimeter (egress violation)
      - match: >-
          gcp_vpcsc AND regexp_matches(coalesce(g_md, g_mdjson, ''), 'egressViolations|RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER')
        outcome: any
      # repeated perimeter denials by one actor (probing for a way out)
      - template: distinct_burst
        filter: "gcp_vpcsc"
        outcome: any
        params: {key: [actor_key], distinct: "coalesce(g_res, '') || '|' || coalesce(api, '')",
                 window_ms: "{cfg.gcp_vpcsc_window_ms}", min_distinct: "{cfg.gcp_vpcsc_min}"}
        severity: 70

  - id: gcp_bq_export_external
    clouds: [gcp]
    technique: T1537
    tactic: Exfiltration
    severity: 75
    branches:
      # BigQuery EXPORT (extract) job to a bucket outside gcp_trusted_export_regex (metadata or metadataJson shape)
      - match: >-
          is_gcp AND app = 'bigquery.googleapis.com'
          AND upper(coalesce(json_extract_string(g_md2, '$.jobChange.job.jobConfig.type'), '')) IN ('EXPORT', 'EXTRACT')
          AND NOT regexp_matches(lower(coalesce(json_extract_string(g_md2, '$.jobChange.job.jobConfig.extractConfig.destinationUris[0]'),
                                                json_extract_string(g_md2, '$.jobChange.job.jobConfig.extractConfig.destinationUrisTruncated[0]'),
                                                'gs://corp-unknown')), {cfg.gcp_trusted_export_regex})

  - id: gcp_bq_bulk_read
    clouds: [gcp]
    technique: T1213
    sub_technique: T1213.006
    tactic: Collection
    severity: 60
    allow: {lists: [gcp_analytics_principals], severity: 35}
    automation: true
    branches:
      # one query billing >= gcp_bq_bulk_bytes by a person
      - match: >-
          is_gcp AND app = 'bigquery.googleapis.com' AND NOT coalesce(machine, false)
          AND TRY_CAST(json_extract_string(g_md2, '$.jobChange.job.jobStats.queryStats.totalBilledBytes') AS BIGINT)
              >= {cfg.gcp_bq_bulk_bytes}
      # many distinct tables read (tableDataRead) by one actor
      - template: distinct_burst
        filter: "is_gcp AND app = 'bigquery.googleapis.com' AND g_md2 LIKE '%tableDataRead%' AND NOT coalesce(machine, false)"
        params: {key: [actor_key], distinct: g_res, window_ms: "{cfg.gcp_bq_read_window_ms}",
                 min_distinct: "{cfg.gcp_bq_read_min_tables}"}
        severity: 70

  - id: gcp_serverless_public_invoker
    clouds: [gcp]
    technique: T1098
    sub_technique: T1098.003
    tactic: Persistence
    severity: 65
    branches:
      # Cloud Run service / Cloud Function made invokable by allUsers / allAuthenticatedUsers
      - match: >-
          is_gcp AND app IN ('run.googleapis.com', 'cloudfunctions.googleapis.com') AND api ILIKE '%SetIamPolicy'
          AND regexp_matches(coalesce(g_req, '') || coalesce(g_delta, ''), '"(allUsers|allAuthenticatedUsers)"')

  - id: gcp_serverless_deploy
    clouds: [gcp]
    technique: T1648
    tactic: Execution
    severity: 45
    allow: {lists: [gcp_deployer_principals], severity: 35}
    automation: true
    branches:
      # Cloud Run / Cloud Functions deploy by a person; 75 with the default compute SA (project Editor) or a
      # download-and-run command in the spec
      - match: >-
          is_gcp AND app IN ('run.googleapis.com', 'cloudfunctions.googleapis.com') AND NOT coalesce(machine, false)
          AND regexp_matches(coalesce(api, ''), '\.(CreateService|ReplaceService|UpdateService|CreateFunction|UpdateFunction|CreateJob|RunJob)$')
        severity_sql: >-
          CASE WHEN regexp_matches(coalesce(g_req, ''), '[0-9]+-compute@developer\.gserviceaccount\.com')
                    OR regexp_matches(coalesce(g_req, ''), {cfg.k8s_bad_cmd_regex}) THEN 75 END

  - id: gcp_wif_provider_untrusted
    clouds: [gcp]
    technique: T1484
    sub_technique: T1484.002
    tactic: Privilege Escalation
    severity: 70
    automation: true
    branches:
      # workload identity federation provider trusting an issuer / AWS account outside the trusted lists
      - match: >-
          is_gcp AND regexp_matches(coalesce(api, ''), 'WorkloadIdentityPools\.(Create|Update)WorkloadIdentityPoolProvider$')
          AND ((json_extract_string(g_req, '$.workloadIdentityPoolProvider.oidc.issuerUri') IS NOT NULL
                AND NOT list_contains({cfg.trusted_oidc_issuers:list}, json_extract_string(g_req, '$.workloadIdentityPoolProvider.oidc.issuerUri')))
               OR (json_extract_string(g_req, '$.workloadIdentityPoolProvider.aws.accountId') IS NOT NULL
                   AND NOT list_contains({cfg.trusted_aws_accounts:list}, json_extract_string(g_req, '$.workloadIdentityPoolProvider.aws.accountId'))))
        severity_sql: "CASE WHEN json_extract_string(g_req, '$.workloadIdentityPoolProvider.attributeCondition') IS NULL THEN 80 END"

  # ------------------------------------------------------------------------------------- GCP network (P0-14, P1-5)
  - id: gcp_vpcflow_mining_port
    clouds: [gcp]
    technique: T1496
    sub_technique: T1496.001
    tactic: Impact
    severity: 70
    branches:
      - template: distinct_burst
        filter: >-
          is_gflow AND dst_port IN {cfg.mining_ports} AND al_is_internal_ip(src_ip) AND NOT al_is_internal_ip(dst_ip)
        outcome: any
        params: {key: [host, dst_ip], distinct: source_seq, window_ms: "{cfg.mining_window_ms}",
                 min_distinct: "{cfg.mining_min_flows}"}

  - id: gcp_dns_tunnel
    clouds: [gcp]
    technique: T1071
    sub_technique: T1071.004
    tactic: Command and Control
    severity: 75
    branches:
      - template: distinct_burst
        filter: "is_gdns AND dns_apex IS NOT NULL AND dns_apex NOT IN {cfg.dns_tunnel_allow_apex}"
        outcome: any
        params: {key: [host, dns_apex], distinct: dst_domain, window_ms: "{cfg.dns_tunnel_window_ms}",
                 min_distinct: "{cfg.dns_tunnel_min_names}",
                 having: "avg(length(split_part(dst_domain, '.', 1))) >= {cfg.dns_tunnel_min_label}"}
        severity_sql: "CASE WHEN count(*) FILTER (WHERE upper(gd_qtype) IN ('TXT', 'NULL')) * 2 >= count(*) THEN 85 END"

  - id: gcp_dns_dga_nxdomain
    clouds: [gcp]
    technique: T1568
    sub_technique: T1568.002
    tactic: Command and Control
    severity: 65
    branches:
      - template: distinct_burst
        filter: "is_gdns AND upper(gd_rcode) = 'NXDOMAIN' AND dns_apex IS NOT NULL AND dns_apex NOT IN {cfg.dns_tunnel_allow_apex}"
        outcome: any
        params: {key: [host], distinct: dst_domain, window_ms: "{cfg.dga_window_ms}", min_distinct: "{cfg.dga_min_nx}",
                 having: "count(DISTINCT dns_apex) >= {cfg.dga_min_apex}"}
  # GCP firewall rows (gcp_firewall_json) feed the generic network rules (config/rules.yaml port_scan: denied / allowed
  # connections per source IP) and the cloud_ev columns gf_disp / gf_dir; no extra native rule (internet background
  # scanning would make an "allowed after denied" rule noisy).
