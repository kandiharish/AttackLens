      - template: new_source_burst
        filter: "is_gr AND gr_method = 'GET' AND gr_list AND gr_res IN {cfg.graph_enum_types} AND actor_key IS NOT NULL"
        outcome: any
        params: {store: acct, source: actor_key, distinct: gr_res, window_ms: "{cfg.graph_enum_window_ms}",
                 min_distinct: "{cfg.graph_enum_min_types}", novel_days: "{cfg.graph_enum_baseline_days}"}
        severity_sql: "CASE WHEN bool_or(regexp_matches(coalesce(ua, ''), {cfg.attack_ua_regex})) THEN 80 END"
      # a known enumerator far above its own history (a daily inventory app is judged against itself)
      - template: distinct_burst
        filter: "is_gr AND gr_method = 'GET' AND gr_list AND gr_res IN {cfg.graph_enum_types} AND actor_key IS NOT NULL"
        outcome: any
        params: {key: [actor_key], distinct: gr_path, window_ms: "{cfg.graph_enum_window_ms}", min_distinct: "{cfg.graph_enum_min_calls}",
                 having: "count(DISTINCT gr_res) >= {cfg.graph_enum_min_types}", baseline_mult: "{cfg.graph_enum_baseline_mult}",
                 baseline_days: "{cfg.graph_enum_baseline_days}", require_history: true}
        severity_sql: "CASE WHEN bool_or(regexp_matches(coalesce(ua, ''), {cfg.attack_ua_regex})) THEN 80 END"

