                 window_ms: "{cfg.burst_window_ms}", min_distinct: "{cfg.ransom_min_objects}"}
        severity: 90
      - match: >-
          is_ct AND api = 'PutBucketEncryption'
          AND len(list_filter(regexp_extract_all(coalesce(ct_rp, ''), 'arn:aws:kms:[^:]+:([0-9]{12}):', 1),
                              lambda a: a <> coalesce(acct, '') AND NOT list_contains({cfg.trusted_aws_accounts:list}, a))) > 0
        severity: 85
      - template: sequence
        severity: 85
        params:
          a_filter: "is_ct AND ok_row AND api IN ('DeleteObject', 'DeleteObjects')"
          b_filter: "is_ct AND ok_row AND api = 'PutObject' AND regexp_matches(lower(coalesce(json_extract_string(ct_rp, '$.key'), '')), {cfg.ransom_note_regex})"
          join: [[actor_key, actor_key]]
          window_ms: "{cfg.hour_ms}"
      - template: distinct_burst
        filter: "is_gcp AND api = 'storage.objects.create' AND coalesce(g_authz, '') ILIKE '%storage.objects.delete%'"
        params: {key: [actor_key], distinct: g_res, window_ms: "{cfg.burst_window_ms}", min_distinct: "{cfg.ransom_min_objects}"}
        severity: 90
      - match: >-
          is_aza AND (api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/ENCRYPTIONSCOPES/WRITE'
                      OR (api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/WRITE' AND regexp_matches(lower(coalesce(az_req, '')), '"keysource"\s*:\s*"microsoft\.keyvault"')))
        severity: 55
      - template: sequence
        severity: 90
        params:
          a_filter: >-
            is_aza AND ok_row AND (api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/ENCRYPTIONSCOPES/WRITE'
                                   OR (api_u = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/WRITE' AND regexp_matches(lower(coalesce(az_req, '')), '"keysource"\s*:\s*"microsoft\.keyvault"')))
          b_rules: [cl_kms_key_destroy]
          join: [[actor, actor]]
          window_ms: "{cfg.cmk_destroy_window_ms}"
      # rules track: AWS KMS ransomware with external key material: material imported into a key, then deleted (or the
      # key disabled / scheduled for deletion). Data encrypted under that key is then unrecoverable by the owner while
      # the actor keeps the material (same reading as the Sigma label_override of aws_kms_import_key_material -> T1486)
      - template: sequence
        severity: 90
        params:
          a_filter: "is_ct AND ok_row AND app = 'kms.amazonaws.com' AND api = 'ImportKeyMaterial'"
          b_filter: >-
            is_ct AND ok_row AND app = 'kms.amazonaws.com'
            AND api IN ('DeleteImportedKeyMaterial', 'ScheduleKeyDeletion', 'DisableKey')
          join:
            - - &kms_key_id "nullif(regexp_extract(lower(coalesce(json_extract_string(ct_rp, '$.keyId'), '')), '([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32})', 1), '')"
              - *kms_key_id
          window_ms: "{cfg.cmk_destroy_window_ms}"

