  - id: cl_storage_ransom_encrypt
    clouds: [aws, azure, gcp]
    technique: T1486
    tactic: Impact
    severity: 80
    allow: {lists: [ssec_allow_principals], severity: 35}
    branches:
      - match: &ssec >-
          is_ct AND api IN ('PutObject', 'CopyObject', 'UploadPart', 'CreateMultipartUpload')
          AND (coalesce(ct_rp, '') ILIKE '%x-amz-server-side-encryption-customer-algorithm%'
               OR (coalesce(ct_rp, '') ILIKE '%aws:kms%'
                   AND nullif(regexp_extract(coalesce(json_extract_string(ct_rp, '$."x-amz-server-side-encryption-aws-kms-key-id"'), ''), 'arn:aws:kms:[^:]+:([0-9]{12}):', 1), '') IS NOT NULL
                   AND regexp_extract(json_extract_string(ct_rp, '$."x-amz-server-side-encryption-aws-kms-key-id"'), 'arn:aws:kms:[^:]+:([0-9]{12}):', 1) <> coalesce(acct, '')))
        severity: 60
      - template: distinct_burst
        filter: *ssec
