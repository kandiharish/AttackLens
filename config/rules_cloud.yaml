          OR (is_aza AND api_u IN ('MICROSOFT.KEYVAULT/VAULTS/DELETE', 'MICROSOFT.KEYVAULT/VAULTS/KEYS/DELETE',
                                   'MICROSOFT.KEYVAULT/LOCATIONS/DELETEDVAULTS/PURGE/ACTION'))
          OR (is_gcp AND (api ILIKE '%KeyManagementService.DestroyCryptoKeyVersion'
