  # ====================================================================================== track Azure (native)
  # reports/cloud/log_coverage.md P0-3 / P0-9 / P0-13 / P1-12: Key Vault data plane (azure_keyvault_json), Microsoft Graph
  # activity (azure_graph_json), Entra ID Protection (azure_risk_json), service-principal sign-ins. Columns and flags
  # (kv_*, gr_*, rk_*, si_tokid, is_kv / is_gr / is_idp / is_sp_signin, ip_net) and thresholds: config/cloud.yaml.
  - id: az_kv_secret_sweep
    clouds: [azure]
    technique: T1555
    sub_technique: T1555.006
    tactic: Credential Access
    severity: 70
    allow: {lists: [kv_readers], severity: 35}
    branches:
      # many distinct secrets / keys / certificates read by one identity in minutes (apps read the same few all day)
      - template: distinct_burst
        filter: "is_kv AND api IN ('SecretGet', 'KeyGet', 'CertificateGet') AND kv_obj IS NOT NULL"
        params: {key: [actor_key], distinct: "kv_vault || '/' || kv_kind || '/' || kv_obj", window_ms: "{cfg.kv_secret_window_ms}",
                 min_distinct: "{cfg.kv_secret_min_distinct}"}
        severity_sql: >-
          CASE WHEN count(DISTINCT kv_vault) > 1 OR bool_or(regexp_matches(coalesce(ua, ''), {cfg.attack_ua_regex})) THEN 80 END
      # listing secrets of several vaults in minutes (vault-by-vault reconnaissance before the reads)
      - template: distinct_burst
        filter: "is_kv AND api IN ('SecretList', 'KeyList', 'CertificateList') AND kv_vault IS NOT NULL"
        params: {key: [actor_key], distinct: kv_vault, window_ms: "{cfg.kv_secret_window_ms}", min_distinct: "{cfg.kv_vault_sweep_min}"}
        severity: 55

  - id: az_kv_forbidden_then_get
    clouds: [azure]
    technique: T1555
    sub_technique: T1555.006
    tactic: Credential Access
    severity: 55
    branches:
      # 403 / 401 on several objects or vaults: an identity probing what it can read
      - template: distinct_burst
        filter: "is_kv AND lower(coalesce(kv_status, '')) IN ('403', '401', '403.0', '401.0', 'forbidden', 'unauthorized')"
        outcome: failure
        params: {key: [actor_key], distinct: "coalesce(kv_vault || '/' || kv_obj, kv_vault)", window_ms: "{cfg.kv_denied_window_ms}",
                 min_distinct: "{cfg.kv_denied_min}"}
      # ... then the same identity reads successfully (it found a vault it can read, or was granted access)
      - template: sequence
        severity: 75
        params:
          a_rules: [az_kv_forbidden_then_get]
          b_filter: "is_kv AND ok_row AND api IN ('SecretGet', 'KeyGet', 'CertificateGet', 'SecretList', 'SecretBackup', 'KeyBackup')"
          join: [[actor_key, actor_key]]
          window_ms: "{cfg.kv_denied_get_window_ms}"

  - id: az_kv_purge
    clouds: [azure]
    technique: T1485
    tactic: Impact
    severity: 60
    allow: {lists: [kv_admins], severity: 45}
    branches:
      - match: "is_kv AND api IN ('SecretPurge', 'CertificatePurge')"
      # delete + purge of several secrets / certificates: recovery is impossible (soft delete defeated)
      - template: distinct_burst
        filter: "is_kv AND api IN ('SecretPurge', 'CertificatePurge', 'SecretDelete', 'CertificateDelete') AND kv_obj IS NOT NULL"
        params: {key: [actor_key], distinct: "kv_vault || '/' || kv_obj", window_ms: "{cfg.kv_purge_window_ms}",
                 min_distinct: "{cfg.kv_purge_min}", having: "count(*) FILTER (WHERE api LIKE '%Purge') >= 1"}
        severity: 80
      - match: "is_aza AND api_u = 'MICROSOFT.KEYVAULT/LOCATIONS/DELETEDVAULTS/PURGE/ACTION'"
        severity: 75

  - id: az_kv_key_destroy
    clouds: [azure]
    technique: T1486
    tactic: Impact
    severity: 65
    allow: {lists: [kv_admins], severity: 45}
    branches:
      # deleting / purging a key: every resource encrypted with it as a customer-managed key becomes unreadable
      - match: "is_kv AND api IN ('KeyDelete', 'KeyPurge')"
        severity_sql: "CASE WHEN api = 'KeyPurge' THEN 80 END"

  - id: az_kv_backup_export
    clouds: [azure]
    technique: T1555
    sub_technique: T1555.006
    tactic: Credential Access
    severity: 70
    allow: {lists: [kv_readers], severity: 35}
    branches:
      # backup blobs of several secrets / keys / certificates: restorable into an attacker's vault in the same geography
      - template: distinct_burst
        filter: "is_kv AND api IN ('SecretBackup', 'KeyBackup', 'CertificateBackup') AND kv_obj IS NOT NULL"
