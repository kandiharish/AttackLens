          OR (is_gcp AND regexp_matches(api, '(?i)serviceAccounts\.(disable|delete)$|DisableServiceAccount|DeleteServiceAccount'))
          OR (is_gcp AND api ILIKE '%SetIamPolicy' AND regexp_matches(coalesce(g_delta, ''), '"action"\s*:\s*"REMOVE"[^}]*"roles/owner"|"roles/owner"[^}]*"action"\s*:\s*"REMOVE"'))
