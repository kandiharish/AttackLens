    clouds: [okta]
    technique: T1550
    sub_technique: T1550.004
    tactic: Lateral Movement
    severity: 35             # roaming laptop (same browser, two networks) is context only (benign: ~4 % of users a day)
    branches:
      - template: multi_network_session
        filter: "is_okta AND ok_sess IS NOT NULL AND NOT al_is_internal_ip(src_ip)"
        outcome: any
        params: {session: ok_sess, network: net, window_ms: "{cfg.idp_session_window_ms}", min_networks: 2}
        # the cookie replayed from another browser / OS, a hosting ASN, or another country: token theft
        severity_sql: "CASE WHEN count(DISTINCT ok_ua) > 1 OR bool_or(hosting) OR count(DISTINCT cc) > 1 THEN 85 END"

