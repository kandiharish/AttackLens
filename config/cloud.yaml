  k8s_ua:     {src: [k8s_audit_json], paths: ['$.userAgent', '$.UserAgent']}
  k8s_decision: {src: [k8s_audit_json], paths: ['$.annotations."authorization.k8s.io/decision"', '$.Annotations."authorization.k8s.io/decision"']}
  k8s_id:     {src: [k8s_audit_json], paths: ['$.auditID', '$.AuditId']}
  # GKE: LogEntry labels survive ingest as log_labels (allow-listed keys) once the P0-4 ingest patch is applied
  g_k8s_decision: {src: [gcp_audit_json], paths: ['$.log_labels."authorization.k8s.io/decision"']}
  g_mdjson:   {src: [gcp_audit_json], paths: ['$.protoPayload.metadataJson']}   # BigQuery AuditData export: a JSON STRING
  g_subject:  {src: [gcp_audit_json], paths: ['$.protoPayload.authenticationInfo.principalSubject']}
  gf_disp:    {src: [gcp_firewall_json], paths: ['$.jsonPayload.disposition', '$.json_payload.disposition']}
  gf_dir:     {src: [gcp_firewall_json], paths: ['$.jsonPayload.rule_details.direction', '$.json_payload.rule_details.direction']}
  gd_qtype:   {src: [gcp_dns_json], paths: ['$.jsonPayload.queryType', '$.jsonPayload.query_type', '$.json_payload.queryType']}
  gd_rcode:   {src: [gcp_dns_json], paths: ['$.jsonPayload.responseCode', '$.jsonPayload.response_code', '$.json_payload.responseCode']}
  gfl_id:     {src: [gcp_vpcflow_json, gcp_firewall_json, gcp_dns_json], paths: ['$.insertId', '$.insert_id']}
  # ---- track Identity SaaS: Okta System Log, Workspace Reports (+ Cloud Logging copy), M365 UAL, Auth0, Duo ----------
  idp_rid:    {src: [okta_json, m365_ual_json, auth0_json, duo_auth_json], paths: ['$.uuid', '$.detail.uuid', '$.Id', '$.OfficeId', '$.RawEventData.Id', '$.log_id', '$.data.log_id', '$.txid']}
  ok_sess:    {src: [okta_json], paths: ['$.authenticationContext.externalSessionId', '$.detail.authenticationContext.externalSessionId']}
  ok_result:  {src: [okta_json], paths: ['$.outcome.result', '$.detail.outcome.result']}
  ok_reason:  {src: [okta_json], paths: ['$.outcome.reason', '$.detail.outcome.reason']}
  ok_cred:    {src: [okta_json], paths: ['$.authenticationContext.credentialType', '$.detail.authenticationContext.credentialType']}
  ok_target:  {src: [okta_json], paths: ['$.target', '$.detail.target']}
  ok_debug:   {src: [okta_json], paths: ['$.debugContext.debugData', '$.detail.debugContext.debugData']}
  ok_ua:      {src: [okta_json], paths: ['$.client.userAgent.rawUserAgent', '$.detail.client.userAgent.rawUserAgent']}
  ok_proxy:   {src: [okta_json], paths: ['$.securityContext.isProxy', '$.detail.securityContext.isProxy']}
  ok_atype:   {src: [okta_json], paths: ['$.actor.type', '$.detail.actor.type']}
  gw_ev_r:    {src: [gws_reports_json], paths: ['$.events[0].name']}
  gw_par_r:   {src: [gws_reports_json], paths: ['$.events[0].parameters']}
  gw_evs:     {src: [gws_reports_json], paths: ['$.events']}
  gw_ev_c:    {src: [gcp_audit_json], paths: ['$.protoPayload.metadata.event[0].eventName']}
  gw_par_c:   {src: [gcp_audit_json], paths: ['$.protoPayload.metadata.event[0].parameter']}
  m3_upn:     {src: [m365_ual_json], paths: ['$.UserId', '$.RawEventData.UserId']}
  m3_org:     {src: [m365_ual_json], paths: ['$.OrganizationId', '$.RawEventData.OrganizationId']}
  m3_params:  {src: [m365_ual_json], paths: ['$.Parameters', '$.RawEventData.Parameters', '$.OperationProperties', '$.RawEventData.OperationProperties']}
  m3_target:  {src: [m365_ual_json], paths: ['$.TargetUserOrGroupName', '$.RawEventData.TargetUserOrGroupName']}
  m3_ttype:   {src: [m365_ual_json], paths: ['$.TargetUserOrGroupType', '$.RawEventData.TargetUserOrGroupType']}
  m3_site:    {src: [m365_ual_json], paths: ['$.SiteUrl', '$.Site_Url', '$.RawEventData.SiteUrl']}
  m3_modprops: {src: [m365_ual_json], paths: ['$.ModifiedProperties', '$.RawEventData.ModifiedProperties']}
  m3_objs:    {src: [m365_ual_json], paths: ['$.Target', '$.RawEventData.Target']}
  m3_ua:      {src: [m365_ual_json], paths: ['$.UserAgent', '$.RawEventData.UserAgent', '$.ClientInfoString', '$.RawEventData.ClientInfoString']}
  a0_desc:    {src: [auth0_json], paths: ['$.description', '$.data.description']}
  a0_client:  {src: [auth0_json], paths: ['$.client_id', '$.data.client_id']}
  duo_result: {src: [duo_auth_json], paths: ['$.result']}
  duo_factor: {src: [duo_auth_json], paths: ['$.factor']}
  duo_auth_ip: {src: [duo_auth_json], paths: ['$.auth_device.ip']}

# derived: layers of name -> SQL over the columns above (and earlier layers). Canonical event columns available:
# ts_ms, source_seq, source_type, action, outcome, host, src_user, target_user, src_ip, signature, app, group_name,
# bytes_out, file_path. Geo columns (asn, cc, net, hosting, lat, lon, corp_ip, provider) are added after layer 2.
derived:
  - is_ct: "source_type = 'cloudtrail_json'"
    is_azs: "source_type = 'azure_signin_json'"
    is_aza: "source_type = 'azure_activity_json' AND (az_opval IS NOT NULL OR upper(signature) LIKE 'MICROSOFT.%')"
    is_azd: "source_type = 'azure_activity_json' AND az_opval IS NULL AND upper(coalesce(signature, '')) NOT LIKE 'MICROSOFT.%' AND (az_logged_by IS NOT NULL OR tr_json IS NOT NULL OR au_name IS NOT NULL)"
    is_azb: "source_type = 'azure_storageblob_json'"
    is_gcp: "source_type = 'gcp_audit_json'"
    is_vpcflow: "source_type IN ('aws_vpcflow_json', 'aws_vpcflow_txt')"
    is_r53: "source_type = 'aws_r53resolver_json'"
    is_nfw: "source_type = 'aws_nfw_json'"
    # track Azure: Key Vault data plane, Microsoft Graph activity, Entra ID Protection risk, service-principal sign-ins
    is_kv: "source_type = 'azure_keyvault_json'"
    is_gr: "source_type = 'azure_graph_json'"
    is_idp: "source_type = 'azure_risk_json'"
    is_sp_signin: "source_type = 'azure_signin_json' AND (si_spid IS NOT NULL OR coalesce(si_cat, '') ILIKE '%ServicePrincipal%')"
    kv_kind: "lower(nullif(regexp_extract(coalesce(file_path, ''), '^https?://[^/]+/(secrets|keys|certificates|deletedsecrets|deletedkeys|deletedcertificates)(?:[/?]|$)', 1), ''))"
    kv_obj: "lower(nullif(regexp_extract(coalesce(file_path, ''), '^https?://([^./]+)[^/]*/[a-z]+/([^/?]+)', 2), ''))"
    kv_vault: "lower(coalesce(nullif(regexp_extract(coalesce(host, ''), '/vaults/([^/]+)', 1), ''), nullif(regexp_extract(coalesce(file_path, ''), '^https?://([^./]+)\\.vault\\.', 1), '')))"
    gr_res: "lower(nullif(regexp_extract(coalesce(file_path, ''), '^https?://[^/]+/(?:v1\\.0|beta)/([A-Za-z0-9_.]+)', 1), ''))"
    gr_path: "lower(nullif(regexp_extract(coalesce(file_path, ''), '^https?://[^/]+/(?:v1\\.0|beta)(/[^?]*)', 1), ''))"
    gr_mailbox: "lower(nullif(regexp_extract(coalesce(file_path, ''), '/users/([^/?]+)/(?:messages|mailfolders|mailboxsettings|inferenceclassification)', 1), ''))"
    # a directory COLLECTION listing (/users, /groups?$top=999, /roleManagement/directory/roleAssignments), not an
    # object read (/users/{id}/photo): enumeration rules count only these
    gr_list: "regexp_matches(lower(coalesce(file_path, '')), '^https?://[^/]+/(?:v1\\.0|beta)/(?:[a-z0-9_.]+|rolemanagement/directory/[a-z0-9_.]+)/?(?:\\?.*)?$')"
    rk: "lower(rk_type)"
    # caller network for token / principal comparisons that must not depend on geo files: IPv4 /16, IPv6 /48
    ip_net: "CASE WHEN src_ip IS NULL THEN NULL WHEN contains(src_ip, ':') THEN array_to_string(string_split(lower(src_ip), ':')[1:3], ':') ELSE nullif(regexp_extract(src_ip, '^(\\d+\\.\\d+)\\.', 1), '') END"
    # registered domain, naive (two labels; three for <x>.co.uk-style second levels); NULL without a domain
    dns_apex: "CASE WHEN dst_domain IS NOT NULL THEN coalesce(nullif(regexp_extract(dst_domain, '([a-z0-9_-]+\\.(?:co|com|net|org|gov|ac|edu)\\.[a-z]{2}|[a-z0-9_-]+\\.[a-z0-9-]+)$', 1), ''), dst_domain) END"
    api: "signature"
    api_u: "upper(signature)"
    actor: "coalesce(CASE WHEN action IN ('login_success', 'login_failed') THEN target_user END, src_user, target_user)"
    ct_role: "coalesce(nullif(regexp_extract(ct_arn, ':assumed-role/([^/]+)/', 1), ''), ct_iss_name)"
    ua: "lower(coalesce(ct_ua, si_ua, g_ua, sb_ua, gr_ua, kv_ua))"
    az_req: "coalesce(json_extract_string(az_props, '$.requestbody'), json_extract_string(az_props, '$.requestBody'))"
    az_resp: "coalesce(json_extract_string(az_props, '$.responseBody'), json_extract_string(az_props, '$.responsebody'))"
    az_status_code: "coalesce(json_extract_string(az_props, '$.statusCode'), az_substatus)"
    region: "lower(coalesce(ct_region, nullif(regexp_extract(g_zone, '^([a-z]+-[a-z]+[0-9]+)', 1), '')))"
    ok_row: "outcome = 'success' OR (source_type = 'azure_activity_json' AND outcome IS NULL AND lower(coalesce(az_status, '')) IN ('accept', 'accepted'))"
    dedup_id: "coalesce(ct_id, g_id, CASE WHEN source_type = 'azure_activity_json' AND az_corr IS NOT NULL THEN az_corr || '|' || coalesce(signature, '') || '|' || coalesce(az_status, '') || '|' || coalesce(au_id, '') END, au_id, CASE WHEN idp_rid IS NOT NULL THEN source_type || '|' || idp_rid END)"
  - ct_svc: "is_ct AND (ct_type = 'AWSService' OR ct_invoked IS NOT NULL OR coalesce(ct_ip, '') LIKE '%.amazonaws.com' OR ct_ip = 'AWS Internal')"
    ct_instance_role: "is_ct AND regexp_matches(coalesce(ct_arn, ''), ':assumed-role/[^/]+/i-[0-9a-f]{8,17}$')"
    acct: "lower(CASE WHEN is_aza THEN coalesce(nullif(regexp_extract(host, '^/subscriptions/([^/]+)', 1), ''), az_sub, az_tenant, host) WHEN is_azb THEN coalesce(nullif(regexp_extract(host, '^/subscriptions/([^/]+)', 1), ''), az_tenant, host) WHEN is_kv THEN coalesce(nullif(regexp_extract(host, '^/subscriptions/([^/]+)', 1), ''), az_tenant, host) WHEN is_azs OR is_azd OR is_gr OR is_idp THEN coalesce(az_tenant, host) WHEN is_vpcflow OR is_r53 THEN coalesce(fl_acct, host) WHEN source_type = 'm365_purview_csv' THEN coalesce(host, try(json_extract_string(nullif(regexp_extract(raw_line, '(\\{.*\\})', 1), ''), '$.OrganizationId'))) ELSE host END)"
    actor_key: "lower(CASE WHEN is_ct AND ct_type = 'AssumedRole' THEN coalesce(ct_role, actor) ELSE actor END)"
    machine: "coalesce(is_ct AND (ct_type = 'AWSService' OR ct_invoked IS NOT NULL OR coalesce(ct_ip, '') LIKE '%.amazonaws.com' OR ct_ip = 'AWS Internal'), false) OR (is_aza AND regexp_full_match(lower(coalesce(az_caller, '')), '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')) OR (is_gcp AND regexp_matches(lower(coalesce(g_principal, '')), '@(gcp-sa-[a-z0-9-]+\\.iam\\.gserviceaccount\\.com|cloudservices\\.gserviceaccount\\.com|system\\.gserviceaccount\\.com|container-engine-robot\\.iam\\.gserviceaccount\\.com)$')) OR lower(coalesce(actor, '')) IN {cfg.machine_principals}"
    is_write: "CASE WHEN is_ct THEN coalesce(ct_ro = 'false', regexp_matches(coalesce(api, ''), '^(Create|Delete|Put|Update|Modify|Attach|Detach|Add|Remove|Set|Start|Stop|Terminate|Run|Authorize|Revoke|Enable|Disable|Associate|Disassociate|Import|Schedule|Send|Restore|Register|Deregister|Replace|Reset|Change)')) WHEN is_aza THEN regexp_matches(api_u, '/(WRITE|DELETE|ACTION)$') WHEN is_azd THEN true WHEN is_gcp THEN coalesce(g_log, '') LIKE '%activity' WHEN is_azb THEN api IN ('PutBlob', 'PutBlock', 'PutBlockList', 'DeleteBlob', 'CopyBlob', 'SetBlobProperties', 'SetBlobMetadata') ELSE false END"
    denied: "(is_ct AND ct_err IN ('AccessDenied', 'AccessDeniedException', 'UnauthorizedOperation', 'Client.UnauthorizedOperation', 'UnauthorizedAccess', 'AuthorizationError', 'Forbidden', 'InvalidClientTokenId')) OR (is_gcp AND g_code IN ('7', '16')) OR (is_aza AND outcome = 'failure' AND (az_status_code ILIKE '%forbidden%' OR az_status_code ILIKE '%authorizationfailed%')) OR (is_azb AND outcome = 'failure' AND (coalesce(sb_status, '') ILIKE '%authoriz%' OR coalesce(sb_status, '') ILIKE '%authentication%'))"
    ua_family: "coalesce(nullif(regexp_extract(lower(coalesce(ct_ua, si_ua, g_ua, sb_ua, '')), '^(aws-cli|boto3|botocore|aws-sdk-[a-z]+|terraform|pulumi|console|mozilla|python-requests|curl|go-http-client|powershell|azurecli|azure-sdk|azsdk-[a-z]+|google-cloud-sdk|gcloud|grpc-[a-z]+)', 1), ''), CASE WHEN coalesce(ct_ua, si_ua, g_ua, sb_ua) IS NOT NULL THEN 'other' END)"
    session: "coalesce(ct_akid, si_sess, g_keyname)"
  - automation: >-
      len(list_filter([lower(actor), actor_key, lower(ct_iss_name), lower(ct_uname), lower(g_principal), lower(az_caller),
                       lower(au_by_app)], lambda x: x IS NOT NULL AND regexp_matches(x, {cfg.automation_identity_regex}))) > 0
  # ---- track Identity SaaS: Okta / Workspace (both shapes) / M365 UAL (JSON + Purview CSV AuditData) / Auth0 / Duo -----
  # Workspace parameters[] and M365 Parameters[] become lists of {k, v}; a named value = list_filter(..)[1].v (no MAP:
  # a repeated name must never fail the whole cloud_ev build). try(): a malformed JSON value is NULL, never an error.
  - is_okta: "source_type = 'okta_json'"
    is_gws: "source_type = 'gws_reports_json' OR (source_type = 'gcp_audit_json' AND (gw_ev_c IS NOT NULL OR app IN {cfg.gws_cl_services}))"
    is_m365: "source_type IN ('m365_ual_json', 'm365_purview_csv')"
    is_auth0: "source_type = 'auth0_json'"
    is_duo: "source_type = 'duo_auth_json'"
    gw_ev: "coalesce(gw_ev_r, gw_ev_c)"
    gw_pl: >-
      list_transform(try(CAST(json_extract(coalesce(gw_par_r, gw_par_c), '$[*]') AS VARCHAR[])),
                     lambda x: {'k': json_extract_string(x, '$.name'),
                                'v': coalesce(json_extract_string(x, '$.value'), json_extract_string(x, '$.boolValue'),
                                              json_extract_string(x, '$.intValue'), json_extract_string(x, '$.multiValue'),
                                              json_extract_string(x, '$.multiStrValue'))})
    m3_csv: "CASE WHEN source_type = 'm365_purview_csv' THEN nullif(regexp_extract(raw_line, '(\\{.*\\})', 1), '') END"
    ok_tuser: >-
      lower(json_extract_string(list_filter(try(CAST(json_extract(ok_target, '$[*]') AS VARCHAR[])),
                                            lambda x: json_extract_string(x, '$.type') = 'User')[1], '$.alternateId'))
    ok_priv: "lower(coalesce(json_extract_string(ok_debug, '$.privilegeGranted'), json_extract_string(ok_debug, '$.role')))"
  - gw_user: "lower(list_filter(gw_pl, lambda x: x.k IN ('USER_EMAIL', 'user_email'))[1].v)"
    gw_role: "lower(list_filter(gw_pl, lambda x: x.k = 'ROLE_NAME')[1].v)"
    gw_scope: "lower(array_to_string(list_transform(list_filter(gw_pl, lambda x: x.k IN ('scope', 'scope_data')), lambda x: x.v), ' '))"
    gw_client: "list_filter(gw_pl, lambda x: x.k = 'client_id')[1].v"
    gw_susp: "lower(list_filter(gw_pl, lambda x: x.k = 'is_suspicious')[1].v)"
    gw_new: "lower(list_filter(gw_pl, lambda x: x.k = 'NEW_VALUE')[1].v)"
    m3_par: "coalesce(m3_params, try(json_extract_string(m3_csv, '$.Parameters')), try(json_extract_string(m3_csv, '$.OperationProperties')))"
    m3_mp: "coalesce(m3_modprops, try(json_extract_string(m3_csv, '$.ModifiedProperties')))"
    m3_tgt: "lower(coalesce(m3_target, try(json_extract_string(m3_csv, '$.TargetUserOrGroupName'))))"
    m3_tt: "lower(coalesce(m3_ttype, try(json_extract_string(m3_csv, '$.TargetUserOrGroupType'))))"
    m3_own_dom: "lower(nullif(regexp_extract(coalesce(m3_upn, try(json_extract_string(m3_csv, '$.UserId')), ''), '@([^@]+)$', 1), ''))"
  - m3_pl: >-
      list_transform(try(CAST(json_extract(m3_par, '$[*]') AS VARCHAR[])),
                     lambda x: {'k': json_extract_string(x, '$.Name'), 'v': json_extract_string(x, '$.Value')})
  - m3_fwd: >-
      lower(list_filter(m3_pl, lambda x: x.k IN ('ForwardTo', 'RedirectTo', 'ForwardAsAttachmentTo', 'ForwardingSmtpAddress',
                                                 'ForwardingAddress', 'BlindCopyTo', 'RedirectMessageTo')
                                         AND lower(trim(coalesce(x.v, ''))) NOT IN ('', '$null', 'null', 'false'))[1].v)
    m3_hide: >-
      len(list_filter(m3_pl, lambda x: (x.k = 'MoveToFolder' AND regexp_matches(lower(coalesce(x.v, '')), {cfg.m365_hiding_folder_regex}))
                                       OR (x.k IN ('DeleteMessage', 'SoftDeleteMessage') AND lower(coalesce(x.v, '')) IN ('true', '$true')))) > 0
    m3_lure: >-
      len(list_filter(m3_pl, lambda x: x.k IN ('SubjectContainsWords', 'BodyContainsWords', 'SubjectOrBodyContainsWords', 'FromAddressContainsWords')
                                       AND regexp_matches(lower(coalesce(x.v, '')), {cfg.m365_lure_keyword_regex}))) > 0
    m3_rights: "lower(list_filter(m3_pl, lambda x: x.k = 'AccessRights')[1].v)"
    m3_audit_off: >-
      len(list_filter(m3_pl, lambda x: x.k IN ('UnifiedAuditLogIngestionEnabled', 'AuditEnabled', 'AdminAuditLogEnabled')
                                       AND lower(coalesce(x.v, '')) IN ('false', '$false', '0'))) > 0
  - m3_fwd_ext: >-
      m3_fwd IS NOT NULL AND m3_fwd LIKE '%@%' AND NOT coalesce(regexp_extract(m3_fwd, '@([a-z0-9.-]+)', 1) IN {cfg.idp_internal_domains}, false)
      AND regexp_extract(m3_fwd, '@([a-z0-9.-]+)', 1) IS DISTINCT FROM m3_own_dom
  # ---- track K8s + GCP: one Kubernetes view over generic / EKS / AKS audit (is_k8s) and GKE audit (is_gke), GCP net ----
  # GKE methodName io.k8s.<group>.<version>.<resource>[.<subresource>].<verb>; resourceName [<group>/]<v>/namespaces/<ns>/
  # <resource>/<name>[/<sub>]. kcode: HTTP status (GKE google.rpc code mapped). kfinal: the request's final record.
  - is_k8s: "source_type = 'k8s_audit_json'"
    is_gke: "source_type = 'gcp_audit_json' AND app = 'k8s.io'"
    is_gflow: "source_type = 'gcp_vpcflow_json'"
    is_gfw: "source_type = 'gcp_firewall_json'"
    is_gdns: "source_type = 'gcp_dns_json'"
    gke_m: >-
      CASE WHEN source_type = 'gcp_audit_json' AND app = 'k8s.io'
           THEN regexp_extract(signature, '\.v[0-9]+(?:(?:alpha|beta)[0-9]+)?\.([a-z]+)(?:\.([a-z]+))?\.([a-z]+)$',
                               ['res', 'sub', 'verb']) END
    g_md2: "CASE WHEN source_type = 'gcp_audit_json' THEN coalesce(g_md, CASE WHEN json_valid(g_mdjson) THEN g_mdjson END) END"
  - kverb: "lower(CASE WHEN is_k8s THEN k8s_verb WHEN is_gke THEN nullif(gke_m.verb, '') END)"
    kres: "lower(CASE WHEN is_k8s THEN k8s_res WHEN is_gke THEN nullif(gke_m.res, '') END)"
    ksub: "lower(CASE WHEN is_k8s THEN k8s_sub WHEN is_gke THEN nullif(gke_m.sub, '') END)"
    kns: "lower(CASE WHEN is_k8s THEN k8s_ns WHEN is_gke THEN nullif(regexp_extract(g_res, '/namespaces/([^/]+)/', 1), '') END)"
    kname: >-
      CASE WHEN is_k8s THEN k8s_name
           WHEN is_gke THEN string_split(g_res, '/')[list_position(string_split(g_res, '/'), gke_m.res) + 1] END
    kreq: "CASE WHEN is_k8s THEN k8s_req WHEN is_gke THEN g_req END"
    kcode: >-
      CASE WHEN is_k8s THEN TRY_CAST(k8s_code AS INTEGER)
           WHEN is_gke THEN CASE coalesce(g_code, '0') WHEN '0' THEN 200 WHEN '7' THEN 403 WHEN '16' THEN 401
                                 WHEN '5' THEN 404 WHEN '6' THEN 409 WHEN '3' THEN 400 ELSE 500 END END
    kuser: "lower(CASE WHEN is_k8s THEN k8s_uname WHEN is_gke THEN coalesce(g_principal, g_subject) END)"
    kfinal: "(is_k8s AND coalesce(k8s_stage, 'ResponseComplete') IN ('ResponseComplete', 'Panic')) OR is_gke"
    kdecision: "lower(coalesce(k8s_decision, g_k8s_decision))"
    kanon: >-
      (is_k8s OR is_gke) AND (lower(coalesce(k8s_uname, g_principal, '')) = 'system:anonymous'
                              OR coalesce(k8s_groups, '') LIKE '%system:unauthenticated%')
    gcp_vpcsc: >-
      source_type = 'gcp_audit_json' AND ends_with(coalesce(g_log, ''), '%2Fpolicy')
      AND coalesce(g_md, g_mdjson, '') LIKE '%VpcServiceControlAuditMetadata%'
  - k8s_sys: "coalesce(regexp_matches(kuser, {cfg.k8s_system_user_regex}), false)"
    k8s_ok: "coalesce(kcode < 400, false)"
    k8s_denied: "coalesce(kcode IN (401, 403), false) OR coalesce(kdecision = 'forbid', false)"
    k8s_op: "kverb || ' ' || coalesce(kres, '') || coalesce('/' || ksub, '')"
    k8s_obj: "coalesce(kns || '/', '') || coalesce(kname, '')"
    k8s_priv: >-
      kreq IS NOT NULL AND (regexp_matches(kreq, '"(privileged|hostPID|hostNetwork|hostIPC)"\s*:\s*true')
                            OR kreq LIKE '%"hostPath"%'
                            OR regexp_matches(kreq, '"add"\s*:\s*\[[^\]]*"(SYS_ADMIN|ALL|SYS_PTRACE|SYS_MODULE)"'))
    k8s_hostroot: >-
      kreq IS NOT NULL AND (regexp_matches(kreq, '"hostPath"\s*:\s*\{\s*"path"\s*:\s*"(/|/etc|/root|/proc|/var/run/docker\.sock|/run/containerd[^"]*|/var/lib/kubelet[^"]*)"')
                            OR (regexp_matches(kreq, '"hostPID"\s*:\s*true') AND regexp_matches(kreq, '"privileged"\s*:\s*true')))
    k8s_bad_image: >-
      kreq IS NOT NULL AND len(list_filter(regexp_extract_all(kreq, '"image"\s*:\s*"([^"]+)"', 1),
                                           lambda i: NOT regexp_matches(i, {cfg.k8s_trusted_registry_regex}))) > 0
    k8s_bad_cmd: "kreq IS NOT NULL AND regexp_matches(kreq, {cfg.k8s_bad_cmd_regex})"
    # exec / attach command from the request URI (?command=sh&command=-c&command=curl+...%7C+sh), URL-decoded
    k8s_cmd: >-
      CASE WHEN is_k8s AND ksub IN ('exec', 'attach') AND k8s_uri LIKE '%command=%'
           THEN url_decode(replace(regexp_replace(regexp_replace(k8s_uri, '^[^?]*\?', ''), '&?(container|stdin|stdout|stderr|tty)=[^&]*', '', 'g'), '+', ' ')) END
