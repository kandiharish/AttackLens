# Cloud detection settings (attacklens/detect_cloud*.py; rules in config/rules_cloud.yaml; catalog:
# reports/cloud/rule_catalog.md). Every threshold, window, allowlist and the cloud_ev column map live here.
#
# Rules reference values of `params` as {cfg.<name>} inside SQL (lists expand to ('a', 'b'), strings to a quoted
# literal, numbers as-is) and as "{cfg.<name>}" for a whole template parameter value.
# Never add generator label paths here (threat, rule, labels, labels_extra, event.kind, event.severity, ...):
# backend/tests/test_detect_cloud.py greps this file and rules_cloud.yaml for them.

enabled: true
source_types: [cloudtrail_json, azure_signin_json, azure_activity_json, azure_storageblob_json, gcp_audit_json,
               aws_vpcflow_json, aws_vpcflow_txt, aws_r53resolver_json, aws_nfw_json,   # track AWS
               k8s_audit_json, gcp_vpcflow_json, gcp_firewall_json, gcp_dns_json,   # track K8s + GCP
               azure_keyvault_json, azure_graph_json, azure_risk_json,   # track Azure
               okta_json, gws_reports_json, m365_ual_json, m365_purview_csv, auth0_json, duo_auth_json]   # identity SaaS
max_alerts_per_rule: 1000      # per run; overflow (lowest severity, then latest) is dropped and counted
context_severity: 35           # <= this never seeds and never counts as a tactic on its own (gate). Rules with
                               # `context: true` are capped here AFTER every rule ran: sequences still read their
                               # full severity (the combination is the signal), the emitted alert is context only.
automation:                    # CI/CD / IaC identities (params.automation_identity_patterns) on rules with `automation`:
  severity: 35                 # cap when the hit's identity is automation and shows NO risk signal (never dropped)
  new_network_days: 14         # risk: a network (ASN, else /16 or /48) this identity did not use in the last N days
  denied_min: 5                # risk: >= N denied calls by the identity within +-denied_window_ms
  denied_window_ms: 3600000
  # risk: user agent matches params.attack_ua_regex. Off-hours is NOT a risk signal here: pipelines run on cron and
  # release trains at any hour, and there is no business-hours calendar in the config.
evidence:
  mode: summary                # summary: "time=... api=... actor=... ip=... req=..." from raw fields; raw: raw_line prefix
  req_chars: 160               # request / target JSON chars kept in a summary line
  # line count / length bounds: rules.yaml thresholds evidence_max_lines / evidence_max_chars / source_keys_max
cold_start:                    # baseline rules (first_seen, rate_spike, distinct_burst with baseline_mult)
  severity: 30                 # alert severity when the actor / account history is too short (baseline_ok=false)
  min_history_days: 3
  min_actor_events: 50
dedupe: true                   # drop duplicate deliveries (org + account trail) by dedup_id before any rule runs
endpoint_host_source_types: [aws_nfw_json]   # device logs about other machines: host = internal endpoint (its owner)
default_allow:                 # every rule: a match by these principals is downgraded (never dropped)
  lists: [iac_principals, redteam_principals]
  severity: 45
change_windows: []             # [{start: "2026-10-30T10:00:00Z", end: "...", principals: [..] (optional)}] -> 45
promote_first_seen:            # rules with `promote: {first_seen: <sev>}`: (acct, actor_key, api) unseen before
  baseline_days: 14
geo:                           # all optional; nothing is downloaded at runtime (reports/cloud/README.md)
  asn_db_path: null            # iptoasn ip2asn-v4.tsv(.gz) / ip2asn-combined.tsv(.gz): start, end, asn, cc, description
  country_centroids_path: null # CSV with header cc,lat,lon -> location for B6 when the row has no coordinates
  provider_ranges:             # AWS ip-ranges.json, Google cloud.json, Azure ServiceTags JSON or a text list of CIDRs
    aws: null
    gcp: null
    azure: null
  ipv4_prefix_bits: 16         # network key without an ASN: /16 for IPv4 ...
  ipv6_prefix_hextets: 3       # ... /48 for IPv6

params:
  # ---- allowlists (lower-case; compared with the actor and the role-level actor_key) -------------------------------
  iac_principals: []
  redteam_principals: []
  iam_admin_principals: []
  ses_admins: []
  genai_principals: []
  ml_principals: []
  backup_principals: []
  kms_admins: []
  ca_admins: []
  helpdesk_principals: []
  inventory_principals: []
  nsm_principals: []
  vm_ops_principals: []
  app_owner_allow: []
  onboarding_principals: []
  no_mfa_allow_users: []
  root_allow_ips: []
  machine_principals: []         # extra identities for the machine track (excluded from first-seen / geo / travel)
  # CI/CD and IaC identities (RE2, matched on the lower-case actor, actor_key (role), issuer role name, GCP principal,
  # Azure caller / initiating app). Role session names (gha-*) are chosen by the caller of AssumeRole, so a match only
  # downgrades when the identity also shows no risk signal (cloud.yaml `automation`). Add your own deploy roles here.
  automation_identity_patterns:
    - '^repo:[^:/]+/[^:]+:(ref|environment|pull_request|job_workflow_ref):'   # GitHub Actions OIDC subject
    - '^gha-[0-9a-z_-]+$'                                                       # GitHub Actions role session name
    - '^github-?actions?([-_.].*)?$'                                            # aws-actions default session name
    - '^project_path:[^:]+:ref_type:'                                           # GitLab CI OIDC subject
    - '^organization:[^:]+:project:[^:]+:workspace:'                            # HCP Terraform / Terraform Cloud OIDC
    - '(^|[-_./:@])terraform([-_./:@]|$)'                                       # Terraform deploy roles / SAs
    - '^cdk-[a-z0-9]+-(deploy|cfn-exec|file-publishing|image-publishing|lookup)-role'  # AWS CDK bootstrap roles
    - '^awscloudformation$|(^|[-_/])cloudformation[-_]?(exec|execution|deploy|service)'  # CloudFormation service roles
    - '^sc://[^/]+/[^/]+/'                                                      # Azure DevOps service connection (WIF)
    - '^[0-9]+@cloudbuild\.gserviceaccount\.com$|@gcp-sa-cloudbuild\.iam\.gserviceaccount\.com$'  # GCP Cloud Build
  automation_identity_regex: '[^\s\S]'   # runtime: built from automation_identity_patterns by detect_cloud_ev
  trusted_aws_accounts: []       # 12-digit ids; the event's own account is always trusted
  trusted_domains: []            # GCP members / guests
  trusted_guest_domains: []
  trusted_app_ids: []
  trusted_oidc_issuers: ["https://token.actions.githubusercontent.com"]
  corp_egress_cidrs: []          # IPv4 CIDRs of the corporate egress (ignored by travel / multi-network rules)
  hosting_asns: []               # ASNs of hosting / VPN providers (with geo.asn_db_path)
  hosting_asn_regex: "amazon|google|microsoft|digitalocean|ovh|hetzner|linode|vultr|choopa|m247|datacamp|leaseweb|contabo|tor|mullvad|nord|proton|expressvpn"
  public_bucket_allow: []
  public_sg_allow: []
  public_lambda_allow: []
  ssm_allow_documents: ["AWS-RunPatchBaseline", "AWS-UpdateSSMAgent", "AWS-ConfigureAWSPackage", "AWS-GatherSoftwareInventory"]
  device_code_allow_apps: []
  legacy_auth_allow_users: []
  az_allow_extension_regex: 'mde\.windows|mde\.linux|azuremonitorwindowsagent|azuremonitorlinuxagent|microsoftmonitoringagent|guestconfiguration'
  federation_brokers: []
  export_allow_bucket_regex: '[^\s\S]'   # matches nothing; e.g. 'analytics-exports|bi-dump'
  ssec_allow_principals: []
  guest_inviters: []
  allowed_regions: []            # empty = no static region list; first-seen (acct, region) still applies
  global_services: ["iam.amazonaws.com", "sts.amazonaws.com", "organizations.amazonaws.com", "route53.amazonaws.com", "cloudfront.amazonaws.com", "signin.amazonaws.com", "health.amazonaws.com", "support.amazonaws.com", "account.amazonaws.com", "billing.amazonaws.com", "ce.amazonaws.com", "s3.amazonaws.com"]
  # ---- runtime flags (overwritten by detect_cloud after the geo files are loaded; false = file absent) -------------
  geo_asn: false
  geo_ranges_aws: false
  geo_ranges_gcp: false
  geo_ranges_azure: false
  # ---- regexes (RE2, matched on lower-case text) -------------------------------------------------------------------
  admin_group_regex: "admin|administrators|poweruser|iam"
  console_broker_ua_regex: 'jersey/\$\{project\.version\}|granted|aws-vault'
  attack_ua_regex: "pacu|trufflehog|s3 browser|azurehound|roadtools|roadrecon|aadinternals|teamfiltration|graphrunner|tokentactics|kali|parrot|pentoo|blackarch|cloudfox|stratus-red-team|cloudsploit|weirdaal|cliam|gcploit"
  scanner_ua_regex: "prowler|scoutsuite|steampipe|cloudquery|cartography"
  inventory_ua_regex: "prowler|scoutsuite|steampipe|cloudquery|cartography|aws-config|wiz|orca"
  iac_ua_regex: "terraform|pulumi|cloudformation|cdk|serverless|sam-cli|github-actions|codebuild"
  suspicious_name_regex: "^(test|temp|tmp|backdoor|key|pwn|hack|a|x)[0-9]*$"
  admin_policy_regex: ":policy/(administratoraccess|iamfullaccess|poweruseraccess|awsorganizationsfullaccess)$"
  aws_gpu_regex: "^(p[0-9]|g[0-9]|gr6|trn[0-9]|inf[0-9]|dl[0-9]|x[0-9]|u-|.*\\.metal|.*\\.(16|18|24|32|48)xlarge)"
  az_big_vm_regex: "\"vmsize\"\\s*:\\s*\"[^\"]*(nc|nd|nv|hb|hc|_m[0-9]{3}|416|208|192|128|120|96|80|72|64|48|44|40)"
  gcp_big_machine_regex: "(a2-|a3-|g2-|n1-[a-z0-9]+-(highcpu|highmem)-(64|96))"
  miner_regex: "xmrig|minerd|cpuminer|nicehash|stratum\\+tcp"
  ransom_note_regex: "readme|recover|decrypt|ransom|restore.*files|how_to"
  risky_scopes_regex: "mail\\.read|mail\\.readwrite|mail\\.send|files\\.read(write)?\\.all|sites\\.read(write)?\\.all|offline_access|user\\.readwrite\\.all|directory\\.readwrite\\.all"
  entra_priv_role_regex: "global administrator|privileged role administrator|privileged authentication administrator|application administrator|cloud application administrator|user administrator|hybrid identity administrator|security administrator|conditional access administrator|exchange administrator|intune administrator|company administrator"
  scripting_ua_families: ["python-requests", "curl", "go-http-client", "boto3", "botocore", "powershell"]
  # ---- ids (unverified against Microsoft docs at build time; see reports/cloud/README.md) ---------------------------
  entra_priv_role_ids: ["62e90394-69f5-4237-9190-012177145e10", "e8611ab8-c189-46e8-94e1-60213ab1f814", "7be44c8a-adaf-4e2a-84d6-ab2649e08a13", "9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3", "158c047a-c907-4556-b7ef-446551a6b5f7", "fe930be7-5e62-47db-91af-98c3a49a38b1", "8ac3fc64-6eca-42ea-9e69-59f4c7b60eb2", "194ae4cb-b126-40b2-bd5b-6091b380977d", "b1be1c3e-b65d-4f19-8427-f6fa0d97feb9", "29232cdf-9323-42fd-ade2-1d097af3e4de", "3a2c62db-5318-420d-8d74-23affee5d9d5", "7698a772-787b-4ac8-901f-60d6b08affd2"]
  az_priv_role_def_ids: ["8e3af657-a8ff-443c-a75c-2fe8c4bcb635", "b24988ac-6180-42a0-ab88-20f7382dd24c", "18d7d88d-d35e-4fb5-a5c3-7773c20a72d9", "f58310d9-a9f6-439a-9e8d-f62e7b41a168"]
  graph_priv_app_role_ids: ["9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8", "06b708a9-e830-4db3-a914-8e69da51d44f", "1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9", "19dbc75e-c2e2-444c-a770-ec69d8559fc7", "e2a3a72e-5f79-4c64-b1b1-878b674786c9", "810c84a8-4a9e-49e6-bf7d-12d183f40d01", "75359482-378d-4052-8f01-80520e7db3cd", "dc890d15-9560-4a4c-9b7f-a736ec74ec40"]
  gcp_admin_roles: ["roles/owner", "roles/editor", "roles/iam.securityadmin", "roles/iam.roleadmin", "roles/resourcemanager.organizationadmin", "roles/resourcemanager.projectiamadmin", "roles/iam.serviceaccountadmin"]
  gcp_impersonation_roles: ["roles/iam.serviceaccounttokencreator", "roles/iam.serviceaccountuser", "roles/iam.workloadidentityuser", "roles/iam.serviceaccountkeyadmin", "roles/iam.serviceaccountopenidtokencreator"]
  legacy_auth_clients: ["exchange activesync", "imap4", "pop3", "authenticated smtp", "other clients", "mapi over http", "exchange web services", "autodiscover", "offline address book", "exchange online powershell"]
  azure_pw_fail_codes: ["50126", "50053", "50056", "50055"]
  azure_pw_ok_codes: ["0", "50074", "50076", "50158", "500121"]
  azure_mfa_deny_codes: ["500121", "50074", "50076"]
  sensitive_ports: [22, 3389, 445, 5985, 5986, 1433, 3306, 5432, 6379, 9200, 27017, 2375, 6443]
  sensitive_apis: ["CreateAccessKey", "CreateLoginProfile", "UpdateLoginProfile", "AttachUserPolicy", "AttachRolePolicy", "PutUserPolicy", "PutRolePolicy", "CreatePolicyVersion", "UpdateAssumeRolePolicy", "GetSecretValue", "BatchGetSecretValue", "GetPasswordData", "StopLogging", "DeleteTrail", "PutEventSelectors", "CreateUser", "AddUserToGroup", "MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE", "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION", "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE", "google.iam.admin.v1.CreateServiceAccountKey", "SetIamPolicy", "AccessSecretVersion", "GenerateAccessToken"]
  sensitive_read_apis: ["GetSecretValue", "BatchGetSecretValue", "GetPasswordData", "GetParameter", "GetParameters", "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION", "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION", "AccessSecretVersion", "GenerateAccessToken", "GetBlob"]
  recon_first_apis: ["GetCallerIdentity", "ListBuckets", "ListUsers", "ListRoles", "GetAccountAuthorizationDetails", "storage.buckets.list"]
  # ---- thresholds / windows ----------------------------------------------------------------------------------------
  hour_ms: 3600000
  mfa_fail_min: 3
  mfa_fail_window_ms: 1800000
  bf_min_failures: 10
  bf_window_ms: 1800000
  bf_success_window_ms: 900000
  spray_min_users: 10
  spray_window_ms: 1200000
  geo_baseline_days: 7
  device_code_baseline_days: 30
  ssm_min_targets: 3
  burst_window_ms: 600000
  stop_start_window_ms: 3600000
  short_retention_days: 7
  secrets_min_distinct: 10
  secrets_window_ms: 600000
  secrets_denied_min: 5
  password_data_min: 3
  mfa_min_prompts: 5
  mfa_window_ms: 600000
  mfa_success_window_ms: 1800000
  key_listing_min_resources: 5
  metadata_min_instances: 5
  ses_min_apis: 3
  testiam_min: 5
  testiam_min_perms: 50
  policy_bf_min: 2
  trust_enum_min: 5
  remote_min_targets: 3
  impersonation_min_targets: 3
  kms_burst_min: 3
  ransom_min_objects: 20
  backup_burst_min: 5
  mass_launch_min: 10
  azure_vm_burst_min: 10
  multizone_min: 5
  multizone_window_ms: 300000
  bedrock_denied_min: 10
  removal_burst_min: 5
  removal_window_ms: 1800000
  create_delete_window_ms: 86400000
  lock_destroy_window_ms: 7200000
  diag_parent_delete_window_ms: 600000
  federation_verify_window_ms: 86400000
  guest_priv_window_ms: 86400000
  foundry_window_ms: 3600000
  snapshot_export_window_ms: 7200000
  cmk_destroy_window_ms: 7200000
  ses_chain_window_ms: 86400000
  federation_console_window_ms: 3600000
  instance_offhost_window_ms: 21600000
  # behavioural (catalog §5)
  b1_baseline_days: 14
  first_seen_max_per_actor_day: 20
  first_seen_summary_severity: 35
  b2_country_baseline_days: 30
  b2_prefix_baseline_days: 14
  b2_min_history_days: 5
  b3_rare_api_max_calls: 2
  b3_baseline_days: 30
  b3_min_history_days: 7
  b4_window_ms: 600000
  b4_min_distinct: 20
  b4_min_services: 4
  b4_baseline_mult: 3.0
  b4_baseline_days: 14
  b5_window_ms: 3600000
  b5_min_num: 10
  b5_min_distinct: 5
  b5_min_ratio: 0.3
  b5_z: 3.0
  b5_sigma_floor: 1.0
  b5_baseline_days: 14
  b6_min_km: 500
  b6_max_kmh: 900
  b7_window_ms: 3600000
  b8_window_ms: 86400000
  b9_baseline_days: 14
  b9_window_ms: 3600000
  b10_window_ms: 7200000
  b11_window_ms: 7200000
  b11_min_severity: 70
  b12_window_ms: 3600000
  b12_long_key_window_ms: 300000
  b12_min_networks: 2
  b13_object_window_ms: 900000
  b13_resource_window_ms: 3600000
  b13_min_objects: 100
  b13_min_buckets: 3
  b13_min_resources: 25
  b13_baseline_mult: 10.0
  b13_baseline_days: 14
  b13_prior_window_ms: 86400000
  b14_window_ms: 3600000
  b14_min_bytes: 1000000000
  b14_min_objects: 1000
  b14_baseline_mult: 10.0
  b14_baseline_days: 14
  b14_sas_min: 2
  b15_dormant_days: 30
  b16_baseline_days: 14
  b17_window_ms: 21600000
  b18_window_ms: 3600000
  b18_min_num: 50
  b18_z: 4.0
  b18_sigma_floor: 2.0
  b18_baseline_days: 14
  # storage data access (cl_storage_data_access): bulk reads by a source new to the store, a known source far above
  # its own baseline, account keys listed then used for data reads from the same network
  st_window_ms: 3600000
  st_min_objects: 50             # distinct objects in one window_ms window
  st_novel_days: 14              # "new source": no reads of this store by the source in the N days before the burst
  st_store_history_days: 3       # cold start is judged on the STORE (a new source is the point of the rule)
  st_baseline_mult: 10.0         # known source: distinct objects >= mult x its p95 per window over baseline_days
  st_baseline_days: 14
  st_key_use_window_ms: 7200000  # listKeys / list SAS -> key or SAS data reads from the same IP / network
  # ---- native rule quality track (rules marked "rules track" in rules_cloud.yaml) ----------------------------------
  unknown_user_min_failures: 3   # ConsoleLogin "No username found in supplied account" from one IP in bf_window_ms
  b4_low_min_distinct: 6         # cl_discovery_burst low tier: distinct read APIs in b4_window_ms (b4_min_services)...
  b4_low_min_denied: 2           # ... with >= N distinct denied APIs ...
  b4_low_min_recon: 3            # ... or >= N distinct recon_first_apis (whoami / list users, roles, buckets)
  storage_enum_window_ms: 600000 # cl_storage_enum_burst: object listing of >= N distinct buckets / containers
  storage_enum_min_buckets: 5
  storage_enum_baseline_mult: 3.0
  xfer_new_bucket_window_ms: 3600000   # cl_storage_write_new_bucket: >= N objects written in a window into a bucket
  xfer_new_bucket_min_objects: 20      # with no activity in the account (store) for novel_days
  xfer_new_bucket_novel_days: 30
  novel_network_action_window_ms: 3600000   # first-seen network -> discovery / credential / collection alert, same IP
  sts_reuse_window_ms: 43200000  # STS credentials issued -> used from another network (max session 12 h)
  snapshot_burst_min: 3          # snapshots / images of >= N distinct volumes / DBs / instances by one identity per hour
  # ---- track AWS (rules aws_vpcflow_* / aws_r53_* / aws_nfw_* / aws_s3_* / aws_sso_*; reports/cloud/log_coverage.md) ----
  # network: stratum / miner ports (egress to a public IP), mining-pool names, DNS tunnelling / DGA, Suricata classes
  mining_ports: [3333, 3357, 4444, 5555, 7777, 14433, 14444, 45560, 45700]
  mining_min_flows: 3            # accepted flows to a mining port of one public IP within mining_window_ms -> alert
  mining_window_ms: 3600000
  mining_domain_regex: '(^|[.-])(xmr|monero|moneroocean|nicehash|minexmr|nanopool|2miners|f2pool|ethermine|hashvault|supportxmr|c3pool|herominers|unmineable|minergate|cryptonight)[.-]|(^|[.-])stratum[0-9]*\.'
  dns_tunnel_window_ms: 3600000
  dns_tunnel_min_names: 40       # distinct names under one registered domain from one host in a window ...
  dns_tunnel_min_label: 24       # ... whose first labels average >= this many characters (hex / base32 chunks)
  dns_tunnel_allow_apex: ["amazonaws.com", "amazon.com", "cloudfront.net", "awsdns.com", "akamaiedge.net", "akamai.net", "in-addr.arpa", "ip6.arpa", "microsoft.com", "windowsupdate.com", "ubuntu.com", "googleapis.com"]
  dga_window_ms: 600000
  dga_min_nx: 20                 # NXDOMAIN answers for >= this many distinct names ...
  dga_min_apex: 10               # ... under >= this many registered domains, one host, one window
  nfw_c2_regex: 'trojan|command and control|(^|[^a-z0-9])c2([^a-z0-9]|$)|cobalt ?strike|beacon|backdoor|botnet|rat checkin|malware'
  nfw_exploit_regex: 'web application attack|privilege gain|exploit|cve-[0-9]{4}|remote code|injection|traversal|log4j|shellshock'
  nfw_scan_regex: '(^|[^a-z])scan([^a-z]|$)|network scan|portscan|nmap|masscan|zmap'
  nfw_mining_regex: 'crypto ?currency|coin ?min|miner|stratum|xmrig|monero'
  inbound_after_open_window_ms: 86400000   # security group opened to the world -> accepted inbound admin-port flow
  # S3 data events
  s3_lifecycle_max_days: 7       # PutBucketLifecycle expiring current / noncurrent objects in <= N days (Codefinger)
  s3_lifecycle_after_ssec_window_ms: 86400000
  s3_version_purge_min: 20       # DeleteObject WITH a versionId (permanent delete) of >= N objects ...
  s3_version_purge_window_ms: 900000
  s3_enum_min_buckets: 8         # ListObjects* / GetBucketAcl / GetBucketPolicy over >= N buckets in a window
  s3_enum_window_ms: 600000
  s3_anon_min_objects: 20        # anonymous GetObject of >= N objects in an hour
  # IAM Identity Center sign-in
  sso_spray_min_users: 5         # password failures for >= N users from one IP ...
  sso_spray_window_ms: 1800000
  sso_bf_min_failures: 10        # >= N password failures for one user ...
  sso_bf_window_ms: 1800000
  sso_mfa_min_challenges: 5      # >= N MFA challenges / failed MFA verifications for one user ...
  sso_mfa_window_ms: 600000
  sso_newnet_days: 14            # MFA device registered from a network this user did not use in the last N days
  sso_mfa_regex: '^(start|complete)(webauthn|virtualmfa|mfa)device(registration)?$|^createmfadeviceforuser$|^enablemfadevice$|^createvirtualmfadevice$'
  # ---- track Identity SaaS (rules okta_* / gws_* / m365_* / auth0_* / duo_*; log_coverage.md P0-7, P0-11, P0-12, P1-16)
  gws_cl_services: ["login.googleapis.com", "admin.googleapis.com", "oauth2.googleapis.com"]   # Cloud Logging copy
  idp_internal_domains: []       # e-mail domains that count as internal for forwarding / sharing (the actor's own
                                 # UPN domain always does); e.g. ["corp.example", "corp-subsidiary.example"]
  idp_spray_min_users: 8         # failed sign-ins for >= N distinct users from one IP (spray / stuffing) ...
  idp_spray_window_ms: 1800000   # ... within 30 min (Okta, Workspace, Auth0)
  idp_spray_success_window_ms: 3600000   # spray IP -> a successful sign-in from the same IP within 1 h (valid account)
  idp_push_min_denied: 2         # MFA push fatigue: of the >= mfa_min_prompts prompts in mfa_window_ms, >= N denied /
                                 # timed out (a user retrying a slow push is prompts only)
  idp_session_window_ms: 3600000 # one IdP session id from >= 2 networks within 1 h (token / cookie replay)
  okta_admin_role_regex: "super administrator|super_admin|organization administrator|org_admin|api access management|mobile administrator|application administrator|app_admin"
  okta_idp_events: ["system.idp.lifecycle.create", "system.idp.lifecycle.activate"]
  okta_policy_weaken_events: ["policy.lifecycle.deactivate", "policy.lifecycle.delete", "policy.rule.deactivate", "policy.rule.delete"]
  idp_factor_after_compromise_ms: 21600000   # okta compromise signal -> MFA factor enrolled / reset for the same user
  gws_broad_scope_regex: 'https://mail\.google\.com/|auth/gmail\.(readonly|modify|compose|send|settings)|auth/drive([ ,]|$)|auth/drive\.readonly|auth/admin\.directory|auth/cloud-platform'
  gws_trusted_oauth_clients: []  # OAuth client ids allowed broad Workspace scopes (backup / archiving tools)
  gws_super_roles: ["_seed_admin_role", "super admin", "_super_admin_role"]
  m365_forward_ops: ["New-InboxRule", "Set-InboxRule", "Set-Mailbox", "New-TransportRule", "Set-TransportRule"]
  m365_hiding_folder_regex: '^(rss feeds|rss subscriptions|conversation history|archive|junk email)$'
  m365_lure_keyword_regex: 'invoice|payment|wire|bank|transfer|security|phish|hack|password|mfa|helpdesk|it support|suspicious|urgent'
  m365_download_min: 50          # distinct files downloaded / synced by one user in m365_download_window_ms ...
  m365_download_window_ms: 3600000
  m365_download_baseline_mult: 10.0   # ... and >= N x the user's own hourly p95 over 14 days
  m365_share_ops: ["AnonymousLinkCreated", "SharingInvitationCreated", "AddedToSecureLink", "SecureLinkCreated", "SharingSet", "CompanyLinkCreated"]
  m365_share_burst_min: 5        # >= N distinct files shared externally / anonymously by one user per hour
  m365_share_window_ms: 3600000
  duo_push_fail_reasons: ["no_response", "user_cancelled", "user_mistake", "user_marked_fraud", "anomalous_push", "user_declined"]
  # ---- track K8s + GCP (rules k8s_* / gcp_*; reports/cloud/log_coverage.md P0-8, P0-14, P1-5, P1-11) ----------------
  # Kubernetes control-plane / node / built-in controller identities (RE2 on the raw lower-case username). A stolen
  # kube-system token of a NON-controller service account is NOT matched (it stays an actor every k8s rule sees).
  k8s_system_user_regex: '^(system:(kube-[a-z-]+|node:.+|apiserver|volume-scheduler|kube-proxy|gke-[a-z0-9-]+|clustermetrics|addon-manager|konnectivity-server|metrics-server)|system:serviceaccount:kube-system:([a-z0-9-]+-controller|generic-garbage-collector|horizontal-pod-autoscaler|kube-proxy|coredns|cloud-provider)|eks:.+|aksservice|nodeclient)$'
  k8s_admins: []                 # break-glass / platform admins: exec, RBAC and token rules downgrade to 35 (never dropped)
  # operators that legitimately read secrets across namespaces (lower-case actor = system:serviceaccount:<ns>:<name>)
  k8s_secret_readers: ["system:serviceaccount:argocd:argocd-application-controller", "system:serviceaccount:argocd:argocd-server",
                       "system:serviceaccount:flux-system:kustomize-controller", "system:serviceaccount:flux-system:helm-controller",
                       "system:serviceaccount:cert-manager:cert-manager", "system:serviceaccount:external-secrets:external-secrets"]
  # namespaces whose workloads are privileged by design (CNI, node agents, monitoring): privileged pod -> 40
  k8s_priv_namespaces: [kube-system, calico-system, tigera-operator, gke-managed-system, gmp-system, istio-system, monitoring, falco]
  k8s_secrets_min_distinct: 8    # distinct secrets (namespace/name) read by one actor in k8s_secrets_window_ms
  k8s_secrets_window_ms: 600000
  k8s_discovery_min_resources: 6 # distinct resource types listed / read by one actor in k8s_discovery_window_ms
  k8s_discovery_window_ms: 600000
  # resources an intruder enumerates (RBAC, credentials, nodes, admission); `kubectl get all` types are not listed
  k8s_discovery_resources: [secrets, configmaps, serviceaccounts, roles, rolebindings, clusterroles, clusterrolebindings,
                            nodes, namespaces, networkpolicies, mutatingwebhookconfigurations,
                            validatingwebhookconfigurations, selfsubjectrulesreviews, selfsubjectaccessreviews,
                            customresourcedefinitions, persistentvolumes, certificatesigningrequests]
  k8s_forbidden_min: 8           # distinct forbidden (401 / 403) requests by one actor or IP in the window
  k8s_forbidden_window_ms: 600000
  k8s_newip_baseline_days: 14    # kubectl / API use from a network this user did not use in the last N days
  k8s_bad_cmd_regex: '(curl|wget)[^|;]*\|\s*(ba)?sh|base64 +-d|/dev/tcp/|\bnc(at)? .*-e|xmrig|minerd|stratum\+tcp|python3? -c|chmod \+x /tmp|nsenter|/var/run/docker\.sock|/run/containerd'
  k8s_trusted_registry_regex: '^(registry\.corp\.example|[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|[a-z0-9-]+-docker\.pkg\.dev|gcr\.io/corp-|mcr\.microsoft\.com|registry\.k8s\.io|quay\.io/(argoproj|jetstack|prometheus)|docker\.io/(grafana|bitnami)|ghcr\.io/corp-example)/'
  # GCP audit: VPC Service Controls, BigQuery, serverless, workload identity federation
  gcp_vpcsc_min: 3               # VPC-SC denials by one actor in gcp_vpcsc_window_ms (one denial is a misconfig signal)
  gcp_vpcsc_window_ms: 1800000
  gcp_trusted_export_regex: '^gs://(corp-|backup-corp-)'   # BigQuery EXTRACT destinations inside the company
  gcp_bq_bulk_bytes: 53687091200 # one query billing >= 50 GiB by a non-analytics principal
  gcp_bq_read_min_tables: 12     # distinct tables read (jobs / tabledata) by one actor in gcp_bq_read_window_ms
  gcp_bq_read_window_ms: 1800000
  gcp_analytics_principals: []   # BI / ETL service accounts allowed to read in bulk (lower-case actor)
  gcp_deployer_principals: []    # CI deployers of Cloud Run / Functions (also automation_identity_patterns)
  # ---- track Azure (rules az_kv_* / az_graph_* / az_idp_* / az_sp_*; reports/cloud/log_coverage.md P0-3, P0-9, P0-13,
  # P1-12). Key Vault data plane: apps read the same few secrets all day; a sweep reads many distinct ones at once.
  kv_secret_window_ms: 600000    # az_kv_secret_sweep: distinct secrets / keys / certificates read by one actor ...
  kv_secret_min_distinct: 8      # ... >= N within the window (a deploy reads 2-5; rotation jobs SET, they do not GET)
  kv_vault_sweep_min: 3          # ... or SecretList on >= N vaults by one actor in the window
  kv_denied_min: 4               # az_kv_forbidden_then_get: 403 on >= N distinct objects / vaults by one actor ...
  kv_denied_window_ms: 1800000
  kv_denied_get_window_ms: 7200000   # ... then a successful read by the same actor within this window
  kv_purge_min: 3                # az_kv_purge: >= N purges (or delete + purge of >= N objects) by one actor ...
  kv_purge_window_ms: 3600000
  kv_backup_min: 3               # az_kv_backup_export: SecretBackup / KeyBackup / CertificateBackup of >= N objects
  kv_backup_window_ms: 3600000
  kv_readers: []                 # backup / secret-sync identities allowed to read many secrets (lower-case actor)
  kv_admins: []                  # vault admins: purge / key delete downgraded to 45 (never dropped)
  # Microsoft Graph: enumeration = many object types (users, groups, SPs, roles, apps, devices ...) in minutes
  graph_enum_types: [users, groups, serviceprincipals, applications, directoryroles, devices, rolemanagement,
                     directoryobjects, oauth2permissiongrants, administrativeunits, domains, organization, contacts,
                     identity, policies, directoryroletemplates, rolemanagementpolicies, groupsettings]
  graph_enum_window_ms: 600000
  graph_enum_min_types: 4        # distinct object types in the window ...
  graph_enum_min_calls: 40       # ... and >= N calls (an admin portal page load is < 10)
  graph_enum_baseline_mult: 3.0  # a daily inventory app is judged against its own history (p95 per window)
  graph_enum_baseline_days: 14
  graph_mail_window_ms: 3600000
  graph_mail_min_mailboxes: 5    # one identity reading >= N OTHER users' mailboxes in the window ...
  graph_mail_baseline_mult: 3.0  # ... and >= mult x its own p95 (a mail backup app reads every mailbox nightly)
  graph_mail_baseline_days: 14
  graph_cred_paths_regex: '/(applications|serviceprincipals)/[^/]+/(addpassword|addkey)$|/(applications|serviceprincipals)/[^/]+/federatedidentitycredentials$'
  graph_token_window_ms: 3600000 # az_graph_token_replay: a sign-in token (UniqueTokenIdentifier) used for Graph ...
                                 # ... from another /16 (IPv4) or /48 (IPv6) than the sign-in within this window
  # Entra ID Protection risk event types -> rule (lower-case riskEventType)
  idp_signin_types: [unlikelytravel, anonymizedipaddress, maliciousipaddress, unfamiliarfeatures, suspiciousipaddress,
                     newcountry, impossibletravel, nationstateip, riskyipaddress, leakedcredentials,
                     investigationsthreatintelligence, generic, suspiciousapitraffic, suspiciousbrowser,
                     mcasimpossibletravel, suspicioussignins]
  idp_token_types: [anomaloustoken, tokenissueranomaly, attackerinthemiddle, attemptedprtaccess, anomaloususeractivity,
                    suspiciousauthappapproval]
  idp_spray_types: [passwordspray, mcassuspiciouspasswordspray]
  idp_mfa_types: [mfafraud]
  idp_inbox_types: [suspiciousinboxforwarding, mcassuspiciousinboxmanipulationrules, suspiciousinboxmanipulationrules]
  idp_closed_states: [dismissed, remediated, confirmedsafe]   # closed by an analyst / the user: context only
  sp_signin_baseline_days: 14    # az_sp_signin_new_network: service principal sign-in from a network unused for N days

