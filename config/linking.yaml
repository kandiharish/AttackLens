# Stage 3 link / Stage 4 incidents / reach-next parameters (DEVELOPMENT.md §4, §6).
# Owned by backend-builder. seed/critical confidence live in rules.yaml `thresholds`; raw_ref_score lives here (risk).

link:
  # Link windows tau_R (ms) and multipliers M_R. weight = M_R * rarity_j * exp(-dt / tau_R)
  rules:
    R1: {tau_ms: 86400000, mult: 1.5, src_tau_ms: 21600000, ext_ip_tau_ms: 7200000}  # handoff host -> host, 24 h
    # ext_ip_tau_ms: window for the attacker-IP variant (same external src_ip on two subjects), 2 h.
    # src_tau_ms: window for the i.subject_host = j.src_host variant only (6 h); weight decay still uses tau_ms.
    # Omit (or set = tau_ms) for the literal 24 h.
    R2: {tau_ms: 7200000, mult: 1.0}     # same session (subject_host + user), 2 h
    R3: {tau_ms: 259200000, mult: 1.3}   # account pivot (target_user -> later user), 72 h
    R4: {tau_ms: 86400000, mult: 1.2}    # Collection -> Exfiltration on same host, 24 h
  # Fan-out cap: for each target episode j keep at most this many predecessors per rule (best weight first).
  max_preds_per_rule: 5
  # Rarity used when an episode has none.
  default_rarity: 1.0
  # Which R2 keys are barred when they are background hubs ("host", "user"). R3 always bars hub users.
  r2_hub_keys: [host, user]
  # R3 also matches i.target_user = j.target_user (account created -> elevated -> logged on), not only j.src_user.
  r3_match_target_user: true
  # R3 source i must be an account-acquisition step ("created / elevated / brute-forced") with credible confidence.
  # Without this, a handful of shared user names within 72 h links most noise together.
  r3_source_tactics: ["Credential Access", "Persistence", "Privilege Escalation", "Initial Access"]
  r3_min_source_confidence: 60
  # R3 fan-out cap per source episode (one account): keep its top-k successors by weight. At 10G a brute force on
  # svc_backup had ~65 R3 links to unrelated svc_backup activity (17 at 1G). 0 = off.
  r3_max_succs_per_source: 5
  # Log devices (firewall devname, logs every flow as host): barred as R2 keys and as host-name R1 keys.
  # Auto: any `host` that logs episodes about another subject_host. Add names here to force.
  device_hosts: []
  auto_device_hosts: true
  # R2 for user-less episodes on IP endpoints (FortiGate: the entity of an internal endpoint is its IP).
  r2_ip_session: true
  # false: hub IPs may still key a user-less IP session (the victim server is a busy IP); true bars them.
  r2_ip_session_bar_hubs: false
  # R1 attacker-IP handoff on the same external (non-internal, non-hub) src_ip; window R1.ext_ip_tau_ms.
  r1_ext_ip: true
  # R2 attacker-IP session: same subject + same external src_ip within R2 tau (user may differ / be NULL).
  # Joins e.g. FortiGate IPS hit -> SSL-VPN login from the same remip, both logged on the devname.
  r2_ext_ip_session: true
  internal_ip_regex: '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.|169\.254\.|::1$|f[cd]|fe80:)'

gate:
  min_tactics: 2
  # Episodes below this confidence do not count toward |tactics(C)| (they still join the component). 0 = literal.
  min_tactic_confidence: 40
  # A component with < min_tactics counted tactics may pass the "max Confidence >= critical" path only if its
  # top-confidence episode has merged_alert_count >= this (e.g. one stray .locked file = 1 alert -> suppressed;
  # S5 ransom_rename = 300 -> kept). 1 = literal §6.3 behaviour. Components with >= min_tactics tactics unchanged.
  critical_min_merged_alerts: 5
  # Hands-on-keyboard burst path: a component also passes if ONE subject shows >= min_distinct_techniques distinct
  # parent techniques from >= multi_technique_min_rules distinct rules within multi_technique_window_ms, with max
  # confidence >= multi_technique_min_conf and >= multi_technique_min_seeds seeds (e.g. av download -> beacon ->
  # tor proxy on 10.10.2.37: 3 techniques, 3 rules, single tactic C2). min_distinct_techniques: 0 = literal §6.3.
  min_distinct_techniques: 3
  multi_technique_min_rules: 2
  multi_technique_window_ms: 7200000
  multi_technique_min_conf: 60
  multi_technique_min_seeds: 0
  # Incidents kept only via the burst path get risk = max(risk, burst_risk_floor), so a confirmed single-tactic
  # burst (e.g. C2 av -> beacon -> tor) never sorts below single-tactic noise. 0 = literal §6.4 risk.
  burst_risk_floor: 50
  # Fallbacks; real values come from rules.yaml thresholds (seed_confidence, critical_confidence).
  seed_confidence: 65
  critical_confidence: 90
  # Peeling: after the path DP, the incident = path + episodes directly linked to it; the remainder of the
  # component is re-split and re-gated (a noise chain can otherwise merge two attacks into one incident).
  max_incidents_per_component: 20
  suppressed_max_entries: 5000
  suppressed_max_ids: 20

risk:
  # Highest planted attack's raw on g1 (S1 = 30.784, incidents stats raw_risk, 31 Oct). Wins over rules.yaml thresholds.
  raw_ref_score: 30.8
  base_points: 90
  bonus_cap: 10

path:
  # Steps of these tactics do not raise the per-host tactic floor in the path DP. Needed so planted chains like
  # Credential Access (T1110) -> Initial Access (T1078) and Lateral Movement -> Execution stay in order.
  # Set to [] for the literal rule ok(i,j) <=> tactic_idx(j) >= tactic_idx(i) or rule = R1.
  floor_exempt_tactics: ["Initial Access", "Credential Access", "Lateral Movement"]
  branch_min_ratio: 0.5
  # true: a branch tail with >= min_tactics tactics that passes the gate alone is not attached as a branch;
  # if it is not directly linked to the backbone it is peeled into its own incident.
  peel_standalone_branch_tails: true
  # DP node value: confidence (rarity-calibrated, scale-invariant: common noise stays low as data grows) or
  # severity (literal §6.6). Seeds (confidence >= seed_confidence) are always shown as backbone or branch.
  dp_node_score: confidence
  max_branches: 5
  max_evidence_lines: 3
  max_evidence_chars: 300

reach:
  max_hops: 3
  max_results: 20
  ports: [22, 445, 3389, 5985]
  admin_logon_types: [3, 10]
  excluded_logon_ids: ["0x3e7", "0x3e4", "0x3e5"]
  ssh_process_names: [sshd]
  # SSH = AdminTo only as one of these users, or with a sudo proc_start (process 'sudo' / command 'sudo ...') by
  # the same user on the same host within sudo_window_ms after the logon. Plain SSH = reach hop (via_user), not admin.
  ssh_root_users: [root]
  sudo_window_ms: 900000
  admin_groups: [administrators, "domain admins", "enterprise admins"]
  domain_admin_groups: ["domain admins", "enterprise admins"]
  elevated_tactics: ["Privilege Escalation"]
  # First matching substring of the host name wins.
  crown_jewels:
    - {contains: dc, tag: dc}
    - {contains: file, tag: file}
    - {contains: db, tag: db}
    - {contains: web, tag: web}
