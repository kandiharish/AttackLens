# Detection rules (DEVELOPMENT.md §5). Stage 2 (detect.py) turns each rule into one SQL query over `events`.
# kind: match    -> `where` is a SQL predicate over canonical columns (§3.1). Placeholders {ioc.<list>} expand to
#                   a quoted SQL list from config/ioc.yaml, e.g. dst_ip IN {ioc.ips}.
# kind: template -> `template` names a function in attacklens/detect_templates.py; parameters come from `thresholds`.
#                   `secondary` labels the second alert kind a template can emit (e.g. T1078 after a brute force).
# technique / sub_technique must exist in config/attack_v20.json; tactic must be a v20 tactic name.

thresholds:
  # brute force (T1110 + T1078)
  bf_min_failures: 50            # failures per (target_user, host) in one burst
  bf_gap_ms: 600000              # a gap > 10 min between failures starts a new burst
  bf_key: [target_user, host]    # burst key (rules may override via params, e.g. add src_ip)
  bf_success_window_ms: 900000   # success must follow the last failure within 15 min (also for spray)
  bf_require_success: false      # false: T1110 fires on the burst alone; T1078 only with a success
  emit_t1078_on_bruteforce: true # emit the secondary T1078 Initial Access alert for the success (bf + spray)
  # password spray (T1110.003)
  spray_min_users: 15            # distinct target users failing from one src_ip ...
  spray_window_ms: 600000        # ... within 10 min
  # account created then elevated (T1136 + T1098)
  create_elevate_window_ms: 86400000
  # exfiltration (T1048)
  exfil_min_bytes: 50000000      # sliding-window sum must exceed max(this, mult x host baseline)
  exfil_window_ms: 900000
  exfil_routine_min_days: 4      # routine transfer: pair active on >= this many days ...
  exfil_routine_max_ratio: 2.0   # ... and alert-day volume <= ratio x its median daily volume -> no alert
  exfil_baseline_mult: 5.0       # baseline = host's median daily bytes per external destination
  # ransomware (T1486)
  mass_rename_min: 100
  mass_rename_window_ms: 60000
  # beaconing (T1071.001)
  beacon_min_conns: 6
  beacon_max_cv: 0.2             # inter-arrival coefficient of variation must be below this
  beacon_max_conns_per_day: 20000   # pre-filter: (pair, day) groups busier than this are not beacons
  beacon_session_gap_ms: 3600000 # a gap > 1 h splits a (host, dst) series into separate sessions
  # new admin logon (T1021 / T1078)
  new_admin_max_pair_seen: 2     # (user, host) pair with <= this many privileged logons in the data set
  new_admin_routine_min_logons: 3        # pair with >= this many NON-privileged login_success on the host ...
  new_admin_business_hours_utc: [8, 19]  # ... and logon hour in [start, end) UTC -> routine admin work, no alert
  new_admin_excluded_logon_ids: ["0x3e7", "0x3e4", "0x3e5"]
  sudo_max_pair_seen: 2          # sudo_escalation: (user, host) pair with <= this many sudo runs
  kerberoast_min_services: 5     # kerberoasting: distinct service_name per account ...
  kerberoast_window_ms: 600000   # ... within 10 min
  kerberoast_encryption: ["0x17"]
  pth_max_pair_seen: 2           # pass_the_hash: (user, host) pair with <= this many matching logons
  pth_logon_types: [9]
  pth_auth_packages: ["negotiate", "ntlm"]
  entity_fallback_ip: true       # no host name for an internal endpoint -> its IP is the subject (firewall logs)
  entity_internal_zones: [lan, dmz]
  entity_fallback_source_types: [fortigate_kv, firewall_csv]   # IP fallback only for these sources
  entity_fallback_actions: [conn_out, conn_allowed, conn_denied, dns_query, ips_alert, av_alert, web_blocked,
                            web_access, app_ctrl]
  vendor_severity_map: {critical: 90, high: 80, medium: 60, low: 40}   # signature_map row severity
  blocked_outcomes: [failure, blocked, dropped, reset, deny]  # device stopped it -> severity - penalty
  blocked_penalty: 20
  blocked_floor: 30
  blocked_severity: 30           # blocked_daily alerts (prevented detections)
  scan_min_ports: 20             # port_scan: distinct dst_port on one dst_ip ...
  scan_min_hosts: 20             # ... or distinct dst_ip on one dst_port ...
  scan_window_ms: 60000          # ... within 60 s
  scan_horizontal_internal_only: true   # count only internal dst_ip for the many-hosts variant
  lateral_direction: internal    # internal_lateral: internal src only (inbound_remote_service: inbound)
  lateral_peer_median_min: 5     # ... and the service is routine for other sources (median sightings) ...
  lateral_sole_user_max_srcs: 1  # ... or this source is (one of) its only user(s)
  lateral_gate_min_service_sightings: 200   # gate only services with this much history (else fail open)
  lateral_min_bytes: 1000       # internal_lateral: ignore probe-sized connections (sent + rcvd bytes)
  lateral_max_triple_seen: 2     # internal_lateral: (src_ip, dst_ip, dst_port) seen <= this many times
  lateral_ports: {445: T1021.002, 3389: T1021.001, 5985: T1021.006, 5986: T1021.006, 22: T1021.004}
  vpn_context_window_ms: 86400000   # vpn_login_context: look-back for the same src_ip's context
  vpn_min_failures: 5            # ... >= this many VPN login failures, or an allowed IPS hit
  vpn_first_seen_pair: false     # also fire on a first-seen (user, src_ip) pair (noisy: VPN IPs churn)
  vpn_logon_type: 10
  cfg_after_login_window_ms: 7200000  # fw_config_change_after_login: change within 2 h of external login
  lateral_context_window_ms: 86400000  # T1021 needs an earlier alert for the account on the source host, else T1078
  # remote_service_exec (T1569.002 + T1021.002): PsExec-style service created over an admin share
  remote_svc_logon_window_ms: 300000        # network logon to the host <= 5 min before -> + T1021.002 secondary
  remote_svc_logon_types: [3]               # Network
  remote_svc_loopback_ips: ["127.0.0.1", "::1"]
  remote_svc_ignore_users: ["anonymous logon"]
  remote_svc_names: [psexesvc, paexec, remcomsvc, csexecsvc, xcmdsvc]   # remote-exec tool service names
  remote_svc_binaries: [psexesvc.exe, remcomsvc.exe, csexecsvc.exe, xcmdsvc.exe]   # their service binaries
  remote_svc_shells: [cmd.exe, powershell.exe, pwsh.exe]   # services.exe -> shell = a command run as a service
  remote_svc_image_patterns:                # 7045 ImagePath (process_path) of a remote-exec service
    - '(?i)^"?(%systemroot%|%windir%|\\systemroot|[a-z]:\\windows)\\[^\\]+\.exe"?(\s|$)'   # ADMIN$ root binary
    - '(?i)^"?\\\\[^\\]+\\(admin|[a-z])\$\\'                                                # UNC admin share
    - '(?i)%comspec%|(^|[\\"\s])cmd(\.exe)?"?\s+/[qcrk]\b'                                # shell one-liner
    - '(?i)(^|[\\"\s])(powershell|pwsh)(\.exe)?"?\s.*-(e|ec|enc|encodedcommand|nop|noprofile|w|windowstyle)\b'
    - '(?i)\\(psexesvc|paexec[^\\]*|remcomsvc|csexecsvc)\.exe'
  remote_svc_child_path_patterns:           # services.exe child running from the Windows directory root (ADMIN$)
    - '(?i)^[a-z]:\\windows\\[^\\]+\.exe$'
  # lookups / scoring (§4 Stage 1b, §6)
  hub_min_median_daily_peers: 40  # was 20: generator users log onto all 28 hosts daily -> every user/IP a hub,
                                  # R2/R3 dead. g1 sweep (hub 40, baseline 99): det 100 / lab 100 / rebuilt 100 / FA 16.7
  seed_confidence: 65
  critical_confidence: 90
  raw_ref_score: 15.0
  baseline_max_other_rules: 99  # rule_host_baseline counts a host-day only if it had <= this many OTHER rules
                                # firing that day. 0 = §4 literal, but dense noise then drives base_freq to 0 and every
                                # noise alert becomes a seed. g1 sweep (hub 40, baseline 99): det 100 / lab 100 /
                                # rebuilt 100 / FA 16.7 (vs FA 44.4 with 0)
  # evidence and episodes (§4 Stage 2/2.5, §15.4)
  evidence_max_lines: 3
  evidence_max_chars: 300
  source_keys_max: 50
  episode_bucket_ms: 300000
  episode_cap: 25000
  spill_hops: 2
  spill_hop_window_ms: 86400000

rules:
  # ---------------- templates ----------------
  - id: brute_force_then_success
    kind: template
    template: brute_force_then_success
    filter: "source_type IS DISTINCT FROM 'fortigate_kv'"   # firewall logins: fw_admin_bruteforce / vpn_*
    technique: T1110
    sub_technique: T1110.001
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, tactic: Initial Access, severity: 85}

  - id: password_spray
    kind: template
    template: password_spray
    filter: "source_type IS DISTINCT FROM 'fortigate_kv'"   # firewall logins: fw_admin_spray
    technique: T1110
    sub_technique: T1110.003
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, tactic: Initial Access, severity: 85}

  - id: account_created_then_elevated
    kind: template
    template: account_created_then_elevated
    technique: T1136
    tactic: Persistence
    severity: 70
    secondary: {technique: T1098, tactic: Privilege Escalation, severity: 80}

  - id: beaconing
    kind: template
    template: beaconing
    filter: "source_type NOT IN ('fortigate_kv', 'firewall_csv') OR NOT al_is_internal_ip(dst_ip)"   # fw: external C2 only
    technique: T1071
    sub_technique: T1071.001
    tactic: Command and Control
    severity: 75

  - id: ransom_rename
    kind: template
    template: ransom_rename
    technique: T1486
    tactic: Impact
    severity: 95

  - id: exfil_volume
    kind: template
    template: exfil_volume
    technique: T1048
    tactic: Exfiltration
    severity: 85

  - id: new_admin_logon
    kind: template
    template: new_admin_logon
    technique: T1021            # internal source; sub-technique chosen per row (.002 SMB, .001 RDP, .004 SSH)
    tactic: Lateral Movement
    severity: 75
    secondary: {technique: T1078, tactic: Initial Access, severity: 80}   # external (non-RFC1918) source
    relabel_without_context: true   # internal source but no earlier alert for the account on the source host -> T1078

  # ---------------- match rules ----------------
  - id: office_spawns_script
    kind: match
    where: >-
      action = 'proc_start'
      AND lower(parent_process) IN ('winword.exe','excel.exe','outlook.exe','powerpnt.exe','msaccess.exe','onenote.exe')
      AND lower(process_name) IN ('powershell.exe','pwsh.exe','cmd.exe','wscript.exe','cscript.exe','mshta.exe')
    technique: T1059
    sub_technique: T1059.001
    tactic: Execution
    severity: 80

  # encoded_powershell: a powershell.exe / pwsh.exe launch with -enc / -e / -ec, or (also on a 4104 / 4103 script
  # block, action script_exec) -nop with hidden / iex, an iex download cradle, or iex of FromBase64String. The bare
  # -enc / -e flag arms stay proc_start-only: in script text they match -Encoding / -ErrorAction parameters.
  - id: encoded_powershell
    kind: match
    where: >-
      action IN ('proc_start','script_exec')
      AND (action = 'script_exec' OR lower(process_name) IN ('powershell.exe','pwsh.exe'))
      AND ((action = 'proc_start'
            AND (command_line ILIKE '% -enc%' OR command_line ILIKE '% -e %' OR command_line ILIKE '% -ec %'))
           OR (action = 'script_exec' AND regexp_matches(command_line, '(?i)\biex\b|invoke-expression')
               AND regexp_matches(command_line, '(?i)frombase64string'))
           OR (regexp_matches(command_line, '(?i)\s-nop(rofile)?\b')
               AND regexp_matches(command_line, '(?i)\s-w(indowstyle)?\s+hidden\b|\biex\b|invoke-expression|downloadstring'))
           OR (regexp_matches(command_line, '(?i)\biex\b|invoke-expression')
               AND regexp_matches(command_line, '(?i)downloadstring|downloadfile|invoke-webrequest')))
      AND coalesce(lower(parent_process), '') NOT IN ('winword.exe','excel.exe','outlook.exe','powerpnt.exe','msaccess.exe','onenote.exe')
    technique: T1059
    sub_technique: T1059.001
    tactic: Execution
    severity: 75

  - id: run_key_persistence
    kind: match
    where: >-
      (action = 'reg_set'
       AND (registry_path ILIKE '%\CurrentVersion\Run%')
       AND lower(process_name) IN ('powershell.exe','pwsh.exe','cmd.exe','wscript.exe','cscript.exe','mshta.exe',
                                   'reg.exe','rundll32.exe','regsvr32.exe'))
      OR (action = 'proc_start' AND command_line ILIKE '%reg%add%\CurrentVersion\Run%')
    technique: T1547
    sub_technique: T1547.001
    tactic: Persistence
    severity: 75

  - id: ioc_destination
    kind: match
    where: >-
      action IN ('conn_out','conn_allowed','conn_denied','dns_query','web_access','web_blocked')
      AND (dst_ip IN {ioc.ips} OR lower(dst_domain) IN {ioc.domains})
    technique: T1071
    sub_technique: T1071.001
    tactic: Command and Control
    severity: 75

  - id: ransom_extension
    kind: match
    where: "action IN ('file_rename','file_write') AND lower(file_ext) IN {ioc.ransom_extensions}"
    technique: T1486
    tactic: Impact
    severity: 90

  - id: discovery_commands      # also on 4104 / 4103 script blocks (action script_exec)
    kind: match
    where: >-
      action IN ('proc_start','script_exec')
      AND (command_line ILIKE '%net user%' OR command_line ILIKE '%net group%' OR command_line ILIKE '%net1 group%'
           OR command_line ILIKE '%net localgroup%' OR command_line ILIKE '%nltest%' OR command_line ILIKE '%get-aduser%')
    technique: T1087
    sub_technique: T1087.002
    tactic: Discovery
    severity: 55

  - id: discovery_system        # script block (script_exec): the command word only, not a $systemInfo variable
    kind: match
    where: >-
      (action = 'proc_start'
       AND (lower(process_name) IN ('whoami.exe','systeminfo.exe')
            OR command_line ILIKE '%whoami%' OR command_line ILIKE '%systeminfo%'))
      OR (action = 'script_exec'
          AND regexp_matches(command_line, '(?i)(^|[\s;|&(=])(whoami|systeminfo)(\.exe)?(\s|$|[;|&)])'))
    technique: T1082
    tactic: Discovery
    severity: 45

  - id: service_or_task
    kind: match
    where: >-
      action = 'service_installed'
      OR (action = 'proc_start' AND (command_line ILIKE '%sc create %' OR command_line ILIKE '%sc.exe create %'))
    technique: T1543
    sub_technique: T1543.003
    tactic: Persistence
    severity: 65

  - id: scheduled_task
    kind: match
    where: >-
      action = 'scheduled_task'
      OR (action = 'proc_start' AND command_line ILIKE '%schtasks%/create%')
    technique: T1053
    sub_technique: T1053.005
    tactic: Persistence
    severity: 60

  - id: log_cleared
    kind: match
    where: >-
      action = 'log_cleared'
      OR (action = 'proc_start' AND command_line ILIKE '%wevtutil% cl %')
    technique: T1070
    sub_technique: T1070.001
    tactic: Defense Impairment
    severity: 80

  - id: archive_staging
    kind: match
    where: >-
      action = 'proc_start'
      AND (command_line ILIKE '%7z% a %' OR command_line ILIKE '%7za% a %' OR command_line ILIKE '%rar% a %'
           OR command_line ILIKE '%compress-archive%' OR command_line ILIKE '%zip -r %'
           OR command_line ILIKE '%tar -c%' OR command_line ILIKE '%tar c%z%')
    technique: T1560
    sub_technique: T1560.001
    tactic: Collection
    severity: 60

  # ---------------- coverage round B2 ----------------
  - id: suspicious_cmd          # cmd.exe under an unusual parent
    kind: match
    where: >-
      action = 'proc_start' AND lower(process_name) = 'cmd.exe'
      AND lower(parent_process) IN ('winword.exe','excel.exe','wmiprvse.exe','mshta.exe','w3wp.exe')
    technique: T1059
    sub_technique: T1059.003
    tactic: Execution
    severity: 70

  # wmi_exec: a shell under wmiprvse.exe; or ANY other wmiprvse.exe child (implant EXE via Win32_Process.Create)
  # unless it is a benign WMI provider/host child (allow-list below) or runs as a service account (provider work
  # runs as SYSTEM / NETWORK SERVICE / LOCAL SERVICE / the machine account; Win32_Process.Create runs as the caller);
  # or wmic process call create.
  - id: wmi_exec
    kind: match
    where: >-
      action = 'proc_start'
      AND ((lower(parent_process) = 'wmiprvse.exe'
            AND (lower(process_name) IN ('cmd.exe','powershell.exe','pwsh.exe')
                 OR (process_name IS NOT NULL
                     AND lower(process_name) NOT IN ('wmiprvse.exe','werfault.exe','wermgr.exe','wmiadap.exe',
                                                     'wmiapsrv.exe','mofcomp.exe','unsecapp.exe','msiexec.exe',
                                                     'conhost.exe')
                     AND coalesce(lower(src_user), '') NOT IN ('system','local service','network service',
                                                               'localservice','networkservice')
                     AND NOT coalesce(is_machine, FALSE) AND NOT ends_with(coalesce(src_user, ''), '$'))))
           OR (command_line ILIKE '%wmic%' AND command_line ILIKE '%process call create%'))
    technique: T1047
    tactic: Execution
    severity: 70

  - id: unix_reverse_shell      # bash -i, /dev/tcp/, curl|wget piped to sh
    kind: match
    where: >-
      action = 'proc_start'
      AND (command_line ILIKE '%bash -i%' OR command_line ILIKE '%/dev/tcp/%'
           OR regexp_matches(command_line, '(?i)\b(curl|wget)\b[^|]*\|\s*(ba)?sh\b'))
    technique: T1059
    sub_technique: T1059.004
    tactic: Execution
    severity: 80

  # ---------------- coverage round B3 ----------------
  # indicator_removal_files: rm -rf /var/log, del /f /q; Sysinternals SDelete by image name or command line, or a
  # renamed SDelete (-accepteula with a pass count -p N and no -u account, which would be PsExec)
  - id: indicator_removal_files
    kind: match
    where: >-
      action = 'proc_start'
      AND (command_line ILIKE '%rm -rf /var/log%' OR command_line ILIKE '%del /f /q%'
           OR lower(process_name) IN ('sdelete.exe','sdelete64.exe','sdelete64a.exe')
           OR (command_line ILIKE '%sdelete%'
               AND regexp_matches(command_line, '(?i)(^|[\\/"\s])sdelete(64a?)?(\.exe)?"?(\s|$)'))
           OR (command_line ILIKE '%-accepteula%' AND regexp_matches(command_line, '(?i)\s[-/]p\s+\d\d?(\s|$)')
               AND NOT regexp_matches(command_line, '(?i)\s[-/]u\s')
               AND coalesce(lower(process_name), '') NOT IN ('psexec.exe','psexec64.exe','paexec.exe')))
    technique: T1070
    sub_technique: T1070.004
    tactic: Defense Impairment
    severity: 70

  - id: disable_security_tools  # Set-MpPreference with -Disable
    kind: match
    where: >-
      action IN ('proc_start','script_exec')
      AND command_line ILIKE '%set-mppreference%' AND command_line ILIKE '%-disable%'
    technique: T1562
    sub_technique: T1562.001
    tactic: Defense Impairment
    severity: 80

  # ---------------- Windows endpoint round W (public-dataset gaps, reports/ext/win_eval.md) ----------------
  # eventlog_service_disabled: the EventLog service start type written (Sysmon 13 on ...\Services\EventLog\Start;
  # the value data is not a canonical column, so any write fires: Windows itself does not rewrite it), or a command
  # / PowerShell script block that disables or stops the EventLog service (sc config|stop, Set-Service, Stop-Service,
  # net stop, reg add / Set-ItemProperty of Start = 4). Script blocks (4103/4104) are action 'script_exec'.
  - id: eventlog_service_disabled
    kind: match
    where: >-
      (action = 'reg_set'
       AND regexp_matches(registry_path, '(?i)\\(currentcontrolset|controlset\d\d\d)\\services\\eventlog\\start$'))
      OR ((action = 'proc_start' OR event_id IN (4103, 4104))
          AND (command_line ILIKE '%eventlog%' OR command_line ILIKE '%event log%')
          AND (regexp_matches(command_line,
                 '(?i)\bsc(\.exe)?"?\s+(\\\\\S+\s+)?config\s+"?eventlog"?\s+start\s*=\s*"?disabled')
               OR regexp_matches(command_line,
                 '(?i)\b(sc(\.exe)?"?\s+(\\\\\S+\s+)?|net1?(\.exe)?"?\s+)stop\s+"?eventlog\b')
               OR (regexp_matches(command_line, '(?i)\b(set|stop)-service\b')
                   AND regexp_matches(command_line, '(?i)(^|[\s"''=:(])(eventlog|"windows event log")\b')
                   AND (regexp_matches(command_line, '(?i)\bstop-service\b')
                        OR regexp_matches(command_line, '(?i)-start(up)?(type|mode)\s+["'']?(disabled|4)\b')))
               OR (regexp_matches(command_line, '(?i)\\services\\eventlog\b')
                   AND regexp_matches(command_line, '(?i)\bstart\b')
                   AND regexp_matches(command_line, '(?i)(/d\s+|-value\s+|=\s*)["'']?(4|0x0*4)["'']?(\s|$|;|\))'))))
    technique: T1685
    sub_technique: T1685.001
    tactic: Defense Impairment
    severity: 80

  # com_hijack: a per-user COM server registration (Sysmon 12 key create / 13 value set) for a CLSID's
  # InprocServer32 / LocalServer32 under HKCU\Software\Classes (Sysmon: HKU\<SID>_Classes); it overrides the
  # machine-wide HKLM entry for that user. Known per-user COM installers (OneDrive, Teams, MSI) are skipped.
  # Sysmon 12 also logs DeleteKey (no EventType column): a hijack removal fires too.
  - id: com_hijack
    kind: match
    where: >-
      (action = 'reg_set' OR (event_id = 12 AND action = 'other'))
      AND registry_path ILIKE '%clsid%'
      AND regexp_matches(registry_path,
            '(?i)^(hkcu|hkey_current_user|hku\\[^\\]+|hkey_users\\[^\\]+)(\\software\\classes|_classes)'
            || '\\(wow6432node\\)?clsid\\\x7b[0-9a-f-]+\x7d\\(inprocserver32|localserver32)(\\|$)')
      AND coalesce(lower(process_name), '') NOT IN ('onedrive.exe','onedrivesetup.exe','filecoauth.exe',
                                                    'filesyncconfig.exe','teams.exe','ms-teams.exe','msteams.exe',
                                                    'msiexec.exe','officeclicktorun.exe')
    technique: T1546
    sub_technique: T1546.015
    tactic: Persistence
    severity: 75

  # remote_service_exec: PsExec-style service execution (detect_templates2.remote_service_exec; thresholds
  # remote_svc_*). Secondary T1021.002 when a network logon to the host from a remote IP precedes it.
  - id: remote_service_exec
    kind: template
    template: remote_service_exec
    technique: T1569
    sub_technique: T1569.002
    tactic: Execution
    severity: 75
    secondary: {technique: T1021, sub_technique: T1021.002, tactic: Lateral Movement, severity: 75}

  - id: sudo_escalation         # sudo on a rare (user, host) pair
    kind: template
    template: sudo_escalation
    technique: T1548
    sub_technique: T1548.003
    tactic: Privilege Escalation
    severity: 60

  # ---------------- coverage round B4 ----------------
  - id: lsass_dump              # mimikatz, sekurlsa, procdump+lsass, comsvcs+minidump (also script blocks)
    kind: match
    where: >-
      action IN ('proc_start','script_exec')
      AND (command_line ILIKE '%mimikatz%' OR lower(process_name) LIKE '%mimikatz%' OR command_line ILIKE '%sekurlsa%'
           OR (command_line ILIKE '%procdump%' AND command_line ILIKE '%lsass%')
           OR (command_line ILIKE '%comsvcs%' AND command_line ILIKE '%minidump%'))
    technique: T1003
    sub_technique: T1003.001
    tactic: Credential Access
    severity: 90

  - id: kerberoasting           # kerberos_tgs 0x17 for many services by one account
    kind: template
    template: kerberoasting
    technique: T1558
    sub_technique: T1558.003
    tactic: Credential Access
    severity: 80

  - id: pass_the_hash           # logon_type 9 + negotiate/ntlm, rare pair
    kind: template
    template: pass_the_hash
    technique: T1550
    sub_technique: T1550.002
    tactic: Lateral Movement
    severity: 80

  # ---------------- firewall pack A (FortiGate, DEVELOPMENT.md §15.9) ----------------
  - id: fw_admin_bruteforce     # firewall admin login failures from an external IP, then success
    kind: template
    template: brute_force_then_success
    params: {bf_key: [src_ip, target_user, host]}   # many internet IPs fail against admin
    filter: "source_type = 'fortigate_kv' AND coalesce(logon_type, 0) <> 10 AND src_ip IS NOT NULL AND NOT al_is_internal_ip(src_ip)"
    technique: T1110
    sub_technique: T1110.001
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, tactic: Initial Access, severity: 85}

  - id: fw_admin_spray          # one external IP failing for many admin accounts
    kind: template
    template: password_spray
    filter: "source_type = 'fortigate_kv' AND coalesce(logon_type, 0) <> 10 AND src_ip IS NOT NULL AND NOT al_is_internal_ip(src_ip)"
    technique: T1110
    sub_technique: T1110.003
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1078, tactic: Initial Access, severity: 85}

  - id: vpn_bruteforce_success  # VPN (logon_type 10) failures then success for one user
    kind: template
    template: brute_force_then_success
    filter: "source_type = 'fortigate_kv' AND logon_type = 10"
    params: {bf_min_failures: 10, bf_require_success: true}
    technique: T1110
    sub_technique: T1110.001
    tactic: Credential Access
    severity: 75
    secondary: {technique: T1133, tactic: Initial Access, severity: 85}

  # ---------------- firewall pack B ----------------
  - id: ips_signatures          # IPS signature -> technique map (first pattern wins)
    kind: template
    template: signature_map
    action: ips_alert
    exclude_blocked: true         # allowed hits only (blocked: ips_blocked)
    technique: T1190
    tactic: Initial Access
    severity: 90
    signatures: &ips_signature_map   # first match wins; optional direction: inbound | outbound | internal
      - {pattern: 'Buffer.Overflow|Remote.Code.Execution', direction: internal,
         technique: T1210, tactic: Lateral Movement}
      - {pattern: 'SSLVPN.*Path.Traversal|Log4j|PHP.CGI|HTTP\.sys|Buffer.Overflow|Remote.Code.Execution',
         technique: T1190, tactic: Initial Access}
      - {pattern: 'SSH.*Brute.Force', technique: T1110, tactic: Credential Access}
      - {pattern: 'Mirai|Botnet', direction: inbound, technique: T1595, tactic: Reconnaissance}
      - {pattern: 'Mirai|Botnet', technique: T1071, tactic: Command and Control}
      - {pattern: 'DNS.Zone.Transfer', technique: T1590, sub_technique: T1590.002, tactic: Reconnaissance}
      - {pattern: 'SMB.*Information.Disclosure', technique: T1210, tactic: Lateral Movement}

  - id: av_malware_download     # antivirus detection the device let through (blocked ones: av_blocked)
    kind: match
    where: "action = 'av_alert'"
    exclude_blocked: true         # outcome not in thresholds.blocked_outcomes (blocked: av_blocked)
    technique: T1105
    tactic: Command and Control
    severity: 80

  # ---------------- firewall pack C ----------------
  - id: port_scan               # one src to many ports on one dst, or many internal dsts on one port
    kind: template
    template: port_scan
    technique: T1046
    tactic: Discovery
    severity: 55
    secondary: {technique: T1595, tactic: Reconnaissance, severity: 30}   # external (internet) scanner

  - id: internal_lateral        # rare internal -> internal SMB/RDP/WinRM/SSH connection
    kind: template
    template: internal_lateral
    technique: T1021
    tactic: Lateral Movement
    severity: 65

  - id: inbound_remote_service  # rare allowed internet -> internal SMB/RDP/WinRM/SSH connection
    kind: template
    template: internal_lateral
    params: {lateral_direction: inbound}
    technique: T1021
    tactic: Lateral Movement
    severity: 70

  # ---------------- firewall pack D ----------------
  - id: fw_config_change_after_login   # config change soon after the same user's external login
    kind: template
    template: config_change_after_login
    technique: T1562
    sub_technique: T1562.004
    tactic: Defense Impairment
    severity: 80

  - id: tor_or_proxy_app        # application control: anonymising proxy apps
    kind: match
    where: "action IN ('app_ctrl', 'conn_allowed', 'conn_denied') AND lower(app) IN {ioc.proxy_apps}"
    technique: T1090
    sub_technique: T1090.003
    tactic: Command and Control
    severity: 70

  - id: web_malicious_category  # web filter blocked a malicious / phishing category
    kind: match
    where: "action = 'web_blocked' AND lower(signature) IN {ioc.malicious_web_categories}"
    technique: T1189
    tactic: Initial Access
    severity: 60

  # ---------------- firewall pack: prevented detections (bounded: one alert per subject per day) ----------------
  - id: av_blocked              # AV detections the device blocked
    kind: template
    template: blocked_daily
    actions: [av_alert]
    technique: T1105
    tactic: Command and Control
    severity: 30

  - id: ips_blocked             # IPS detections the device blocked
    kind: template
    template: blocked_daily
    actions: [ips_alert]
    signatures: *ips_signature_map    # same labels as ips_signatures; unmatched -> T1190
    technique: T1190
    tactic: Initial Access
    severity: 30

  - id: vpn_login_context       # VPN login from an IP that just exploited the portal or failed repeatedly
    kind: template
    template: vpn_login_context
    technique: T1133
    tactic: Initial Access
    severity: 75
