# Field aliases per source format (DEVELOPMENT.md §3.2, §3.3, §15.5).
#
# How ingest uses this file:
# - Every source is mapped to the same intermediate fields (left column below), then one shared
#   normalisation step turns them into the canonical columns of schemas.CANONICAL_COLUMNS.
# - For each field the aliases are tried in order; the FIRST NON-NULL alias wins. An alias that is absent
#   from a file yields NULL (never a binder error).
# - JSON aliases are DuckDB JSONPath strings; CSV aliases are header names (case-insensitive);
#   CEF aliases are extension keys.
#
# Intermediate fields:
#   ts, event_id, event_action, outcome, logon_id, logon_type, host, host_ip,
#   user          role-dependent account (logon actions -> target_user, else -> src_user)
#   subject_user  explicit actor account                         -> src_user
#   target_name   explicit target account (new user, logon target) -> target_user
#   member_name   group member (Windows MemberName, may be a DN)  -> target_user for group adds
#   group, src_ip, src_port, dst_ip, dst_port, dst_domain, process_name, process_path,
#   parent_process, command_line, file_path, file_ext, registry_path, bytes, direction, service_name,
#   auth_package, ticket_encryption
#
# NEVER alias generator label fields: threat, rule, labels, labels_extra, event.kind, event.severity,
# event.module, event.dataset (and the CEF header name/signature or cs2 "mitre", which carry rule labels).

json_sources:
  # ECS JSON lines: the provided generator (reports/edr_log_generator.py), tools/scenarios.py, winlogbeat.
  ecs_json:
    detect_any: ["@timestamp", "event.action", "ecs.version"]
    fields:
      ts:            ['$."@timestamp"', '$.timestamp', '$.event.created']
      event_id:      ['$.winlog.event_id', '$.event.code']
      event_action:  ['$.event.action']
      outcome:       ['$.event.outcome']
      logon_id:      ['$.winlog.logon.id', '$.winlog.event_data.TargetLogonId', '$.winlog.event_data.SubjectLogonId']
      logon_type:    ['$.winlog.logon.type', '$.winlog.event_data.LogonType']
      host:          ['$.host.name', '$.host.hostname', '$.agent.hostname']
      host_ip:       ['$.host.ip[0]', '$.host.ip']
      user:          ['$.user.name', '$.winlog.event_data.TargetUserName']
      subject_user:  ['$.winlog.event_data.SubjectUserName']
      target_name:   ['$.user.target.name']
      member_name:   ['$.winlog.event_data.MemberName']
      group:         ['$.group.name', '$.user.target.group.name']
      src_ip:        ['$.source.ip', '$.winlog.event_data.IpAddress']
      src_port:      ['$.source.port', '$.winlog.event_data.IpPort']
      dst_ip:        ['$.destination.ip']
      dst_port:      ['$.destination.port']
      dst_domain:    ['$.destination.domain', '$.dns.question.name', '$.url.domain']
      process_name:  ['$.process.name']
      process_path:  ['$.process.executable']
      parent_process: ['$.process.parent.name', '$.process.parent.executable']
      command_line:  ['$.process.command_line']
      file_path:     ['$.file.path']
      file_ext:      ['$.file.extension']
      registry_path: ['$.registry.path']
      bytes:         ['$.network.bytes', '$.source.bytes']
      direction:     ['$.network.direction']
      service_name:  ['$.service.name', '$.winlog.event_data.ServiceName']
      auth_package:  ['$.winlog.event_data.AuthenticationPackageName', '$.winlog.event_data.LmPackageName']
      ticket_encryption: ['$.winlog.event_data.TicketEncryptionType']

  # Windows EVTX exported as JSON (flat, or nested Event.System / Event.EventData).
  win_json:
    detect_any: ["EventID", "TimeCreated", "Event.System.EventID", "System.EventID", "TimeCreated.SystemTime"]
    fields:
      ts:            ['$.TimeCreated.SystemTime', '$.TimeCreated', '$.Event.System.TimeCreated.SystemTime',
                      '$.System.TimeCreated.SystemTime', '$.UtcTime', '$.Event.EventData.UtcTime']
      event_id:      ['$.EventID', '$.Event.System.EventID', '$.System.EventID', '$.EventID.value']
      event_action:  ['$.Action']
      outcome:       ['$.Keywords']
      logon_id:      ['$.TargetLogonId', '$.SubjectLogonId', '$.Event.EventData.TargetLogonId',
                      '$.Event.EventData.SubjectLogonId', '$.EventData.TargetLogonId']
      logon_type:    ['$.LogonType', '$.Event.EventData.LogonType', '$.EventData.LogonType']
      host:          ['$.Computer', '$.Event.System.Computer', '$.System.Computer', '$.Hostname']
      host_ip:       ['$.HostIp']
      user:          ['$.User']
      subject_user:  ['$.SubjectUserName', '$.Event.EventData.SubjectUserName', '$.EventData.SubjectUserName']
      target_name:   ['$.TargetUserName', '$.Event.EventData.TargetUserName', '$.EventData.TargetUserName']
      member_name:   ['$.MemberName', '$.Event.EventData.MemberName', '$.EventData.MemberName']
      group:         ['$.GroupName', '$.TargetGroupName']
      src_ip:        ['$.IpAddress', '$.SourceIp', '$.Event.EventData.IpAddress', '$.EventData.IpAddress']
      src_port:      ['$.IpPort', '$.SourcePort', '$.Event.EventData.IpPort']
      dst_ip:        ['$.DestinationIp', '$.Event.EventData.DestinationIp']
      dst_port:      ['$.DestinationPort', '$.Event.EventData.DestinationPort']
      dst_domain:    ['$.QueryName', '$.DestinationHostname', '$.Event.EventData.QueryName']
      process_name:  ['$.ProcessName', '$.NewProcessName']
      process_path:  ['$.Image', '$.NewProcessName', '$.Event.EventData.Image', '$.ImagePath']
      parent_process: ['$.ParentImage', '$.ParentProcessName', '$.Event.EventData.ParentImage']
      command_line:  ['$.CommandLine', '$.Event.EventData.CommandLine']
      file_path:     ['$.TargetFilename', '$.Event.EventData.TargetFilename']
      file_ext:      ['$.FileExtension']
      registry_path: ['$.TargetObject', '$.Event.EventData.TargetObject']
      bytes:         ['$.BytesSent']
      direction:     ['$.Direction']
      service_name:  ['$.ServiceName', '$.Event.EventData.ServiceName', '$.EventData.ServiceName']
      auth_package:  ['$.AuthenticationPackageName', '$.LmPackageName', '$.Event.EventData.AuthenticationPackageName',
                      '$.Event.EventData.LmPackageName', '$.EventData.AuthenticationPackageName']
      ticket_encryption: ['$.TicketEncryptionType', '$.Event.EventData.TicketEncryptionType',
                          '$.EventData.TicketEncryptionType']

csv_sources:
  # Firewall exports (any extension). Detected when >= min_matches header names below are present.
  firewall_csv:
    detect_any: ["dport", "bytes_sent", "disposition", "src", "dst", "sport", "device"]
    min_matches: 2
    fields:
      ts:            [timestamp, time, datetime, date]
      host:          [device, host, hostname, devname]
      src_ip:        [src, src_ip, srcip, source]
      src_port:      [sport, src_port, srcport]
      dst_ip:        [dst, dst_ip, dstip, destination]
      dst_port:      [dport, dst_port, dstport]
      bytes:         [bytes_sent, sentbyte, bytes_out]
      event_action:  [action, disposition]
      user:          [user, username]
      dst_domain:    [domain, hostname_dst]

cef:
  # CEF extension keys. Header name / signature id are NOT read (generator puts rule labels there).
  fields:
    ts:            [rt, start, end]
    host:          [dvchost, dvc]
    event_action:  [act]
    outcome:       [outcome]
    user:          [suser]
    target_name:   [duser]
    src_ip:        [src]
    src_port:      [spt]
    dst_ip:        [dst]
    dst_port:      [dpt]
    dst_domain:    [destinationDnsDomain, dhost]
    process_name:  [dproc, sproc]
    process_path:  [filePath]
    command_line:  [cs1]
    file_path:     [fname]
    bytes:         [out]

syslog:
  # RFC 3164 / ISO-prefixed syslog. Timestamp is optional so a line without one still yields host/process.
  # Year: RFC 3164 has none, so pipeline.yaml baseline_year is used for every line. LIMITATION: a Dec -> Jan
  # rollover inside one file is not corrected (it would need a window over the whole input); split such
  # files or use ISO-timestamped syslog.
  # Groups: 1 bsd ts, 2 iso ts, 3 host, 4 process, 5 pid, 6 message. The process is anchored after the host.
  line_regex: '^(?:<\d+>)?(?:(?:([A-Z][a-z]{2}\s+\d{1,2}\s+\d\d:\d\d:\d\d)|(\d{4}-\d\d-\d\dT\S+))\s+)?(\S+)\s+([^\s\[:]+)(?:\[(\d+)\])?:\s*(.*)$'
  # Message patterns (tried in order, first match wins). fields: intermediate field -> regex group.
  messages:
    - process: sshd
      regex: '^Accepted (\S+) for (\S+) from (\S+) port (\d+)'
      action: login_success
      outcome: success
      fields: {user: 2, src_ip: 3, src_port: 4}
      const: {dst_port: "22", logon_type: "10"}
    - process: sshd
      regex: '^Failed (\S+) for (?:invalid user )?(\S+) from (\S+) port (\d+)'
      action: login_failed
      outcome: failure
      fields: {user: 2, src_ip: 3, src_port: 4}
      const: {dst_port: "22", logon_type: "10"}
    - process: sshd
      regex: '^Invalid user (\S*) from (\S+)(?: port (\d+))?'
      action: login_failed
      outcome: failure
      fields: {user: 1, src_ip: 2, src_port: 3}
      const: {dst_port: "22", logon_type: "10"}
    - process: useradd
      regex: 'new user: name=([^,\s]+)'
      action: user_created
      outcome: success
      fields: {target_name: 1}
    - process: usermod
      regex: "add '([^']+)' to group '([^']+)'"
      action: group_member_added
      outcome: success
      fields: {member_name: 1, group: 2}
    - process: gpasswd
      regex: "user (\\S+) added by (\\S+) to group (\\S+)"
      action: group_member_added
      outcome: success
      fields: {member_name: 1, subject_user: 2, group: 3}
    - process: sudo
      regex: '^\s*(\S+) : .*USER=(\S+) ; COMMAND=(.*)$'
      action: proc_start
      outcome: success
      fields: {user: 1, target_name: 2, command_line: 3}

# key=value logs (DEVELOPMENT.md §15.9). Each key is read with an anchored regex `(?:^| )key=("..."|[^ ]*)`,
# unquoted; '' and 'N/A' -> NULL. Lines matching none of line_regex are counted as dropped (unparseable_line).
kv_sources:
  fortigate_kv:
    detect_regex:                       # profile: first matching line among the first sniff_lines decides
      - '^date=\d{4}-\d\d-\d\d time=\d\d:\d\d:\d\d'
      - '^(?:[a-z_0-9]+=(?:"[^"]*"|[^ "]+) +){3}'   # >= 3 leading key= tokens
    line_regex: '^(?:[a-z_0-9]+=(?:"[^"]*"|[^ "]*) +){2}'
    null_values: ["", "N/A", "n/a"]
    ts:
      epoch_key: eventtime              # 19 digits ns, 16 us, 13 ms, 10 s
      date_key: date
      time_key: time
      tz_key: tz                        # "+0530"
      # Measured on the official tiers: eventtime == local date+time written as if it were UTC (+ ms), i.e. it is
      # off by the tz offset. When eventtime is within 1 s of naive date+time, ts = date+time+tz (true UTC) plus
      # eventtime's sub-second part. Set false to trust eventtime as UTC epoch.
      eventtime_is_local: true
    # intermediate field -> keys (first non-null wins); {key, regex} = regex group 1 of that key's value
    fields:
      host:          [devname]
      # remip = remote peer of VPN logins (the attacker side); tunnelip (assigned inside address) is not the source
      src_ip:        [remip, srcip, {key: ui, regex: '\(([0-9A-Fa-f:.]+)\)'}]
      src_port:      [srcport]
      dst_ip:        [dstip]
      dst_port:      [dstport]
      bytes:         [sentbyte]
      bytes_in:      [rcvdbyte]
      user:          [user]
      dst_domain:    [hostname]
      file_path:     [url]
      service_name:  [service]
      app:           [app]
      signature:     [attack, virus, catdesc]
      vendor_severity: [severity, level]     # vendor fields, not generator labels
      src_zone:      [srcintfrole]
      dst_zone:      [dstintfrole]
      outcome:       [status]
    # UTM verdict -> outcome (blocked / allowed) when type/subtype match; status (logins) still wins.
    outcome_from_action:
      when: {type: [utm], subtype: [ips, virus, webfilter, app-ctrl]}
      map:
        dropped: blocked
        blocked: blocked
        block: blocked
        reset: blocked
        deny: blocked
        pass: allowed
        pass_session: allowed
        detected: allowed
        monitored: allowed
        passthrough: allowed
    # Action rules, first match wins. when: key -> allowed lower-case values (all keys must match).
    # Rule outcome / logon_type apply when the line has no status / type of its own.
    actions:
      - {when: {type: [traffic], action: [accept, close, timeout, server-rst, client-rst, pass]}, action: conn_allowed, outcome: success}
      - {when: {type: [traffic], action: [deny, blocked, dropped, block, drop]}, action: conn_denied, outcome: failure}
      - {when: {type: [event], subtype: [system], logdesc: [admin login failed]}, action: login_failed, outcome: failure}
      - {when: {type: [event], subtype: [system], logdesc: [admin login successful]}, action: login_success, outcome: success}
      - {when: {type: [event], subtype: [system], action: [login], status: [success]}, action: login_success}
      - {when: {type: [event], subtype: [system], action: [login], status: [failed, failure]}, action: login_failed}
      - {when: {type: [event], subtype: [vpn], action: [ssl-login, tunnel-up], status: [success]}, action: login_success, logon_type: "10"}
      - {when: {type: [event], subtype: [vpn], action: [ssl-login, tunnel-up], status: [failed, failure]}, action: login_failed, logon_type: "10"}
      - {when: {type: [utm], subtype: [ips]}, action: ips_alert}
      - {when: {type: [utm], subtype: [virus]}, action: av_alert}
      - {when: {type: [utm], subtype: [webfilter], action: [blocked, block]}, action: web_blocked, outcome: failure}
      - {when: {type: [utm], subtype: [webfilter]}, action: web_access}
      - {when: {type: [utm], subtype: [dns]}, action: dns_query}
      - {when: {type: [utm], subtype: [app-ctrl]}, action: app_ctrl}
      - {when: {logdesc: [attribute configured, object attribute configured]}, action: config_change}
      - {when: {type: [event], action: [edit, add, delete]}, action: config_change}

# Action normalisation (§3.3, §15.5). Precedence: event_id -> event_action -> "other".
action_map:
  event_ids:
    4625: login_failed
    4771: login_failed
    4624: login_success
    4672: priv_assigned
    4769: kerberos_tgs     # TGS request; requesting account -> src_user, ServiceName -> service_name
    4648: explicit_creds   # logon with explicit credentials; actor -> src_user, TargetUserName -> target_user
    4720: user_created
    4728: group_member_added
    4732: group_member_added
    4756: group_member_added
    4688: proc_start
    1: proc_start          # Sysmon process create
    3: conn_out            # Sysmon network connection
    22: dns_query          # Sysmon DNS
    11: file_write         # Sysmon file create
    13: reg_set            # Sysmon registry value set
    4698: scheduled_task
    7045: service_installed
    4697: service_installed
    1102: log_cleared
    104: log_cleared
  # event.action (lower-case) -> action, or {success, failure, default} split on the normalised outcome.
  event_actions:
    user_logon: {success: login_success, failure: login_failed, default: other}
    logon: {success: login_success, failure: login_failed, default: other}
    logged-in: login_success
    logon-failed: login_failed
    special_privileges_assigned: priv_assigned
    user_created: user_created
    added-user-account: user_created
    group_member_added: group_member_added
    added-member-to-group: group_member_added
    process_created: proc_start
    process_start: proc_start
    network_connection: conn_out
    dns_query: dns_query
    file_modified: file_write
    file_created: file_write
    file_rename: file_rename
    registry_value_set: reg_set
    service_installed: service_installed
    scheduled_task_created: scheduled_task
    kerberos_service_ticket_requested: kerberos_tgs
    explicit_credential_logon: explicit_creds
    logged-in-explicit: explicit_creds
    log_cleared: log_cleared
    # firewall / CEF dispositions
    allow: conn_allowed
    allowed: conn_allowed
    accept: conn_allowed
    accepted: conn_allowed
    permit: conn_allowed
    pass: conn_allowed
    deny: conn_denied
    denied: conn_denied
    drop: conn_denied
    dropped: conn_denied
    block: conn_denied
    blocked: conn_denied
    reject: conn_denied
  # canonical outcome -> raw values (lower-case); checked in this order
  outcomes:
    success: [success, succeeded, ok, true, "audit success"]
    failure: [failure, failed, fail, false, "audit failure", denied]
    blocked: [blocked]        # vendor security control stopped it (FortiGate UTM)
    allowed: [allowed]        # vendor security control saw it and let it through

# Logon type names -> integers (numbers pass through).
logon_types:
  interactive: 2
  network: 3
  batch: 4
  service: 5
  unlock: 7
  networkcleartext: 8
  newcredentials: 9
  remoteinteractive: 10
  cachedinteractive: 11
default_logon_type_ssh: 10   # sshd logons without a type

# Removed from raw_line before it is stored (ground truth / generator hints).
label_keys: [threat, rule, labels, labels_extra]
label_nested_keys: {event: [kind, severity, module, dataset]}
