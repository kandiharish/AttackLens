# Pipeline runtime settings (DEVELOPMENT.md §4, §12). Read by run.py, profile.py, ingest.py, telemetry.py.
# Relative paths are resolved against the repo root.

memory_limit: "5GB"          # DuckDB memory_limit for batch runs
live_memory_limit: "1.5GB"   # DuckDB memory_limit for live mode (live.py)
threads: null                # null -> os.cpu_count()
temp_directory: "data/spill" # DuckDB spill directory
parquet_root: "data/parquet" # default parquet dir = <parquet_root>/<basename of --out>

# Syslog (RFC 3164) lines carry no year; this one is prefixed before parsing.
baseline_year: 2026

profile:
  sample_lines: 20000        # lines per JSON file sampled for field paths / actions (bounded)
  sniff_bytes: 65536         # bytes read to find the first non-empty lines
  sniff_lines: 10            # first non-empty lines tried; the first in a known format decides
  kv_count_keys: [type, subtype, action]   # key=value sources: value counts recorded in source_profile.json
  skip_names: ["manifest.json"]
  skip_suffixes: [".md"]
  skip_dir_components: ["ground_truth"]

ingest:
  # Extra strptime formats tried after try_cast(x AS TIMESTAMPTZ) (all interpreted as UTC).
  ts_formats:
    - "%b %d %Y %H:%M:%S"
    - "%b %d %Y %H:%M:%S.%g"
    - "%d/%b/%Y:%H:%M:%S %z"
    - "%m/%d/%Y %H:%M:%S"
    - "%m/%d/%Y %I:%M:%S %p"
    - "%Y/%m/%d %H:%M:%S"
    - "%d.%m.%Y %H:%M:%S"
  syslog_ts_format: "%Y %b %d %H:%M:%S"
  compression: "ZSTD"
  # Bounded ingest memory (measured 31 Oct, g1 / g10, 12 threads). Peak RSS grows with the data volume of ONE
  # partitioned COPY, so files are packed into batches of <= batch_bytes (one COPY each, unique file names in
  # the same hive layout). A single file larger than the budget is its own batch.
  #   g10 part (1.8 GB) alone: defaults 4876 MB / 45.6 s -> flush 16384 + rg 32768: 2126 MB / 19.9 s
  #   5.4 GB in one COPY with these knobs: 2970 MB
  batch_bytes: 2.0e9
  partitioned_write_flush_threshold: 16384   # rows buffered per partition before flushing (DuckDB default 524288)
  partitioned_write_max_open_files: 100      # DuckDB default
  row_group_size: 32768                      # Parquet row group rows (DuckDB default 122880)
  threads: null                              # COPY-only thread override; null = connection threads

telemetry:
  interval_s: 0.5            # RSS sampling period
