[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attacklens"
version = "0.1.0"
description = "AttackLens: kill chain and attack path analysis over large security logs"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyyaml",
  "networkx",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "psutil",
  "jinja2",
  "python-multipart>=0.0.9",   # streaming multipart parser for POST /api/uploads (Apache-2.0)
  "pysigma>=2.0.1,<3",   # SigmaHQ rule parsing (LGPL-2.1, used unmodified)
]

[project.optional-dependencies]
llm = ["anthropic"]
cloud = [
  "boto3>=1.28",          # AWS CloudTrail connector (Apache-2.0)
  "cryptography>=42",     # RS256 signing of the GCP service-account JWT (Apache-2.0 / BSD)
]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["attacklens*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
markers = ["stress: long-running stress tests (deselect with -m 'not stress')"]

[tool.setuptools.package-data]
attacklens = ["templates/*.j2"]
