[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attacklens"
version = "0.1.0"
description = "AttackLens: kill chain and attack path analysis over large security logs"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyyaml",
  "networkx",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "psutil",
  "jinja2",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["attacklens*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
markers = ["stress: long-running stress tests (deselect with -m 'not stress')"]

[tool.setuptools.package-data]
attacklens = ["templates/*.j2"]
